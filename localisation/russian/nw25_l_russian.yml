 nw25fra.90.t:0 "Договор подписан"
 nw25fra.90.d:0 "Партнёр подтвердил новые условия. Соглашение вступило в силу на оговорённый срок; его действие будет прекращено, если исчезнет соответствующая дипломатическая основа."
 nw25fra.90.a:0 "Принять к сведению."
 nw25fra.91.t:0 "Предложение отклонено"
 nw25fra.91.d:0 "Партнёр не готов принять новые обязательства. Прежние договоры и гарантии сохраняются. После завершения срока ожидания можно вернуться к переговорам."
 nw25fra.91.a:0 "Закрыть этот раунд."
 nw25sri.90.t:0 "Договор подписан"
 nw25sri.90.d:0 "Партнёр подтвердил новые условия. Соглашение вступило в силу на оговорённый срок; его действие будет прекращено, если исчезнет соответствующая дипломатическая основа."
 nw25sri.90.a:0 "Принять к сведению."
 nw25sri.91.t:0 "Предложение отклонено"
 nw25sri.91.d:0 "Партнёр не готов принять новые обязательства. Прежние договоры и гарантии сохраняются. После завершения срока ожидания можно вернуться к переговорам."
 nw25sri.91.a:0 "Закрыть этот раунд."
 nw25eng.90.t:0 "Договор подписан"
 nw25eng.90.d:0 "Партнёр подтвердил новые условия. Соглашение вступило в силу на оговорённый срок; его действие будет прекращено, если исчезнет соответствующая дипломатическая основа."
 nw25eng.90.a:0 "Принять к сведению."
 nw25eng.91.t:0 "Предложение отклонено"
 nw25eng.91.d:0 "Партнёр не готов принять новые обязательства. Прежние договоры и гарантии сохраняются. После завершения срока ожидания можно вернуться к переговорам."
 nw25eng.91.a:0 "Закрыть этот раунд."
 nw25fra.12.t:0 "Французское предложение о хозяйственных ограничениях"
 nw25fra.12.d:0 "Предложение касается новых закупок и хозяйственного сотрудничества. Принятие не меняет наши границы, существующие гарантии или политический статус. Полное соглашение действует год, ограниченное — полгода; отказ сохраняет прежние отношения."
 nw25fra.12.a:0 "Подписать договор на согласованных условиях."
 nw25fra.12.b:0 "Согласиться на меньший объём обязательств."
 nw25fra.12.c:0 "Отказаться от нового соглашения."
 nw25fra.12.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.50.t:0 "Предложение итальянской хозяйственной конференции"
 nw25sri.50.d:0 "Предложение касается новых закупок и хозяйственного сотрудничества. Принятие не меняет наши границы, существующие гарантии или политический статус. Полное соглашение действует год, ограниченное — полгода; отказ сохраняет прежние отношения."
 nw25sri.50.a:0 "Подписать договор на согласованных условиях."
 nw25sri.50.b:0 "Согласиться на меньший объём обязательств."
 nw25sri.50.c:0 "Отказаться от нового соглашения."
 nw25sri.50.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.51.t:0 "Предложение итальянской хозяйственной конференции"
 nw25sri.51.d:0 "Предложение касается новых закупок и хозяйственного сотрудничества. Принятие не меняет наши границы, существующие гарантии или политический статус. Полное соглашение действует год, ограниченное — полгода; отказ сохраняет прежние отношения."
 nw25sri.51.a:0 "Подписать договор на согласованных условиях."
 nw25sri.51.b:0 "Согласиться на меньший объём обязательств."
 nw25sri.51.c:0 "Отказаться от нового соглашения."
 nw25sri.51.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25fra.10.t:0 "Новые условия русского кредита"
 nw25fra.10.d:0 "Париж предлагает расширить кредитную линию на год. Средства ускорят промышленные заказы, но обслуживание нового займа потребует политических ресурсов. Отказ касается только этого предложения: прежние облигации продолжают действовать."
 nw25fra.10.a:0 "Принять годовую кредитную линию."
 nw25fra.10.b:0 "Попросить меньший объём и срок."
 nw25fra.10.c:0 "Не принимать новых обязательств."
 nw25fra.10.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25fra.11.t:0 "Русский встречный проект"
 nw25fra.11.d:0 "Российское правительство предлагает ограничить новый кредит шестью месяцами. Банки получат меньше заказов, зато их зависимость от одного рынка вырастет слабее."
 nw25fra.11.a:0 "Принять ограниченную программу."
 nw25fra.11.b:0 "Завершить переговоры."
 nw25fra.11.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25fra.1.t:0 "Префекты и местные общества"
 nw25fra.1.d:0 "Провинциальные администрации признают власть Аксьон Франсез, но по-разному понимают пределы своих полномочий. Париж может закрепить соглашение с местными элитами или сосредоточить исполнение приказов в едином центре."
 nw25fra.1.a:0 "Договориться о разделении ответственности."
 nw25fra.1.b:0 "Подчинить исполнение общей директиве."
 nw25fra.1.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25fra.15.t:0 "Французское тарифное давление"
 nw25fra.15.d:0 "Париж ограничивает условия новых торговых сделок. Ответные меры тоже имеют цену; ни одна сторона не может без издержек диктовать другой условия хозяйства."
 nw25fra.15.a:0 "Ответить собственными ограничениями."
 nw25fra.15.b:0 "Искать соглашение за столом переговоров."
 nw25fra.15.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25fra.20.t:0 "Германский кризис и французские интересы"
 nw25fra.20.d:0 "Распад германского политического порядка поставил под вопрос привычные торговые маршруты. Французские ведомства предлагают разные способы защитить интересы страны. Ни один из этих вариантов сам по себе не меняет границ."
 nw25fra.20.a:0 "Усилить дипломатическое давление."
 nw25fra.20.b:0 "Защитить торговые расчёты."
 nw25fra.20.c:0 "Сохранить осторожность."
 nw25fra.20.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25fra.21.t:0 "Администрация возвращённого Эльзаса"
 nw25fra.21.d:0 "Регион действительно находится под французским управлением. Теперь необходимо согласовать работу местных учреждений, не подменяя административное восстановление ещё одной территориальной передачей."
 nw25fra.21.a:0 "Быстро унифицировать управление."
 nw25fra.21.b:0 "Оставить больше времени местным учреждениям."
 nw25fra.21.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25fra.22.t:0 "Нарушение русских расчётов"
 nw25fra.22.d:0 "Гражданская война в России нарушила исполнение контрактов. Высокая концентрация вложений сделала перебои заметными для французского рынка. Правительство может поддержать ликвидность или направить капитал во внутреннюю промышленность."
 nw25fra.22.a:0 "Поддержать расчёты резервами."
 nw25fra.22.b:0 "Ускорить диверсификацию."
 nw25fra.22.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25fra.30.t:0 "Французская гарантия и итальянский вопрос"
 nw25fra.30.d:0 "Итальянские переговоры затрагивают Сардинию-Пьемонт. Французская гарантия продолжает действовать; Париж может дополнить её ограниченной поддержкой или посредничеством. Решение о собственном будущем остаётся за защищаемой страной."
 nw25fra.30.a:0 "Выделить средства на поддержку Пьемонта."
 nw25fra.30.b:0 "Предложить посредничество."
 nw25fra.30.c:0 "Сохранить действующие обязательства."
 nw25fra.30.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.10.t:0 "Первый съезд советов"
 nw25sri.10.d:0 "Делегаты приехали в Неаполь с разными поручениями. Одни требуют закрепить местное самоуправление, другие прежде всего хотят восстановить общую систему закупок. Сегодня определяется повестка, а окончательное устройство предстоит обсудить отдельно."
 nw25sri.10.a:0 "Начать с полномочий местных советов."
 nw25sri.10.b:0 "Начать с сельских поставок."
 nw25sri.10.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.11.t:0 "Неаполитанские дебаты"
 nw25sri.11.d:0 "Республика должна решить, кто утверждает общие хозяйственные планы. Федерация советов требует постоянного согласования; центральный комитет получит больше полномочий, но столкнётся с местным сопротивлением."
 nw25sri.11.a:0 "Подготовить федеративное устройство."
 nw25sri.11.b:0 "Подготовить центральный исполнительный комитет."
 nw25sri.11.c:0 "Вернуться к обсуждению позднее."
 nw25sri.11.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.20.t:0 "Спор о хлебных поставках"
 nw25sri.20.d:0 "Сельские комитеты жалуются на условия закупок, а городские советы требуют выполнить план снабжения. От решения зависит, смогут ли учреждения республики восстановить доверие без новых чрезвычайных мер."
 nw25sri.20.a:0 "Пересмотреть закупочные условия."
 nw25sri.20.b:0 "Оплатить централизованные закупки."
 nw25sri.20.c:0 "Временно направить поставки в приоритетные районы."
 nw25sri.20.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.21.t:0 "Хлеб и станки"
 nw25sri.21.d:0 "Запасы и транспорт не позволяют одинаково быстро выполнить все заказы. Разовое распределение средств определит ближайший хозяйственный сезон, но ни одно решение не устраняет необходимость договариваться с производителями."
 nw25sri.21.a:0 "Оплатить дополнительные закупки продовольствия."
 nw25sri.21.b:0 "Поддержать военную промышленность."
 nw25sri.21.c:0 "Согласовать сбалансированный график."
 nw25sri.21.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.30.t:0 "Итальянская делегация в Берлине"
 nw25sri.30.d:0 "Представители советской Италии предлагают публичные контакты. СДПГ и КПГ расходятся в оценке того, насколько тесно парламентское движение должно связывать себя с иностранной революцией. Решение меняет напряжение, но не запускает автоматически раскол или войну."
 nw25sri.30.a:0 "Разрешить публичные контакты."
 nw25sri.30.b:0 "Ограничить встречу хозяйственными вопросами."
 nw25sri.30.c:0 "Сохранить дистанцию."
 nw25sri.30.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.31.t:0 "Революционная дипломатия"
 nw25sri.31.d:0 "Иностранные организации готовы разговаривать с Неаполем, но ждут ясного ответа: республика ищет признания или собирается прежде всего поддерживать революционные движения? Эти задачи требуют разных расходов и разных компромиссов."
 nw25sri.31.a:0 "Сосредоточиться на признании и торговле."
 nw25sri.31.b:0 "Поддерживать зарубежные рабочие организации."
 nw25sri.31.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.52.t:0 "Светская власть Рима"
 nw25sri.52.d:0 "Папская область остаётся политическим участником итальянского спора. Республика может гарантировать местные и религиозные права в обмен на переговоры, занять жёсткую позицию или временно отложить вопрос."
 nw25sri.52.a:0 "Предложить гарантии и переговоры."
 nw25sri.52.b:0 "Оспорить светские притязания папского правительства."
 nw25sri.52.c:0 "Отложить римский спор."
 nw25sri.52.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.40.t:0 "Будущее Венецианской федерации"
 nw25sri.40.d:0 "Неаполь предлагает хозяйственные переговоры. Согласие не отменит австрийского надзора: если Венеция остаётся субъектом Вены, договор потребует отдельного подтверждения."
 nw25sri.40.a:0 "Согласиться на переговоры."
 nw25sri.40.b:0 "Отказаться от нового соглашения."
 nw25sri.40.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.41.t:0 "Венеция просит разрешения на переговоры"
 nw25sri.41.d:0 "Венецианское правительство готово обсуждать торговлю с советской Италией. Это не предложение о выходе из австрийской системы; Вена решает, допустимы ли ограниченные хозяйственные контакты."
 nw25sri.41.a:0 "Разрешить хозяйственное соглашение."
 nw25sri.41.b:0 "Не санкционировать этот договор."
 nw25sri.41.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.42.t:0 "Напряжение на итальянской границе"
 nw25sri.42.d:0 "Советская Италия готовит давление на Венецию. Существующий статус страны сохраняется; Вена может выделить дополнительные средства на снабжение либо придерживаться прежних обязательств."
 nw25sri.42.a:0 "Поддержать венецианское снабжение."
 nw25sri.42.b:0 "Сохранить прежние обязательства."
 nw25sri.42.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25sri.60.t:0 "Перед вооружённым выступлением"
 nw25sri.60.d:0 "Штаб рассматривает операцию против Венецианской федерации. Подтверждение откроет на 60 дней отдельное решение о подготовке цели войны; само событие войну не объявляет. Проверьте текущие гарантии, сюзерена и фракцию адресата на дипломатическом экране: они сохраняют силу."
 nw25sri.60.a:0 "Утвердить подготовку цели войны."
 nw25sri.60.b:0 "Отложить операцию."
 nw25sri.60.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25_sri_operation_lbv_prepare:0 "Обсудить операцию против Венецианской федерации"
 nw25_sri_operation_lbv_prepare_desc:0 "Стоимость подготовки не возвращается при отсрочке. Подтверждение снижает единство советов и поддержку деревни на 5, стабильность на 2 процентных пункта. Гаранты и сюзерен сохраняют права; цель войны выдаётся только отдельным решением."
 nw25_sri_operation_lbv_execute:0 "Подготовить цель войны против Венецианской федерации"
 nw25_sri_operation_lbv_execute_desc:0 "Появится ограниченная по времени цель войны. Объявление войны остаётся отдельным дипломатическим действием с обычными последствиями гарантий и автономий."
 nw25sri.61.t:0 "Перед вооружённым выступлением"
 nw25sri.61.d:0 "Штаб рассматривает операцию против Сардинии-Пьемонта. Подтверждение откроет на 60 дней отдельное решение о подготовке цели войны; само событие войну не объявляет. Проверьте текущие гарантии, сюзерена и фракцию адресата на дипломатическом экране: они сохраняют силу."
