l_russian:
 nw25_fra_compromise:0 "Национальный административный компромисс"
 nw25_fra_compromise_desc:0 "Местные нотабли признают решения Парижа, а правительство закрепляет пределы ведомственного вмешательства. Казна оплачивает согласование интересов вместо постоянной борьбы за исполнение приказов."
 nw25_fra_directives:0 "Власть государственных директив"
 nw25_fra_directives_desc:0 "Префекты отвечают перед единым исполнительным центром. Государственные проекты проходят быстрее, но провинциальные общества воспринимают каждую новую директиву как проверку собственной самостоятельности."
 nw25_fra_resilience:0 "Диверсифицированный кредитный портфель"
 nw25_fra_resilience_desc:0 "Вложения распределены между внутренними предприятиями и несколькими внешними рынками. Французское влияние стало менее сосредоточенным, зато один иностранный кризис больше не определяет судьбу всех вкладчиков."
 nw25_fra_eastern_market:0 "Восточный кредитный рынок"
 nw25_fra_eastern_market_desc:0 "Банки направили дополнительные средства в российские заказы. Контракты поддерживают французскую промышленность, но концентрация вложений делает политические потрясения в России особенно ощутимыми."
 nw25_fra_credit_shock:0 "Замороженные русские обязательства"
 nw25_fra_credit_shock_desc:0 "Гражданская война нарушила расчёты и доставку заказов. Это временный кризис ликвидности: отказ от нового займа сам по себе не отменял прежних долгов."
 nw25_investment_cost:0 "Расходы переходной программы"
 nw25_investment_cost_desc:0 "Средства уже выделены на новую программу, а ожидаемые поставки и поступления ещё не получены."
 nw25_domestic_investment:0 "Внутренние промышленные заказы"
 nw25_domestic_investment_desc:0 "Государственные гарантии направили частные средства в действующие предприятия. Заказы ограничены сроком программы."
 nw25_fra_credit_partner:0 "Французская кредитная линия"
 nw25_fra_credit_partner_desc:0 "Новый заём обеспечивает оборудование и оборотные средства на год. Получатель оплачивает обслуживание кредита и сохраняет политическую самостоятельность."
 nw25_fra_partner:0 "Французское хозяйственное соглашение"
 nw25_fra_partner_desc:0 "Действующее соглашение поддерживает местные закупки и торговлю. Оно не изменяет территорию или автономный статус подписавшей страны."
 nw25_fra_network:0 "Средиземноморская сеть гарантий"
 nw25_fra_network_desc:0 "Подписанные региональные соглашения позволяют согласовывать закупки и снабжение. Поддержка исчезает, если больше не остаётся действующих партнёров."
 nw25_fra_network_full:0 "Разветвлённая средиземноморская сеть"
 nw25_fra_network_full_desc:0 "Несколько действующих соглашений обеспечивают устойчивые маршруты снабжения и общие хозяйственные заказы."
 nw25_trade_orders:0 "Договорные экспортные заказы"
 nw25_trade_orders_desc:0 "Ограниченная программа закупок использует действующие международные договоры. Она не предоставляет новых территорий и военных обязательств."
 nw25_tariff_cost:0 "Цена тарифного спора"
 nw25_tariff_cost_desc:0 "Торговые ограничения защищают часть производителей, но удорожают сырьё и усложняют взаимные поставки."
 nw25_alsace_transition:0 "Переходное управление Эльзасом"
 nw25_alsace_transition_desc:0 "После фактического возвращения региона требуется согласовать работу местных учреждений и французских ведомств."
 nw25_sri_federation:0 "Федерация итальянских советов"
 nw25_sri_federation_desc:0 "Местные советы участвуют в распределении общих ресурсов. Компромисс укрепляет республику, хотя согласование приказов требует времени."
 nw25_sri_central:0 "Центральная комиссия снабжения"
 nw25_sri_central_desc:0 "Республиканский центр распределяет основные военные заказы. Общий план ускоряет снабжение армии ценой самостоятельности местных организаций."
 nw25_sri_cooperatives:0 "Кооперативное хозяйство"
 nw25_sri_cooperatives_desc:0 "Сельские общины получили предсказуемые закупочные условия. Производители связаны с городами договорами, а не чрезвычайными изъятиями."
 nw25_sri_industry:0 "Производственные советы"
 nw25_sri_industry_desc:0 "Рабочие комитеты согласовали графики выпуска и снабжения предприятий. Часть прежних административных потерь удалось устранить."
 nw25_sri_retooling:0 "Перестройка производственных цепочек"
 nw25_sri_retooling_desc:0 "Перенастройка предприятий временно уменьшает выпуск. Программа завершится по окончании переходного срока."
 nw25_sri_council_dispute:0 "Спор местных советов"
 nw25_sri_council_dispute_desc:0 "Местные органы откладывают исполнение общих решений. Переговоры способны восстановить координацию без смены режима."
 nw25_sri_grain_shortage:0 "Срыв сельских поставок"
 nw25_sri_grain_shortage_desc:0 "Деревенские комитеты не доверяют закупщикам республики. Промышленное снабжение и довольствие армии страдают от перебоев."
 nw25_sri_militia:0 "Территориальная оборона"
 nw25_sri_militia_desc:0 "Местные части опираются на знакомую местность и поддержку общин. Их организация лучше подходит обороне, чем длительным наступательным операциям."
 nw25_sri_regular:0 "Единое республиканское командование"
 nw25_sri_regular_desc:0 "Общий штаб согласует снабжение и подготовку соединений. Республика получает более устойчивую полевую армию без разовой выдачи бесплатных дивизий."
 nw25_sri_requisitions:0 "Чрезвычайные поставки"
 nw25_sri_requisitions_desc:0 "Реквизиции временно поддерживают военные нужды. Их политическая цена уже отражена в падении сельской поддержки."
 nw25_sri_partner:0 "Итальянское торговое соглашение"
 nw25_sri_partner_desc:0 "Соглашение между итальянскими государствами регулирует хозяйственные контакты, сохраняя их суверенитет и действующие внешние гарантии."
 nw25_sri_reconstruction:0 "Восстановление итальянского хозяйства"
 nw25_sri_reconstruction_desc:0 "Основные итальянские регионы находятся под единым управлением. Средства направляются на восстановление хозяйственных связей; внешние территориальные споры остаются отдельным вопросом."
 nw25_eng_balanced:0 "Сбалансированное казначейство"
 nw25_eng_balanced_desc:0 "Правительство ограничило внеочередные расходы. Устойчивость бюджета поддерживается дисциплиной обязательств, а социальные последствия сокращений требуют внимания."
 nw25_eng_recovery:0 "Восстановление занятости"
 nw25_eng_recovery_desc:0 "Общественные работы обеспечили внутренние заказы. Их стоимость остаётся в бюджетных показателях, поэтому новые расходы нужно соотносить с доходами."
 nw25_eng_austerity:0 "Социальная цена сокращений"
 nw25_eng_austerity_desc:0 "Замораживание расходов облегчило положение казначейства, но сократило заказы и доходы части работников."
 nw25_eng_pressure:0 "Чрезвычайные бюджетные ограничения"
 nw25_eng_pressure_desc:0 "Высокое финансовое давление заставляет казначейство откладывать даже подготовленные проекты."
 nw25_eng_fleet_crisis:0 "Кризис морских расходов"
 nw25_eng_fleet_crisis_desc:0 "Неурегулированные условия службы мешают подготовке флота. Переговоры и выплаты могут снять кризис; автоматического мятежа этот показатель не вызывает."
 nw25_eng_fleet_compact:0 "Соглашение с флотом"
 nw25_eng_fleet_compact_desc:0 "Адмиралтейство закрепило условия выплат и службы. Кадровая устойчивость сохраняется, пока новые сокращения не разрушат соглашение."
 nw25_eng_atlantic:0 "Атлантический приоритет"
 nw25_eng_atlantic_desc:0 "Подготовка флота ориентирована на охрану океанских сообщений и согласованность действий. Бонус отражает общий приоритет подготовки, а не географический модификатор отдельного моря."
 nw25_eng_eastern:0 "Восточная морская станция"
 nw25_eng_eastern_desc:0 "Снабженческая служба сосредоточена на дальних маршрутах к Сингапуру. Общий логистический эффект представляет эту программу без притязаний на новые земли."
 nw25_eng_atlantic_modern:0 "Модернизация океанского сопровождения"
 nw25_eng_atlantic_modern_desc:0 "Реформа управления повышает согласованность действий флота и эффективность верфей."
 nw25_eng_eastern_modern:0 "Модернизация дальнего снабжения"
 nw25_eng_eastern_modern_desc:0 "Портовые службы и корабельные ремонтные графики приспособлены к длительным рейсам."
 nw25_eng_partner:0 "Британский договор снабжения"
 nw25_eng_partner_desc:0 "Соглашение определяет ограниченные морские закупки и обмен снабженческим опытом. Оно не меняет автономию и не означает автоматического вступления в войну."
 nw25_eng_commonwealth:0 "Договорное содружество"
 nw25_eng_commonwealth_desc:0 "Хотя бы один партнёр подтвердил практическое сотрудничество. Отказавшиеся страны не получают общих обязательств или бонусов."
 nw25_eng_commonwealth_full:0 "Разветвлённое договорное содружество"
 nw25_eng_commonwealth_full_desc:0 "Несколько действующих партнёров распределяют морские закупки и поддерживают устойчивость снабжения."
 nw25_eng_commerce:0 "Морская коммерческая сеть"
 nw25_eng_commerce_desc:0 "Британская торговля опирается на действующие портовые соглашения. Её хозяйственные преимущества не требуют новых колониальных захватов."
 nw25fra.31.t:0 "Париж подтверждает поддержку Пьемонта"
 nw25fra.31.d:0 "Предложение касается новых закупок и хозяйственного сотрудничества. Принятие не меняет наши границы, существующие гарантии или политический статус. Полное соглашение действует год, ограниченное — полгода; отказ сохраняет прежние отношения."
