 nw25_fra_sie_renew_desc:0 "Получатель может принять полный или ограниченный договор либо отказаться. Действующие соглашения нельзя многократно подписывать ради бонуса."
 nw25_fra_gam_renew:0 "Новый раунд переговоров: GAM"
 nw25_fra_gam_renew_desc:0 "Получатель может принять полный или ограниченный договор либо отказаться. Действующие соглашения нельзя многократно подписывать ради бонуса."
 nw25_fra_ger_renew:0 "Новый раунд переговоров: GER"
 nw25_fra_ger_renew_desc:0 "Получатель может принять полный или ограниченный договор либо отказаться. Действующие соглашения нельзя многократно подписывать ради бонуса."
 nw25_sri_negotiate_councils:0 "Согласовать решения местных советов"
 nw25_sri_negotiate_councils_desc:0 "Единство советов увеличится на 10. Согласование и местные проекты требуют временных хозяйственных расходов."
 nw25_sri_grain_contracts:0 "Заключить договоры с сельскими кооперативами"
 nw25_sri_grain_contracts_desc:0 "Сельская поддержка увеличится на 12; закупки оплачиваются временной хозяйственной программой."
 nw25_sri_extraordinary_requisitions:0 "Чрезвычайные продовольственные реквизиции"
 nw25_sri_extraordinary_requisitions_desc:0 "На 90 дней улучшается военное снабжение. Сельская поддержка уменьшается на 15, единство советов — на 5. Федеративная модель исключает эти реквизиции."
 nw25_sri_restore_rural_confidence:0 "Восстановить доверие сельских общин"
 nw25_sri_restore_rural_confidence_desc:0 "Сельская поддержка увеличится на 20. Компенсации на 120 дней отвлекут часть средств от других проектов."
 nw25_sri_reopen_debate:0 "Возобновить обсуждение устройства советов"
 nw25_sri_reopen_debate_desc:0 "Повторно созвать делегатов после отсрочки. Итоговый политический курс ещё не выбран."
 nw25_sri_lbv_renew:0 "Возобновить итальянские переговоры: LBV"
 nw25_sri_lbv_renew_desc:0 "Новый хозяйственный договор сохраняет суверенитет партнёра. Для зависимой Венеции требуется отдельное разрешение Австрии."
 nw25_sri_spm_renew:0 "Возобновить итальянские переговоры: SPM"
 nw25_sri_spm_renew_desc:0 "Новый хозяйственный договор сохраняет суверенитет партнёра. Для зависимой Венеции требуется отдельное разрешение Австрии."
 nw25_sri_pap_renew:0 "Возобновить итальянские переговоры: PAP"
 nw25_sri_pap_renew_desc:0 "Новый хозяйственный договор сохраняет суверенитет партнёра. Для зависимой Венеции требуется отдельное разрешение Австрии."
 nw25_eng_reopen_budget:0 "Вернуться к бюджетной реформе"
 nw25_eng_reopen_budget_desc:0 "Комиссия вновь представит выбор после отсрочки. Повторное обсуждение требует политических ресурсов."
 nw25_eng_treasury_restrictions:0 "Сократить внеочередные расходы"
 nw25_eng_treasury_restrictions_desc:0 "Финансовое давление снизится на 10. После начала морской программы недовольство моряков вырастет на 8. Социальная цена сокращений действует 120 дней."
 nw25_eng_naval_welfare:0 "Флотские выплаты и условия службы"
 nw25_eng_naval_welfare_desc:0 "Недовольство моряков снизится на 15, финансовое давление увеличится на 7."
 nw25_eng_trade_revenue:0 "Расширить доходы от морской торговли"
 nw25_eng_trade_revenue_desc:0 "Действующие договоры снизят давление на бюджет на 8 и поддержат временные внутренние заказы."
 nw25_eng_emergency_naval_settlement:0 "Чрезвычайное соглашение с Адмиралтейством"
 nw25_eng_emergency_naval_settlement_desc:0 "Недовольство моряков снизится на 30, финансовое давление вырастет на 15. Острый конфликт закончится ценой новых бюджетных обязательств."
 nw25_eng_can_renew:0 "Возобновить морские переговоры: CAN"
 nw25_eng_can_renew_desc:0 "Новое соглашение оплачивает ограниченную хозяйственную программу. Оно не отменяет независимость, автономию или прежние права прохода."
 nw25_eng_ast_renew:0 "Возобновить морские переговоры: AST"
 nw25_eng_ast_renew_desc:0 "Новое соглашение оплачивает ограниченную хозяйственную программу. Оно не отменяет независимость, автономию или прежние права прохода."
 nw25_eng_nzl_renew:0 "Возобновить морские переговоры: NZL"
 nw25_eng_nzl_renew_desc:0 "Новое соглашение оплачивает ограниченную хозяйственную программу. Оно не отменяет независимость, автономию или прежние права прохода."
 nw25_eng_raj_renew:0 "Возобновить морские переговоры: RAJ"
 nw25_eng_raj_renew_desc:0 "Новое соглашение оплачивает ограниченную хозяйственную программу. Оно не отменяет независимость, автономию или прежние права прохода."
 nw25_eng_lag_renew:0 "Возобновить морские переговоры: LAG"
 nw25_eng_lag_renew_desc:0 "Новое соглашение оплачивает ограниченную хозяйственную программу. Оно не отменяет независимость, автономию или прежние права прохода."
 nw25_eng_ger_renew:0 "Возобновить морские переговоры: GER"
 nw25_eng_ger_renew_desc:0 "Новое соглашение оплачивает ограниченную хозяйственную программу. Оно не отменяет независимость, автономию или прежние права прохода."
 NW25_FRA_state_council:0 "Совет государства"
 NW25_FRA_state_council_desc:0 "Правительство соберёт ведомства за одним столом и установит порядок административной ревизии. Вопрос о форме государства сегодня не пересматривается."
 NW25_FRA_provincial_inquiry:0 "Проверка провинциальных администраций"
 NW25_FRA_provincial_inquiry_desc:0 "Префекты и местные общества по-разному понимают государственные полномочия. Ревизия завершится выбором между согласованием интересов и единым порядком директив."
 NW25_FRA_agreement_with_notables:0 "Соглашение с местными элитами"
 NW25_FRA_agreement_with_notables_desc:0 "Париж закрепит обязанности провинциальных обществ в обмен на предсказуемые правила распределения средств. Этот путь открывает недорогие местные хозяйственные проекты."
 NW25_FRA_executive_directives:0 "Правительство директив"
 NW25_FRA_executive_directives_desc:0 "Единый исполнительный центр ускорит решения по государственным проектам. Администрация получит новые полномочия, а местным обществам придётся принять сокращение самостоятельности."
 NW25_FRA_enduring_state:0 "Устойчивое французское государство"
 NW25_FRA_enduring_state_desc:0 "Новые правила управления должны стать повседневной практикой. Итоговая система заменит прежний конфликт лиг и ведомств устройством, выбранным в ходе административной реформы."
 NW25_FRA_bond_registry:0 "Реестр иностранных облигаций"
 NW25_FRA_bond_registry_desc:0 "Банки представят общую картину иностранных вложений. Реестр откроет решения о кредитах, внутренних заказах и защите французских экспортёров."
 NW25_FRA_russian_accounts:0 "Русские счета"
 NW25_FRA_russian_accounts_desc:0 "Проверка расчётов позволит предложить России новую кредитную линию. Петроградское правительство сможет принять её, предложить меньший объём или отказаться, сохранив прежние обязательства."
 NW25_FRA_reinvest_in_russia:0 "Ставка на восточный рынок"
 NW25_FRA_reinvest_in_russia_desc:0 "Дополнительные русские заказы поддержат французские предприятия. Доходность вырастет вместе с зависимостью от политической устойчивости России."
 NW25_FRA_diversify_capital:0 "Диверсификация французского капитала"
 NW25_FRA_diversify_capital_desc:0 "Часть вложений будет направлена на внутренний рынок. Франция потеряет часть сосредоточенного кредитного влияния, но станет меньше зависеть от одного иностранного партнёра."
 NW25_FRA_continental_balance:0 "Континентальное равновесие"
 NW25_FRA_continental_balance_desc:0 "Французская дипломатия изучит германский рынок и пределы возможного сближения. Реваншистские настроения не обязывают страну немедленно начинать войну."
 NW25_FRA_german_industry:0 "Германская промышленная гегемония"
 NW25_FRA_german_industry_desc:0 "Соперничество заводов и банков требует конкретного ответа: ограничить торговлю либо попытаться согласовать правила конкуренции."
 NW25_FRA_customs_pressure:0 "Тарифное давление"
 NW25_FRA_customs_pressure_desc:0 "Новые тарифы потребуют издержек и от французских производителей. Берлин получит возможность ответить ограничениями или предложить переговоры."
 NW25_FRA_open_channels:0 "Дипломатические каналы с Берлином"
 NW25_FRA_open_channels_desc:0 "Переговоры могут ограничить хозяйственное противостояние без отказа от французских интересов. Германия сама решит, принимать ли новый договор."
 NW25_FRA_alsace_administration:0 "Возвращённый Эльзас"
 NW25_FRA_alsace_administration_desc:0 "Программа доступна после фактического возвращения Эльзаса по германскому сценарию. Она регулирует местное управление и не передаёт регион Франции."
 NW25_FRA_mediterranean_consultation:0 "Средиземноморская конференция"
 NW25_FRA_mediterranean_consultation_desc:0 "Париж начнёт согласование своих европейских и заморских обязательств. Каждый партнёр сохранит собственное правительство и право отвечать на предложения."
 NW25_FRA_protect_piedmont:0 "Гарантия Сардинии-Пьемонту"
 NW25_FRA_protect_piedmont_desc:0 "Действующая гарантия станет основой нового хозяйственного предложения. При отсутствии партнёра договор не появится; существующая гарантия не выдаётся повторно."
 NW25_FRA_levant_arrangements:0 "Левантийские соглашения"
 NW25_FRA_levant_arrangements_desc:0 "Сирии и Ливану будут предложены отдельные программы закупок. Их различные автономные статусы сохраняются, а каждый ответ рассматривается самостоятельно."
 NW25_FRA_african_protectorates:0 "Западноафриканское покровительство"
 NW25_FRA_african_protectorates_desc:0 "Новые предложения Сьерра-Леоне и Гамбии свяжут французские расходы с местными хозяйственными потребностями. Программа требует сохранения действительных отношений с Парижем."
 NW25_FRA_mediterranean_stability:0 "Средиземноморская система соглашений"
 NW25_FRA_mediterranean_stability_desc:0 "Практические преимущества зависят от числа действующих договоров. Отказ одной страны не закрывает программу, но исчезнувшие партнёры больше не учитываются."
 NW25_SRI_council_congress:0 "Съезд советов"
 NW25_SRI_council_congress_desc:0 "Делегаты определят хозяйственную повестку республики. За спорами о полномочиях стоят реальные вопросы: кто снабжает города, кто выполняет заказы и кто оплачивает общие решения."
 NW25_SRI_neapolitan_debate:0 "Неаполитанские дебаты"
 NW25_SRI_neapolitan_debate_desc:0 "Обсуждение определит полномочия центральных учреждений. Отсрочка оставит возможность вернуться к вопросу отдельным решением."
 NW25_SRI_federation_of_councils:0 "Федерация советов"
 NW25_SRI_federation_of_councils_desc:0 "Республика закрепит согласование решений между местными советами. Дополнительная устойчивость оплачивается более медленной мобилизацией и отказом от чрезвычайных реквизиций."
 NW25_SRI_central_executive:0 "Центральный исполнительный комитет"
 NW25_SRI_central_executive_desc:0 "Общие закупки переходят в ведение центральной комиссии. Военные заказы станут устойчивее, но местные советы потребуют новых гарантий своих полномочий."
 NW25_SRI_land_commissions:0 "Земельные комиссии"
 NW25_SRI_land_commissions_desc:0 "Перепись договоров и хозяйств откроет программу сельских закупок. Она действует независимо от выбранного устройства советов."
 NW25_SRI_rural_cooperatives:0 "Крестьянские кооперативы"
 NW25_SRI_rural_cooperatives_desc:0 "Договорные закупки заменят часть чрезвычайных методов. Компенсации потребуют средств, зато деревня получит основания доверять республиканским учреждениям."
 NW25_SRI_workers_industry:0 "Промышленность рабочих советов"
 NW25_SRI_workers_industry_desc:0 "Согласованные графики выпуска уменьшат потери на действующих предприятиях. Перестройка цепочек снабжения временно снизит выпуск, прежде чем проявится постоянная выгода."
 NW25_SRI_supply_compromise:0 "Хлеб и станки"
 NW25_SRI_supply_compromise_desc:0 "Приоритеты снабжения потребуют открытого выбора между продовольствием, промышленностью и общим компромиссом. Политическая цена будет зависеть от принятого решения."
 NW25_SRI_italian_question:0 "Итальянский вопрос"
 NW25_SRI_italian_question_desc:0 "Республика заявляет о будущем Италии, но другие итальянские государства имеют собственные интересы и покровителей. Начнём с конкретных дипломатических каналов."
 NW25_SRI_venetian_delegation:0 "Обращение к Венецианской федерации"
 NW25_SRI_venetian_delegation_desc:0 "Венецианское правительство получит предложение о торговле. Пока оно зависит от Австрии, соглашение потребует подтверждения Вены и не отменит её надзор."
 NW25_SRI_piedmontese_contacts:0 "Контакты с Сардинией-Пьемонтом"
 NW25_SRI_piedmontese_contacts_desc:0 "Северная республика может согласиться на ограниченный хозяйственный договор. Французская гарантия продолжит действовать при любом результате переговоров."
 NW25_SRI_roman_question:0 "Римский вопрос"
 NW25_SRI_roman_question_desc:0 "Рим остаётся центром политического и религиозного спора. Предложение правовых гарантий, жёсткая позиция и отсрочка приведут к различным дипломатическим последствиям."
 NW25_SRI_italian_conference:0 "Конференция итальянских государств"
 NW25_SRI_italian_conference_desc:0 "Конференция предложит участникам торговлю и взаимное признание. Даже успешные переговоры не превращают отдельные государства в провинции Неаполя."
 NW25_SRI_revolutionary_mobilization:0 "Революционная мобилизация Италии"
 NW25_SRI_revolutionary_mobilization_desc:0 "Республика откроет решения по военной подготовке. Каждая операция потребует достаточного единства, сельской поддержки, отдельного подтверждения и обычного объявления войны."
 NW25_SRI_italian_reconstruction:0 "Восстановление объединённой Италии"
 NW25_SRI_italian_reconstruction_desc:0 "Программа начинается лишь после мира и фактического владения основными итальянскими регионами. Территориальные споры с Францией и Австрией не являются обязательной частью этого хозяйственного восстановления."
 NW25_SRI_international_appeal:0 "Обращение к рабочим Европы"
 NW25_SRI_international_appeal_desc:0 "Иностранные рабочие организации получат приглашение к контактам. Республика ищет собеседников, но не может определять политический исход другой страны."
 NW25_SRI_german_delegation:0 "Делегация в Германию"
 NW25_SRI_german_delegation_desc:0 "Итальянская делегация поставит перед германскими социалистами вопрос об отношении к республике. Берлин сам определит допустимые контакты; раскол и война не являются автоматическим результатом визита."
 NW25_SRI_diplomatic_crossroads:0 "Революционная дипломатия"
 NW25_SRI_diplomatic_crossroads_desc:0 "Внешние связи потребуют выбора между широким признанием и поддержкой революционных организаций. Оба направления совместимы с самостоятельной хозяйственной политикой республики."
 NW25_SRI_defence_commission:0 "Комиссия обороны республики"
 NW25_SRI_defence_commission_desc:0 "Комиссия проверит организацию вооружённых сил и снабжение. Дальнейшая подготовка будет строиться вокруг территориальной обороны или единого полевого командования."
 NW25_SRI_local_militias:0 "Территориальные милиции"
 NW25_SRI_local_militias_desc:0 "Местные формирования получат общие правила обороны. Их сильная сторона — знание местности и связь с общинами; наступательные возможности останутся ограниченными."
 NW25_SRI_regular_red_army:0 "Единая республиканская армия"
 NW25_SRI_regular_red_army_desc:0 "Общее командование потребует средств и уступок самостоятельных военных организаций. Реформа улучшит устройство существующей армии без бесплатного формирования новых соединений."
 NW25_ENG_treasury_review:0 "Положение казначейства"
 NW25_ENG_treasury_review_desc:0 "Казначейство представит стоимость действующих обязательств. Бюджетные решения позволят менять расходы и доходы, не перекраивая уже сложившуюся карту империи."
 NW25_ENG_budget_inquiry:0 "Комиссия по имперским расходам"
 NW25_ENG_budget_inquiry_desc:0 "Общественные программы и морское присутствие конкурируют за средства. Комиссия предложит курс реформы или временную отсрочку с возможностью вернуться к вопросу."
 NW25_ENG_budget_retrenchment:0 "Сокращение обязательств"
 NW25_ENG_budget_retrenchment_desc:0 "Ограничение расходов снизит давление на казначейство. Работники и моряки почувствуют социальную цену программы, поэтому бюджетная дисциплина не завершает все внутренние споры."
 NW25_ENG_public_works:0 "Программа общественных работ"
 NW25_ENG_public_works_desc:0 "Внутренние заказы поддержат занятость и строительство. Начальные расходы увеличат финансовое давление; дальнейшее оздоровление бюджета потребует решений о доходах или экономии."
 NW25_ENG_dominion_conference:0 "Конференция доминионов"
 NW25_ENG_dominion_conference_desc:0 "Канада, Австралия и Новая Зеландия сохраняют собственные интересы. Конференция подготовит договорные предложения, по которым каждое правительство ответит отдельно."
 NW25_ENG_dominion_defence:0 "Оборонные договоры доминионов"
 NW25_ENG_dominion_defence_desc:0 "Доминионам будут предложены ограниченные программы морских закупок. Отказ не изменит их автономию и не станет поводом автоматически втянуть страну в войну."
 NW25_ENG_indian_relations:0 "Новые отношения с Индией"
 NW25_ENG_indian_relations_desc:0 "Независимая Индия получит торговое предложение на равных. Договор не меняет её статус и не затрагивает гарантию Тибету."
 NW25_ENG_commonwealth_contracts:0 "Содружество договоров"
 NW25_ENG_commonwealth_contracts_desc:0 "Практическая сила содружества зависит от действующих подписей. Одного соглашения достаточно для начала программы; дополнительные участники расширят её возможности."
 NW25_ENG_fleet_estimates:0 "Сметы Адмиралтейства"
 NW25_ENG_fleet_estimates_desc:0 "Морская программа начнётся с проверки расходов и условий службы. Она доступна независимо от решения бюджетной комиссии."
 NW25_ENG_sailors_compact:0 "Соглашение с моряками"
 NW25_ENG_sailors_compact_desc:0 "Новый график выплат снизит недовольство ценой дополнительных обязательств казначейства. Положительный кадровый эффект сохранится, пока претензии моряков остаются низкими."
 NW25_ENG_atlantic_priority:0 "Атлантические коммуникации"
 NW25_ENG_atlantic_priority_desc:0 "Флот сосредоточит подготовку на охране океанских сообщений. Это общий организационный приоритет; он не создаёт новых баз и территорий."
 NW25_ENG_eastern_priority:0 "Восточная морская станция"
 NW25_ENG_eastern_priority_desc:0 "Дальнее снабжение к Сингапуру получит приоритет. Программа использует существующую инфраструктуру и не восстанавливает британскую власть над независимыми странами."
 NW25_ENG_fleet_modernisation:0 "Флот в эпоху экономии"
 NW25_ENG_fleet_modernisation_desc:0 "Графики ремонта и подготовки будут приведены к выбранному морскому приоритету. Итоговый дух заменит промежуточную программу и не суммируется с ней."
 NW25_ENG_sea_lanes:0 "Морские коммуникации империи"
 NW25_ENG_sea_lanes_desc:0 "Действующие договорные порты важнее новых притязаний. Программа откроет хозяйственные переговоры о снабжении и торговле."
 NW25_ENG_lagos_agreement:0 "Лагосский портовый договор"
 NW25_ENG_lagos_agreement_desc:0 "Лагосу будет предложена программа морских закупок. Его британская зависимость и существующий германский проход сохраняются при любом ответе."
 NW25_ENG_german_colonial_access:0 "Соглашения о германских колониальных портах"
 NW25_ENG_german_colonial_access_desc:0 "Новый хозяйственный договор определит расходы на морское присутствие. Отказ от дополнительных закупок не отменяет старые права прохода и не меняет владение колониями."
 NW25_ENG_malayan_stores:0 "Склады Сингапура и Малайи"
 NW25_ENG_malayan_stores_desc:0 "Работы производятся в Сингапуре только при фактическом британском владении и контроле. Если базу утратили или инфраструктура уже предельная, штаб займётся организационной подготовкой."
 NW25_ENG_commercial_network:0 "Глобальная торговля без новых завоеваний"
 NW25_ENG_commercial_network_desc:0 "Торговая программа опирается на действующие подписи партнёров. Прекращение последних соглашений снимет выгоду, но не остановит остальные государственные программы."
 nw251_fra_network_tt:0 "Действующие региональные договоры поддерживают снабжение: 1–2 договора снижают расход снабжения на 3%; 3 и более — на 5% и ускоряют строительство инфраструктуры на 3%."
 nw251_eng_commonwealth_tt:0 "Действующие договоры содружества поддерживают верфи: 1–2 договора дают +2% к выпуску; 3 и более — +4% и −2% к расходу снабжения."
 nw251_eng_commerce_tt:0 "Пока действует хотя бы один портовый договор или договор содружества, скорость строительства гражданских фабрик повышается на 4%."
 nw25_fra_politics:0 "Кредит и государственные обязательства"
 nw25_fra_politics_desc:0 "Кредитное влияние: [?nw25_fra_credit_influence|0]/100. Российская экспозиция: [?nw25_fra_russian_exposure|0]/100. Региональные договоры: [?nw25_fra_agreements|0]. При экспозиции выше 69 российская гражданская война вызывает кредитный кризис. Диверсификация и санация доступны через решения."
 nw25_sri_politics:0 "Советы, деревня и итальянский вопрос"
 nw25_sri_politics_desc:0 "Единство советов: [?nw25_sri_council_cohesion|0]/100. Поддержка деревни: [?nw25_sri_rural_support|0]/100. Ниже 40 единства возникают административные затруднения; ниже 30 сельской поддержки — перебои поставок. Переговоры и закупки позволяют восстановить показатели."
 nw25_eng_politics:0 "Казначейство и морские обязательства"
 nw25_eng_politics_desc:0 "Давление на бюджет: [?nw25_eng_fiscal_pressure|0]/100. Недовольство моряков: [?nw25_eng_sailor_grievances|0]/100. Договоры содружества: [?nw25_eng_agreements|0]; портовые договоры: [?nw25_eng_ports|0]. Бюджетный кризис начинается выше 79, морской — выше 59. При недовольстве выше 79 требуется отдельное решение о выплатах."
 nw25_cooperation:0 "Практическое хозяйственное сотрудничество"
 nw25_frictions:0 "Разногласия по хозяйственной политике"
