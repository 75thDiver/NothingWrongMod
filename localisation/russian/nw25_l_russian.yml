 nw25_sri_operation_pap_prepare:0 "Обсудить операцию против Папской области"
 nw25_sri_operation_pap_prepare_desc:0 "Стоимость подготовки не возвращается при отсрочке. Подтверждение снижает единство советов и поддержку деревни на 5, стабильность на 2 процентных пункта. Гаранты и сюзерен сохраняют права; цель войны выдаётся только отдельным решением."
 nw25_sri_operation_pap_execute:0 "Подготовить цель войны против Папской области"
 nw25_sri_operation_pap_execute_desc:0 "Появится ограниченная по времени цель войны. Объявление войны остаётся отдельным дипломатическим действием с обычными последствиями гарантий и автономий."
 nw25eng.10.t:0 "Цена имперского бюджета"
 nw25eng.10.d:0 "Казначейство сравнило стоимость морских баз, социальных программ и договорных обязательств. Сокращения снизят давление на бюджет, но усилят недовольство; общественные работы потребуют нового финансирования."
 nw25eng.10.a:0 "Подготовить сокращение обязательств."
 nw25eng.10.b:0 "Подготовить общественные работы."
 nw25eng.10.c:0 "Пока сохранить действующее финансирование."
 nw25eng.10.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25eng.20.t:0 "Моряки требуют пересмотра расходов"
 nw25eng.20.d:0 "Корабельные комитеты и командиры передали Адмиралтейству перечень претензий. Правительство должно определить, сколько средств оно готово направить на соглашение. Отказ ухудшит условия подготовки флота, но сам по себе не вызовет мятеж."
 nw25eng.20.a:0 "Начать переговоры о графике выплат."
 nw25eng.20.b:0 "Немедленно выделить дополнительные средства."
 nw25eng.20.c:0 "Сохранить прежние ограничения."
 nw25eng.20.stale:0 "Обстоятельства изменились; предложение закрыто."
 nw25_fra_provincial_projects:0 "Провинциальные хозяйственные проекты"
 nw25_fra_provincial_projects_desc:0 "Временная программа внутренних заказов. Доступна сторонникам административного компромисса до завершения государственной реформы."
 nw25_fra_extend_credit:0 "Предложить дополнительный русский кредит"
 nw25_fra_extend_credit_desc:0 "Новый заём требует согласия России. Полный договор увеличивает влияние и зависимость на 10; ограниченный — на 5. Прежние выплаты не отменяются при отказе."
 nw25_fra_domestic_investments:0 "Перенаправить иностранный капитал"
 nw25_fra_domestic_investments_desc:0 "Зависимость от России снизится на 15, кредитное влияние — на 5. Внутренние промышленные заказы действуют 180 дней."
 nw25_fra_trade_guarantees:0 "Поддержать французских экспортёров"
 nw25_fra_trade_guarantees_desc:0 "Действующие договоры обеспечивают временные экспортные заказы. Кредитное влияние увеличится на 5."
 nw25_fra_financial_rescue:0 "Чрезвычайная поддержка кредитного рынка"
 nw25_fra_financial_rescue_desc:0 "Резервы снимут чрезвычайный кредитный штраф. Влияние восстановится на 15, но содержание программы временно увеличит долю потребительских товаров."
 nw25_fra_spm_renew:0 "Новый раунд переговоров: SPM"
 nw25_fra_spm_renew_desc:0 "Получатель может принять полный или ограниченный договор либо отказаться. Действующие соглашения нельзя многократно подписывать ради бонуса."
 nw25_fra_syr_renew:0 "Новый раунд переговоров: SYR"
 nw25_fra_syr_renew_desc:0 "Получатель может принять полный или ограниченный договор либо отказаться. Действующие соглашения нельзя многократно подписывать ради бонуса."
 nw25_fra_leb_renew:0 "Новый раунд переговоров: LEB"
 nw25_fra_leb_renew_desc:0 "Получатель может принять полный или ограниченный договор либо отказаться. Действующие соглашения нельзя многократно подписывать ради бонуса."
