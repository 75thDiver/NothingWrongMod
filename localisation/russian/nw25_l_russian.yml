 nw25_sri_operation_spm_execute:0 "Подготовить цель войны против Сардинии-Пьемонта"
 nw25_sri_operation_spm_execute_desc:0 "Появится ограниченная по времени цель войны. Объявление войны остаётся отдельным дипломатическим действием с обычными последствиями гарантий и автономий."
 nw25sri.62.t:0 "Перед вооружённым выступлением"
 nw25sri.62.d:0 "Штаб рассматривает операцию против Папской области. Подтверждение откроет на 60 дней отдельное решение о подготовке цели войны; само событие войну не объявляет. Проверьте текущие гарантии, сюзерена и фракцию адресата на дипломатическом экране: они сохраняют силу."
