l_russian:
 NW20_GER_economy_01:0 "Ревизия промышленных заказов"
 NW20_GER_economy_01_desc:0 "Рур умеет выпускать сталь, но ведомства по-прежнему покупают её по разным правилам. Сопоставим заказы казны с действительной загрузкой заводов."
 NW20_GER_economy_02:0 "Рейнские грузовые пристани"
 NW20_GER_economy_02_desc:0 "Дешёвая перевозка угля важнее ещё одной торжественной закладки. Расширим подъезды к речным терминалам и разгрузим железные дороги."
 NW20_GER_economy_03:0 "Школы заводских мастеров"
 NW20_GER_economy_03_desc:0 "Новый станок бесполезен без мастера, способного его наладить. Предприятия и технические училища получат общую программу подготовки."
 NW20_GER_economy_04:0 "Станкостроительные кооперации"
 NW20_GER_economy_04_desc:0 "Малые производители деталей смогут объединить заказы на оборудование. Это даст промышленности новые мощности без создания очередной монополии."
 NW20_GER_economy_05:0 "Единые промышленные допуски"
 NW20_GER_economy_05_desc:0 "Несовместимые детали превращают ремонт в отдельное производство. Закрепим общие допуски и обмен технической документацией."
 NW20_GER_economy_06:0 "Промышленная палата земель"
 NW20_GER_economy_06_desc:0 "Согласование федеральных и земельных закупок перестанет зависеть от личных связей чиновников. Палата опубликует общий календарь контрактов."
 NW20_GER_economy_07:0 "Долгие казённые контракты"
 NW20_GER_economy_07_desc:0 "Крупные предприятия получат предсказуемый военный заказ. На год ускорим строительство арсеналов ценой дополнительной нагрузки на гражданское хозяйство."
 NW20_GER_economy_08:0 "Заказы среднему предпринимателю"
 NW20_GER_economy_08_desc:0 "Разделим крупные закупки на доступные небольшим заводам партии. Развёртывание займёт больше усилий, зато новые гражданские предприятия получат поддержку."
 NW20_GER_economy_09:0 "Открытая приёмка заказов"
 NW20_GER_economy_09_desc:0 "Независимые приёмщики проверят партии до отправки в войска. Сохранив крупные казённые контракты, мы ускорим выпуск вооружений ценой небольшой нагрузки на гражданский рынок; опора на средние предприятия даст устойчивее работающую промышленность."
 NW20_GER_economy_10:0 "Электротехнические лаборатории"
 NW20_GER_economy_10_desc:0 "Промышленной Германии нужны собственные приборы контроля. Свяжем университетские исследования с испытаниями на производстве."
 NW20_GER_economy_11:0 "Резерв производственных линий"
 NW20_GER_economy_11_desc:0 "Часть новых цехов будет рассчитана на быстрое освоение военных заказов. Их оборудование останется полезным и в мирное время."
 NW20_GER_economy_12:0 "Согласованное промышленное хозяйство"
 NW20_GER_economy_12_desc:0 "Система закупок, обучения и перевозок теперь работает совместно. Настало время закрепить производственные стандарты на следующую кампанию."
 NW20_GER_land_01:0 "Полевое управление сухопутных сил"
 NW20_GER_land_01_desc:0 "Штабные карты должны отражать возможности частей, а не только замыслы генералов. Начнём отдельную программу сухопутной подготовки."
 NW20_GER_land_02:0 "Сержантские школы земель"
 NW20_GER_land_02_desc:0 "Опытный унтер-офицер удерживает подразделение лучше длинного приказа. Расширим практическую подготовку младших командиров."
 NW20_GER_land_03:0 "Артиллерийские полигоны"
 NW20_GER_land_03_desc:0 "Новые орудия нужно проверять вместе с наблюдателями и связистами. Военные получат средства для сравнительных испытаний."
 NW20_GER_land_04:0 "Дивизионная связь"
 NW20_GER_land_04_desc:0 "Разнородные подразделения должны понимать друг друга в движении. Закупим имущество связи и снабжения для штабов."
 NW20_GER_land_05:0 "Резерв боеприпасных мощностей"
 NW20_GER_land_05_desc:0 "Расход снарядов на учениях показывает пределы нынешнего снабжения. Расширим военное производство до того, как армия столкнётся с нехваткой."
 NW20_GER_land_06:0 "Большие манёвры рейха"
 NW20_GER_land_06_desc:0 "Сведём пехоту, артиллерию и обозы на одном учении. Ошибки взаимодействия будут разобраны до следующих назначений."
 NW20_GER_land_07:0 "Ставка на подвижные группы"
 NW20_GER_land_07_desc:0 "Моторный транспорт позволит быстро усиливать нужный участок. Выделим грузовики для опытных мобильных соединений."
 NW20_GER_land_08:0 "Методичное обеспечение фронта"
 NW20_GER_land_08_desc:0 "Предпочтём надёжный подвоз рискованной гонке маршей. На год введём особый порядок экономии и распределения снабжения."
 NW20_GER_land_09:0 "Свод наставлений полевых штабов"
 NW20_GER_land_09_desc:0 "Штаб сведёт манёвренные части и снабжение в единые наставления. Подвижная армия получит подготовленный резерв; ставка на планомерный подвоз сократит расход снабжения в полевых условиях."
 NW20_GER_land_10:0 "Пехотное оружие нового образца"
 NW20_GER_land_10_desc:0 "Пехоте нужна надёжность серийного оружия, а не коллекция экспериментальных моделей. Сосредоточим исследования на перспективном вооружении."
 NW20_GER_land_11:0 "Опытное броневое подразделение"
 NW20_GER_land_11_desc:0 "Броневые машины должны пройти испытание вместе с пехотой и ремонтниками. Создадим исследовательскую программу, не обещая мгновенного перевооружения."
 NW20_GER_land_12:0 "Армия согласованных действий"
 NW20_GER_land_12_desc:0 "Вооружение, обучение и снабжение наконец работают по одному плану. Поддержим заключительный цикл подготовки частей."
 NW20_GER_flight_01:0 "Воздушная программа рейха"
 NW20_GER_flight_01_desc:0 "Авиации требуется собственный план развития, а не остаток морской сметы. Воздушные штабы начнут работу над ним уже сейчас."
 NW20_GER_flight_02:0 "Истребительные испытания"
 NW20_GER_flight_02_desc:0 "Оценим самолёты по реальной работе лётчиков и механиков. Откроем исследовательскую программу лёгкой авиации."
 NW20_GER_flight_03:0 "Дальняя разведка"
 NW20_GER_flight_03_desc:0 "Командованию нужны сведения за пределами переднего края. Поддержим разработку самолётов для более продолжительных полётов."
 NW20_GER_flight_04:0 "Наземные службы аэродромов"
 NW20_GER_flight_04_desc:0 "Темп вылетов зависит от техников не меньше, чем от пилотов. На год усилим учебную и организационную подготовку воздушных частей."
 NW20_GER_flight_05:0 "Радиоприборы для авиации"
 NW20_GER_flight_05_desc:0 "Пилот должен получать понятные указания даже в плохую погоду. Свяжем разработку аппаратуры с требованиями воздушной службы."
 NW20_GER_flight_06:0 "Единый разбор воздушных учений"
 NW20_GER_flight_06_desc:0 "Сопоставим результаты разведчиков, истребителей и наземных служб. Штаб получит опыт координации воздушной операции."
 NW20_GER_flight_07:0 "Серийные авиационные мощности"
 NW20_GER_flight_07_desc:0 "Опытные самолёты должны превращаться в исправные серийные машины. Расширим военную производственную базу."
 NW20_GER_flight_08:0 "Школа воздушных наблюдателей"
 NW20_GER_flight_08_desc:0 "Качество донесения зависит от подготовки наблюдателя. Учебная программа свяжет авиацию с запросами полевых штабов."
 NW20_GER_flight_09:0 "Сменные экипажи"
 NW20_GER_flight_09_desc:0 "Одна потерянная смена не должна останавливать всю часть. Подготовим резерв лётчиков и технического персонала."
 NW20_GER_flight_10:0 "Воздушная служба общего назначения"
 NW20_GER_flight_10_desc:0 "Заключительные полёты проверят работу заводов, аэродромных служб и штабов как единой системы. Подготовка механиков снизит аварийность, а стандартизация повысит эффективность серийного выпуска."
 NW20_GER_maritime_01:0 "Морская программа кайзеровских верфей"
 NW20_GER_maritime_01_desc:0 "Морские задачи требуют собственного расчёта сил. Адмиралтейство сверит планы строительства с возможностями снабжения."
 NW20_GER_maritime_02:0 "Эскорт торговых путей"
 NW20_GER_maritime_02_desc:0 "Дорогой груз бесполезен, если он не дошёл до порта. Проведём практическую подготовку охранения торговых перевозок."
 NW20_GER_maritime_03:0 "Судовые испытательные бюро"
 NW20_GER_maritime_03_desc:0 "Объединим результаты полигонов и опыт экипажей. Кораблестроители получат отдельную исследовательскую поддержку."
 NW20_GER_maritime_04:0 "Резерв торгового тоннажа"
 NW20_GER_maritime_04_desc:0 "Подготовим дополнительные транспорты для перевозок в кризис. Их задача — поддерживать морское сообщение, а не заменять боевые корабли."
 NW20_GER_maritime_05:0 "Ремонтные мощности побережья"
 NW20_GER_maritime_05_desc:0 "Корабли должны возвращаться в строй без очереди у единственного дока. Расширим верфи на подконтрольном национальном побережье."
 NW20_GER_maritime_06:0 "Согласование морского снабжения"
 NW20_GER_maritime_06_desc:0 "Сведём графики ремонта и перевозок с оперативными планами. Флот проведёт штабную проверку новой системы."
 NW20_GER_maritime_07:0 "Программа серийного кораблестроения"
 NW20_GER_maritime_07_desc:0 "Повторяемые проекты позволят верфям работать устойчивее. На год поддержим выпуск кораблей за счёт согласованных заказов."
 NW20_GER_maritime_08:0 "Флот устойчивых коммуникаций"
 NW20_GER_maritime_08_desc:0 "Общие учения завершат программу: верфи получат постоянный заказ, а штаб — единые стандарты постройки и ремонта. Это увеличит производительность доков и позволит эффективнее использовать их мощности."
 NW20_AUS_economy_01:0 "Хозяйственный совет корон"
 NW20_AUS_economy_01_desc:0 "Общий рынок не появится от одного указа Вены. Совет согласует закупки Великой Австрии с потребностями корон, сохраняя их собственные бюджеты."
 NW20_AUS_economy_02:0 "Альпийские грузовые узлы"
 NW20_AUS_economy_02_desc:0 "Склоны и перевалы удорожают каждый вагон угля. Расширим узкие места на внутренних перевозках прежде, чем обещать новую индустриализацию."
 NW20_AUS_economy_03:0 "Венские технические курсы"
 NW20_AUS_economy_03_desc:0 "Коронным администрациям нужны инженеры, понимающие разные производственные традиции. Откроем общие курсы с признанием дипломов."
 NW20_AUS_economy_04:0 "Мастерские предгорий"
 NW20_AUS_economy_04_desc:0 "Ремонтные предприятия могут стать основой новой промышленности. Поддержим производство станочных деталей рядом с существующими рабочими посёлками."
 NW20_AUS_economy_05:0 "Каталог взаимозаменяемых деталей"
 NW20_AUS_economy_05_desc:0 "Федеральный заказ не должен распадаться на несовместимые партии. Введём единые требования к изделиям, не предписывая коронам единственного поставщика."
 NW20_AUS_economy_06:0 "Публикация общего бюджета"
 NW20_AUS_economy_06_desc:0 "Открытые сметы уменьшат подозрения, что общий рынок служит одной Вене. Каждая администрация сможет видеть назначение федеральных расходов."
 NW20_AUS_economy_07:0 "Казённые промышленные объединения"
 NW20_AUS_economy_07_desc:0 "Сосредоточим военные заказы на крупных предприятиях. На время программы гражданское хозяйство понесёт дополнительные издержки."
 NW20_AUS_economy_08:0 "Сеть коронных подрядчиков"
 NW20_AUS_economy_08_desc:0 "Дадим небольшим предприятиям доступ к общим закупкам. Гражданское строительство получит поддержку без передачи их собственности федеральному центру."
 NW20_AUS_economy_09:0 "Общая служба приёмки"
 NW20_AUS_economy_09_desc:0 "Заказчик должен получать одинаковое качество независимо от языка заводской документации. Создадим двуязычные инспекционные группы."
 NW20_AUS_economy_10:0 "Приборостроение Дуная"
 NW20_AUS_economy_10_desc:0 "Потребность в точных приборах объединяет железные дороги, авиацию и заводы. Поддержим лаборатории, работающие на все три направления."
 NW20_AUS_economy_11:0 "Резервные оружейные цеха"
 NW20_AUS_economy_11_desc:0 "Создадим дополнительную производственную площадку на подконтрольной национальной территории Великой Австрии. Имущество корон останется у корон."
 NW20_AUS_economy_12:0 "Общий рынок без внутренних барьеров"
 NW20_AUS_economy_12_desc:0 "Устойчивые расчёты и признанные стандарты важнее деклараций. Производители получат год согласованной поддержки при сохранении федерального устройства."
 NW20_AUS_land_01:0 "Программа общей полевой армии"
 NW20_AUS_land_01_desc:0 "Федеральному штабу нужна армия, в которой подразделения разных корон способны действовать вместе. Начнём с практической проверки командования."
 NW20_AUS_land_02:0 "Школы младших командиров корон"
 NW20_AUS_land_02_desc:0 "Командир должен уметь объяснить приказ солдатам своего подразделения. Согласуем подготовку инструкторов без отмены местных языков."
 NW20_AUS_land_03:0 "Горная артиллерия"
 NW20_AUS_land_03_desc:0 "Тяжёлое орудие бесполезно, если его нельзя доставить к позиции. Проведём испытания артиллерии с учётом альпийских дорог."
 NW20_AUS_land_04:0 "Многоязычная служба связи"
 NW20_AUS_land_04_desc:0 "Общие сигналы и таблицы сокращений избавят штаб от опасных недоразумений. Закупим дополнительное имущество для связистов."
 NW20_AUS_land_05:0 "Военное производство Великой Австрии"
 NW20_AUS_land_05_desc:0 "Выполнение общих обязательств требует собственной производственной базы. Расширим её на подконтрольной национальной территории."
 NW20_AUS_land_06:0 "Манёвры на стыке корон"
 NW20_AUS_land_06_desc:0 "Наиболее опасны разрывы между соседними командованиями. Проверим передачу донесений и резервов на совместном учении."
 NW20_AUS_land_07:0 "Подвижный федеральный резерв"
 NW20_AUS_land_07_desc:0 "Дадим штабу транспорт для быстрого усиления угрожаемого направления. Полномочия корон при этом сохраняются."
 NW20_AUS_land_08:0 "Опора на подготовленные рубежи"
 NW20_AUS_land_08_desc:0 "Армия будет экономно расходовать ресурсы и удерживать устойчивые линии снабжения. Введём особые нормы подвоза на время подготовки."
 NW20_AUS_land_09:0 "Общие оперативные наставления"
 NW20_AUS_land_09_desc:0 "Выбранный подход необходимо перевести на язык понятных приказов. Федеральная академия сведёт опыт частей в общий курс."
 NW20_AUS_land_10:0 "Пехотное вооружение корон"
 NW20_AUS_land_10_desc:0 "Разнообразие оружия усложняет снабжение. Поддержим исследование нового образца, пригодного для общего заказа."
 NW20_AUS_land_11:0 "Бронетехника для трудных дорог"
 NW20_AUS_land_11_desc:0 "Машины должны выдерживать реальные маршруты федерации. Испытания сосредоточатся на надёжности и взаимодействии с ремонтными службами."
 NW20_AUS_land_12:0 "Совместимый армейский организм"
 NW20_AUS_land_12_desc:0 "Федерация не обязана уничтожать различия своих частей, чтобы действовать согласованно. Проведём заключительный цикл общей подготовки."
 NW20_AUS_flight_01:0 "Воздушная служба федерации"
 NW20_AUS_flight_01_desc:0 "Коронные заказы должны складываться в общую воздушную программу. Начнём с координации штабов и подготовки экипажей."
 NW20_AUS_flight_02:0 "Истребитель для общего заказа"
 NW20_AUS_flight_02_desc:0 "Разные администрации смогут выбирать поставщиков по единым испытаниям. Исследуем перспективное лёгкое воздушное вооружение."
 NW20_AUS_flight_03:0 "Разведка горных направлений"
 NW20_AUS_flight_03_desc:0 "Сведения о перевалах нужны быстрее, чем их доставит конный связной. Поддержим самолёты с подходящей дальностью полёта."
 NW20_AUS_flight_04:0 "Аэродромные команды корон"
 NW20_AUS_flight_04_desc:0 "Службы разных корон должны обслуживать прибывший самолёт одинаково уверенно. Введём совместный учебный цикл."
 NW20_AUS_flight_05:0 "Радионавигационные исследования"
 NW20_AUS_flight_05_desc:0 "Горный рельеф усложняет связь и ориентирование. Лаборатории получат заказ на авиационные приборы."
 NW20_AUS_flight_06:0 "Общие воздушные манёвры"
 NW20_AUS_flight_06_desc:0 "Проверим, насколько единая программа работает вне кабинетов. Экипажи и штабы проведут совместное учение."
 NW20_AUS_flight_07:0 "Авиационные сборочные мощности"
 NW20_AUS_flight_07_desc:0 "Федеральным заказам нужна дополнительная производственная площадка. Построим её на собственной национальной территории."
 NW20_AUS_flight_08:0 "Наблюдатели при полевых штабах"
 NW20_AUS_flight_08_desc:0 "Воздушное донесение должно попадать к нужному командиру вовремя. Подготовим офицеров взаимодействия."
 NW20_AUS_flight_09:0 "Резерв технических команд"
 NW20_AUS_flight_09_desc:0 "Подготовленные механики позволят быстрее восстанавливать боеготовность частей. Продолжим специальный цикл обучения."
 NW20_AUS_flight_10:0 "Согласованная воздушная оборона"
 NW20_AUS_flight_10_desc:0 "Каждая корона сохраняет свой голос, но воздушная тревога требует единого ответа. Закрепим опыт совместного управления."
 NW20_AUS_maritime_01:0 "Адриатическая морская программа"
 NW20_AUS_maritime_01_desc:0 "Выход федерации к морю требует продуманной службы, а не только парадной эскадры. Откроем отдельную программу морского обеспечения."
 NW20_AUS_maritime_02:0 "Патрульные учебные отряды"
 NW20_AUS_maritime_02_desc:0 "Побережье нуждается в постоянном наблюдении. Подготовим экипажи к сопровождению и дозорной службе."
 NW20_AUS_maritime_03:0 "Корабельные конструкторские испытания"
 NW20_AUS_maritime_03_desc:0 "Небольшой флот не может позволить себе серию неудачных проектов. Усилим предварительные исследования корабельной техники."
 NW20_AUS_maritime_04:0 "Морские перевозки федерации"
 NW20_AUS_maritime_04_desc:0 "Выделим дополнительный транспорт для снабжения и торговли. Он останется под управлением Великой Австрии."
 NW20_AUS_maritime_05:0 "Верфи национального побережья"
 NW20_AUS_maritime_05_desc:0 "Ремонтный резерв необходим даже ограниченной морской программе. Если собственного подконтрольного побережья нет, средства вернутся в распоряжение правительства."
 NW20_AUS_maritime_06:0 "Адриатическая служба снабжения"
 NW20_AUS_maritime_06_desc:0 "Увязка ремонта и перевозок сделает флот предсказуемым участником общего плана. Проведём штабную проверку."
 NW20_AUS_maritime_07:0 "Долгосрочные заказы верфям"
 NW20_AUS_maritime_07_desc:0 "Верфи получат возможность планировать работу на год вперёд. Это поддержит выпуск кораблей без передачи территории между коронами."
 NW20_AUS_maritime_08:0 "Морской щит общего рынка"
 NW20_AUS_maritime_08_desc:0 "Федеральная торговля нуждается в устойчивом морском сообщении. Закрепим навыки охранения и обеспечения на совместном учении."
 NW20_HUN_economy_01:0 "Перепись хозяйства королевства"
 NW20_HUN_economy_01_desc:0 "Сводки комитатов расходятся даже в оценке урожая. Начнём хозяйственную программу с проверяемых данных о земле, рабочих и перевозках."
 NW20_HUN_economy_02:0 "Подъездные пути к элеваторам"
 NW20_HUN_economy_02_desc:0 "Хлеб должен попадать на рынок до того, как испортится. Соединим сельские склады с главными грузовыми направлениями."
 NW20_HUN_economy_03:0 "Курсы механиков для комитатов"
 NW20_HUN_economy_03_desc:0 "Ремонт трактора не должен требовать поездки в столицу. Технические школы подготовят местных механиков и инструкторов."
 NW20_HUN_economy_04:0 "Пищевая промышленность Альфёльда"
 NW20_HUN_economy_04_desc:0 "Переработка урожая внутри страны создаёт больше рабочих мест, чем простой вывоз зерна. Поможем открыть новые производственные мощности."
 NW20_HUN_economy_05:0 "Стандарты сельских мастерских"
 NW20_HUN_economy_05_desc:0 "Общие размеры деталей и инструмента позволят ремонтировать машины в любом комитате. Заводы получат временную поддержку освоения стандартов."
 NW20_HUN_economy_06:0 "Согласованный земельный кредит"
 NW20_HUN_economy_06_desc:0 "Сведём сроки ссуд с реальными доходами хозяйств. Предсказуемые платежи снизят напряжение в деревне без обещаний бесплатного кредита."
 NW20_HUN_economy_07:0 "Военные заказы Будапешта"
 NW20_HUN_economy_07_desc:0 "Сконцентрируем ресурсы на поставщиках гонведа. Военное строительство ускорится, но гражданским потребителям придётся нести часть расходов."
 NW20_HUN_economy_08:0 "Кредит провинциальным заводам"
 NW20_HUN_economy_08_desc:0 "Направим поддержку в гражданские предприятия за пределами столицы. Королевство получит более широкую производственную базу."
 NW20_HUN_economy_09:0 "Королевская счётная инспекция"
 NW20_HUN_economy_09_desc:0 "Ссуды и закупки должны оставлять проверяемый след. Инспекция отделит хозяйственные результаты от красивых отчётов."
 NW20_HUN_economy_10:0 "Электрификация промышленных приборов"
 NW20_HUN_economy_10_desc:0 "Точная аппаратура нужна и пищевой промышленности, и оружейным заводам. Свяжем лаборатории Будапешта с производственными заказами."
 NW20_HUN_economy_11:0 "Оружейные мощности королевства"
 NW20_HUN_economy_11_desc:0 "Гонвед не может зависеть от единственного поставщика. Создадим дополнительную линию военного производства на собственной территории."
 NW20_HUN_economy_12:0 "Хозяйство, способное выдержать кризис"
 NW20_HUN_economy_12_desc:0 "Перевозки, переработка и ремонт образуют общую систему. Закрепим производственные нормы, чтобы королевство не теряло выпуск при каждом внешнем потрясении."
 NW20_HUN_land_01:0 "Самостоятельная программа гонведа"
 NW20_HUN_land_01_desc:0 "Королевство отвечает за готовность собственных частей. Откроем отдельную военную программу, доступную независимо от очередного хозяйственного проекта."
 NW20_HUN_land_02:0 "Комитатские школы унтер-офицеров"
 NW20_HUN_land_02_desc:0 "Местная подготовка должна отвечать общим требованиям гонведа. Проверим инструкторов и обновим практический курс командования."
 NW20_HUN_land_03:0 "Артиллерийские испытания равнины"
 NW20_HUN_land_03_desc:0 "Открытая местность предъявляет свои требования к дальности и наблюдению. Артиллеристы получат отдельную исследовательскую программу."
 NW20_HUN_land_04:0 "Снабжение полковых штабов"
 NW20_HUN_land_04_desc:0 "Штаб не может управлять полком без связи, сапёров и исправного имущества. Пополним необходимое оборудование."
 NW20_HUN_land_05:0 "Вторая линия оружейных заказов"
 NW20_HUN_land_05_desc:0 "Один задержанный контракт не должен срывать подготовку всего гонведа. Расширим производственную базу военных поставщиков."
 NW20_HUN_land_06:0 "Учения на Тисе"
 NW20_HUN_land_06_desc:0 "Проверим взаимодействие пехоты, артиллерии и переправочных служб на крупном учении. Штаб получит практический опыт."
 NW20_HUN_land_07:0 "Моторизованный резерв гонведа"
 NW20_HUN_land_07_desc:0 "Выделим грузовики для быстрой переброски резервов. Это выбор в пользу подвижности, а не одновременное финансирование всех военных замыслов."
 NW20_HUN_land_08:0 "Территориальная система снабжения"
 NW20_HUN_land_08_desc:0 "Сделаем ставку на подготовленные склады и экономный подвоз. На год введём специальные правила обеспечения частей."
 NW20_HUN_land_09:0 "Королевское полевое наставление"
 NW20_HUN_land_09_desc:0 "Командиры должны знать, чего ждать от соседних частей. Закрепим выбранный подход в едином курсе полевой службы."
 NW20_HUN_land_10:0 "Обновление пехотного вооружения"
 NW20_HUN_land_10_desc:0 "Королевские заводы должны выпускать пригодное к массовому снабжению оружие. Поддержим исследования нового пехотного образца."
 NW20_HUN_land_11:0 "Испытательный броневой отряд"
 NW20_HUN_land_11_desc:0 "Проверим бронетехнику на местных дорогах и переправах. Исследовательская работа предшествует решению о крупных закупках."
 NW20_HUN_land_12:0 "Гонвед постоянной готовности"
 NW20_HUN_land_12_desc:0 "Система подготовки и снабжения теперь охватывает всё соединение. Проведём завершающий цикл обучения перед очередным призывом."
 NW20_HUN_flight_01:0 "Королевская воздушная программа"
 NW20_HUN_flight_01_desc:0 "Авиация не должна ждать завершения всех реформ гонведа. Выделим ей собственные задачи, учебный план и штабную подготовку."
 NW20_HUN_flight_02:0 "Лёгкие самолёты местной сборки"
 NW20_HUN_flight_02_desc:0 "Королевству нужен самолёт, который оно сможет обслуживать самостоятельно. Поддержим исследования лёгкой авиации."
 NW20_HUN_flight_03:0 "Разведка дунайских направлений"
 NW20_HUN_flight_03_desc:0 "Большие расстояния требуют устойчивого воздушного наблюдения. Исследуем машины с увеличенной продолжительностью полёта."
 NW20_HUN_flight_04:0 "Школа аэродромных техников"
 NW20_HUN_flight_04_desc:0 "Без подготовленных механиков даже исправные самолёты простаивают. Усилим учебную программу наземных команд."
 NW20_HUN_flight_05:0 "Радиолаборатория Будапешта"
 NW20_HUN_flight_05_desc:0 "Авиационная связь должна опираться на собственную техническую школу. Направим исследовательские средства на электронику."
 NW20_HUN_flight_06:0 "Воздушные манёвры королевства"
 NW20_HUN_flight_06_desc:0 "Сопоставим учебные нормативы с реальной работой частей. Командование получит опыт управления совместными полётами."
 NW20_HUN_flight_07:0 "Сборочные цеха авиации"
 NW20_HUN_flight_07_desc:0 "Серийное производство потребует дополнительных мощностей. Расширим военную промышленность для новых заказов."
 NW20_HUN_flight_08:0 "Наблюдатели гонведа"
 NW20_HUN_flight_08_desc:0 "Наземным частям нужны точные донесения с воздуха. Подготовим экипажи к работе с полковыми штабами."
 NW20_HUN_flight_09:0 "Резерв лётных инструкторов"
 NW20_HUN_flight_09_desc:0 "Учебная система должна сохраняться и после отправки лучших пилотов в части. Создадим подготовленную смену инструкторов."
 NW20_HUN_flight_10:0 "Воздушное прикрытие королевства"
 NW20_HUN_flight_10_desc:0 "Учебные школы, ремонт и штабы смогут действовать по общему плану. Завершим программу проверкой готовности."
 NW20_HUN_maritime_01:0 "Дунайская служба переправ"
 NW20_HUN_maritime_01_desc:0 "Королевству важнее исправные мосты и речные перевозки, чем океанские амбиции. Откроем самостоятельную программу инженерного обеспечения."
 NW20_HUN_maritime_02:0 "Учебные переправочные команды"
 NW20_HUN_maritime_02_desc:0 "Форсирование реки начинается с подготовки расчётов. Организуем отдельные занятия сапёров и пехотных командиров."
 NW20_HUN_maritime_03:0 "Речные складские районы"
 NW20_HUN_maritime_03_desc:0 "Грузы должны ожидать отправки у действующих путей сообщения. Улучшим инфраструктуру собственного подконтрольного региона."
 NW20_HUN_maritime_04:0 "Понтонное имущество"
 NW20_HUN_maritime_04_desc:0 "Подготовленные команды нуждаются в исправном оборудовании. Пополним вспомогательное имущество инженерных частей."
 NW20_HUN_maritime_05:0 "Ремонт грузовых тягачей"
 NW20_HUN_maritime_05_desc:0 "Транспорт переправочных служб должен выдерживать тяжёлую работу. Выделим дополнительную партию грузовиков."
 NW20_HUN_maritime_06:0 "Общий график речных перевозок"
 NW20_HUN_maritime_06_desc:0 "Сведём запросы гражданских ведомств и гонведа, чтобы они не мешали друг другу. Штаб проверит план перевозок на учении."
 NW20_HUN_maritime_07:0 "Инженерное обеспечение Дуная"
 NW20_HUN_maritime_07_desc:0 "Подготовленные склады и маршруты позволят экономнее снабжать части. Введём временную программу рационального подвоза."
 NW20_HUN_maritime_08:0 "Надёжные переправы королевства"
 NW20_HUN_maritime_08_desc:0 "Инженерные части, транспорт и командиры готовы к совместной работе. Завершим программу обучением резервных команд."
 NW20_GER_crown_audit:0 "Коронная счётная палата"
 NW20_GER_crown_audit_desc:0 "Контроль над рейхстагом не отменяет необходимости считать расходы. Палата проверит новые назначения и ведомственные закупки."
 NW20_GER_crown_service:0 "Профессиональная служба короны"
 NW20_GER_crown_service_desc:0 "Лояльность должна сопровождаться знанием дела. Поддержим подготовку гражданских служащих вместо бесконечной смены ведомств."
 NW20_GER_red_relief:0 "Восстановление рабочих районов"
 NW20_GER_red_relief_desc:0 "После политического перелома сторонникам революции нужны работа и крыша над головой. Поможем гражданскому строительству оправиться от потрясений."
 NW20_GER_red_inspection:0 "Рабочая инспекция снабжения"
 NW20_GER_red_inspection_desc:0 "Комитеты будут проверять поставки по фактическим результатам. Это уменьшит потери в тылу, не подменяя собой полевое командование."
 NW20_GER_parliament_accounts:0 "Бюджет под контролем рейхстага"
 NW20_GER_parliament_accounts_desc:0 "Ответственное министерство представит проверяемую смету. Публикация результатов укрепит доверие к парламентской монархии."
 NW20_GER_parliament_research:0 "Исследовательский фонд земель"
 NW20_GER_parliament_research_desc:0 "Общий фонд позволит землям участвовать в прикладной науке без политического торга по каждому заказу."
 NW20_AUS_compact_records:0 "Реестр федеральных обязательств"
 NW20_AUS_compact_records_desc:0 "Согласие корон должно быть оформлено конкретными обязательствами. Опубликуем распределение расходов и ответственных ведомств."
 NW20_AUS_compact_schools:0 "Обмен техническими стипендиями"
 NW20_AUS_compact_schools_desc:0 "Подготовка специалистов поможет общему рынку больше, чем новые торжественные декларации. Откроем совместимые учебные программы."
 NW20_AUS_compact_review:0 "Проверка исполнения договора"
 NW20_AUS_compact_review_desc:0 "Покажем подданным, что федерация умеет выполнять собственные обещания. Отчёты корон станут основой очередной ревизии."
 NW20_AUS_central_records:0 "Ответственность общих ведомств"
 NW20_AUS_central_records_desc:0 "Расширенные полномочия центра должны сопровождаться проверкой исполнения. Установим персональную ответственность за ведомственные расходы."
 NW20_AUS_central_training:0 "Курсы федеральных инспекторов"
 NW20_AUS_central_training_desc:0 "Проверяющий должен разбираться в работе предприятия. Подготовим технических специалистов для общей службы."
 NW20_AUS_central_review:0 "Исправление административных перегибов"
 NW20_AUS_central_review_desc:0 "Единое управление не должно парализовать местные учреждения. Пересмотрим распоряжения, мешающие повседневной работе."
 NW20_HUN_partner_accounts:0 "Отчёт перед королевским сеймом"
 NW20_HUN_partner_accounts_desc:0 "Участие в федерации требует понятного объяснения расходов. Представим сейму исполнение согласованных обязательств."
 NW20_HUN_partner_schools:0 "Совместимые технические дипломы"
 NW20_HUN_partner_schools_desc:0 "Наши специалисты должны пользоваться результатами общего образования без потери королевских полномочий. Согласуем технические программы."
 NW20_HUN_partner_audit:0 "Проверка взаимных обязательств"
 NW20_HUN_partner_audit_desc:0 "Равноправное партнёрство держится на исполнении договора. Опубликуем результаты проверки королевских ведомств."
 NW20_HUN_rights_accounts:0 "Смета гарантированной автономии"
 NW20_HUN_rights_accounts_desc:0 "Полученные гарантии нужно воплотить в работе учреждений. Сейм утвердит прозрачное распределение собственных расходов."
 NW20_HUN_rights_schools:0 "Королевские технические стипендии"
 NW20_HUN_rights_schools_desc:0 "Самостоятельное управление требует подготовленных специалистов. Откроем программу прикладного образования."
 NW20_HUN_rights_review:0 "Практика королевского самоуправления"
 NW20_HUN_rights_review_desc:0 "Проверим, какие полномочия действительно работают на местах. Исправление ведомственных задержек укрепит доверие к достигнутому соглашению."
 NW20_SOV_economy_01:0 "Стандарты грузовых партий"
 NW20_SOV_economy_01_desc:0 "Единый порядок отправки избавит железные дороги от лишней сортировки. Начнём с устранения узких мест на собственной территории."
 NW20_SOV_economy_02:0 "Мастера для новых предприятий"
 NW20_SOV_economy_02_desc:0 "Расширение производства требует людей, способных обслуживать оборудование. Поддержим прикладную промышленную подготовку."
 NW20_SOV_economy_03:0 "Гражданские производственные кооперации"
 NW20_SOV_economy_03_desc:0 "Местные мастерские получат возможность объединить заказы и вырасти в полноценные предприятия."
 NW20_SOV_economy_04:0 "Точные приборы для заводов"
 NW20_SOV_economy_04_desc:0 "Рост выпуска требует контроля качества. Выделим исследовательскую поддержку промышленной электронике."
 NW20_SOV_economy_05:0 "Приёмка общегосударственных заказов"
 NW20_SOV_economy_05_desc:0 "Закупки должны оцениваться по сроку и качеству, а не по близости подрядчика к ведомству. Упорядочим систему контроля."
 NW20_SOV_economy_06:0 "Закрепление производственных стандартов"
 NW20_SOV_economy_06_desc:0 "Заводы, перевозчики и технические школы переходят на общие нормы. Годовая программа внедрения ускорит освоение производства; постоянная унификация сократит потери эффективности при смене заказов."
 NW20_SOV_land_01:0 "Окружные школы снабжения"
 NW20_SOV_land_01_desc:0 "Пространства России превращают ошибки подвоза в оперативные поражения. Научим штабных офицеров работать с реальными маршрутами."
 NW20_SOV_land_02:0 "Испытания пехотного вооружения"
 NW20_SOV_land_02_desc:0 "Новый образец должен выдерживать службу в разных климатических условиях. Выделим исследовательские средства на вооружение пехоты."
 NW20_SOV_land_03:0 "Транспорт окружных резервов"
 NW20_SOV_land_03_desc:0 "Резерву недостаточно существовать на бумаге. Выделим грузовики для его переброски и обеспечения."
 NW20_SOV_land_04:0 "Опытное броневое соединение"
 NW20_SOV_land_04_desc:0 "Проверим бронетехнику вместе с пехотой и ремонтными службами. Результаты определят дальнейшие закупки."
 NW20_SOV_land_05:0 "Разбор окружных манёвров"
 NW20_SOV_land_05_desc:0 "Сопоставим опыт разных округов и исправим несовместимые нормы подготовки. Генеральный штаб получит практические выводы."
 NW20_SOV_land_06:0 "Общая подготовка резервов"
 NW20_SOV_land_06_desc:0 "Командиры и специалисты будут проходить общий цикл подготовки до прибытия в части. Резервные подразделения сохранят организацию и потребуют меньше снабжения при развёртывании."
 NW20_SOV_maritime_01:0 "Снабжение разобщённых эскадр"
 NW20_SOV_maritime_01_desc:0 "Русские флоты разделены расстояниями. Каждому нужен запас транспорта и понятный порядок обеспечения."
 NW20_SOV_maritime_02:0 "Корабельные испытательные комиссии"
 NW20_SOV_maritime_02_desc:0 "Опыт разных морей должен влиять на проекты новых кораблей. Поддержим исследовательскую работу кораблестроителей."
 NW20_SOV_maritime_03:0 "Ремонтный резерв флота"
 NW20_SOV_maritime_03_desc:0 "Исправный корабль полезнее корабля, ожидающего дока. Расширим верфи на собственном подконтрольном национальном побережье."
 NW20_SOV_maritime_04:0 "Учебные отряды сопровождения"
 NW20_SOV_maritime_04_desc:0 "Торговые перевозки нуждаются в подготовленном охранении. Проведём отдельный цикл морских учений."
 NW20_SOV_maritime_05:0 "Общий календарь морских заказов"
 NW20_SOV_maritime_05_desc:0 "Заводы и верфи получат согласованный график поставок. На год поддержим серийное кораблестроение."
 NW20_SOV_maritime_06:0 "Проверка морской готовности"
 NW20_SOV_maritime_06_desc:0 "Заключительные учения проверят эскадры, ремонтные доки и транспортные запасы в одном плане. Флот закрепит единый порядок готовности, а верфи смогут быстрее выполнять последующие заказы."
 NW20_SOV_flight_01:0 "Сеть технических инструкторов"
 NW20_SOV_flight_01_desc:0 "Воздушные части нуждаются в подготовленных механиках во всех округах. Откроем годовой цикл обучения технических команд."
 NW20_SOV_flight_02:0 "Авиационная радиотехника"
 NW20_SOV_flight_02_desc:0 "Связь должна работать далеко от столичных полигонов. Поддержим исследования приборов для воздушной службы."
 NW20_SOV_flight_03:0 "Серийная авиационная сборка"
 NW20_SOV_flight_03_desc:0 "Расширим производственную базу для выполнения воздушных заказов на собственной территории."
 NW20_SOV_flight_04:0 "Дальняя воздушная разведка"
 NW20_SOV_flight_04_desc:0 "Большие расстояния требуют соответствующей техники. Исследуем самолёты с увеличенной продолжительностью полёта."
 NW20_SOV_flight_05:0 "Согласование окружных воздушных планов"
 NW20_SOV_flight_05_desc:0 "Экипажи должны понимать задачи соседних соединений. Штаб проведёт совместное учение и разбор его результатов."
 NW20_SOV_flight_06:0 "Резерв воздушных специалистов"
 NW20_SOV_flight_06_desc:0 "Закрепим подготовку сменных экипажей и механиков, чтобы первые потери не разрушали всю систему обучения."
 NW20_GEN_economy_01:0 "Второй промышленный план"
 NW20_GEN_economy_01_desc:0 "После первого хозяйственного этапа кабинет сможет финансировать ежегодный гражданский проект через решения."
 NW20_GEN_economy_02:0 "Транспортное проектирование"
 NW20_GEN_economy_02_desc:0 "Проектные бюро подготовят следующую строительную технологию, согласовав её с потребностями хозяйства."
 NW20_GEN_economy_03:0 "Промышленные исследования"
 NW20_GEN_economy_03_desc:0 "Средства второго плана направляются на технологические процессы действующих предприятий."
 NW20_GEN_economy_04:0 "Новые гражданские предприятия"
 NW20_GEN_economy_04_desc:0 "Будет построена одна фабрика в подходящем национальном регионе. Отсутствие места заменит стройку ограниченной программой координации производства."
 NW20_GEN_economy_05:0 "Электротехнические программы"
 NW20_GEN_economy_05_desc:0 "Предприятия получат поддержку освоения электроники, необходимой связи и современному управлению."
 NW20_GEN_economy_06:0 "Согласование хозяйственного плана"
 NW20_GEN_economy_06_desc:0 "Обе подготовительные линии соединяются во временную программу повышения эффективности предприятий."
 NW20_GEN_economy_07:0 "Машинные инструменты"
 NW20_GEN_economy_07_desc:0 "Инженеры сосредоточатся на очередном этапе промышленного исследования."
 NW20_GEN_economy_08:0 "Промышленная устойчивость"
 NW20_GEN_economy_08_desc:0 "Годовая поддержка гражданских строек и предсказуемые заказы закрепят результаты второго плана."
 NW20_GEN_land_01:0 "Новая организация армии"
 NW20_GEN_land_01_desc:0 "Вторая глава открывается после резервной либо кадровой подготовки. Обе модели могут продолжить модернизацию."
 NW20_GEN_land_02:0 "Полевая подготовка"
 NW20_GEN_land_02_desc:0 "Учебный сезон даст опыт и на ограниченный срок улучшит организацию армии."
 NW20_GEN_land_03:0 "Артиллерийская модернизация"
 NW20_GEN_land_03_desc:0 "Штаб уточнит требования к артиллерии и поддержит соответствующее исследование."
 NW20_GEN_land_04:0 "Имущество вспомогательных служб"
 NW20_GEN_land_04_desc:0 "Связисты и сапёры должны располагать исправным оснащением. Пополним армейские запасы вспомогательного оборудования."
 NW20_GEN_land_05:0 "Военные производственные резервы"
 NW20_GEN_land_05_desc:0 "Дополнительная производственная линия снизит зависимость армии от одного поставщика. Расширим собственные военные мощности."
 NW20_GEN_land_06:0 "Совместные учения снабжения"
 NW20_GEN_land_06_desc:0 "После обеих подготовительных линий армия получит годовую снабженческую программу и доступ к повторным платным мероприятиям."
 NW20_GEN_land_07:0 "Экономный порядок снабжения"
 NW20_GEN_land_07_desc:0 "Подготовленные нормы подвоза позволят расходовать меньше ресурсов на поддержание частей. Введём специальную программу на год."
 NW20_GEN_land_08:0 "Новая школа подготовки"
 NW20_GEN_land_08_desc:0 "Завершающий учебный год укрепит организацию армии и даст дополнительный опыт командованию."
 nw20_tools:0 "Освоение производственных стандартов"
 nw20_tools_desc:0 "Предприятия осваивают совместимые детали и согласованные нормы выпуска. Поддержка действует в течение года."
 nw20_contracts:0 "Долгосрочный военный заказ"
 nw20_contracts_desc:0 "Военное строительство получает преимущество, но гражданское хозяйство несёт дополнительные издержки."
 nw20_workshops:0 "Поддержка гражданских подрядчиков"
 nw20_workshops_desc:0 "Небольшие предприятия получают доступ к заказам и временную поддержку расширения мощностей."
 nw20_supply:0 "Согласованный подвоз"
 nw20_supply_desc:0 "Общие нормы и подготовленные маршруты снижают расход ресурсов на снабжение частей."
 nw20_training:0 "Практическая подготовка командиров"
 nw20_training_desc:0 "Временная программа обучения улучшает взаимодействие частей и штабов."
 nw20_flight:0 "Подготовка воздушных служб"
 nw20_flight_desc:0 "Лётчики и наземные команды проходят согласованный цикл подготовки."
 nw20_shipbuilding:0 "Согласованные заказы верфям"
 nw20_shipbuilding_desc:0 "Верфи работают по предсказуемому графику поставок и выпуска серийных кораблей."
 NW20_research:0 "Прикладная исследовательская программа"
nw21_ger_contract_coordination:0 "Казённые заказы и военная промышленность"
nw21_ger_contract_coordination_desc:0 "Долгосрочные контракты гарантируют загрузку арсеналов, хотя часть ресурсов уходит с гражданского рынка."
nw21_ger_sme_network:0 "Сеть средних поставщиков"
nw21_ger_sme_network_desc:0 "Малые и средние предприятия включены в общие производственные цепочки, что повышает их устойчивость и отдачу."
nw21_ger_mobile_reserves:0 "Мобильный армейский резерв"
nw21_ger_mobile_reserves_desc:0 "Подготовленные моторизованные резервы могут быстрее поддержать участок, не теряя общей организации."
nw21_ger_field_supply:0 "Планомерное фронтовое снабжение"
nw21_ger_field_supply_desc:0 "Штабные нормы и подготовленные обозы уменьшают потери при снабжении полевых частей."
nw21_ger_fleet_standards:0 "Единые стандарты флота"
nw21_ger_fleet_standards_desc:0 "Серийные проекты и согласованные ремонтные графики повышают отдачу германских верфей."
nw21_ger_air_service:0 "Объединённая воздушная служба"
nw21_ger_air_service_desc:0 "Подготовка наземных служб и общие регламенты уменьшают аварии и помогают заводам осваивать серию."
nw21_sov_production_standards:0 "Общегосударственные производственные нормы"
nw21_sov_production_standards_desc:0 "Единые технические требования сокращают потери при переходе заводов с одного заказа на другой."
nw21_sov_reserve_system:0 "Система окружных резервов"
nw21_sov_reserve_system_desc:0 "Подготовленные специалисты и согласованные нормы позволяют быстрее вводить резервные части в строй."
nw21_sov_fleet_readiness:0 "Готовность разобщённых флотов"
nw21_sov_fleet_readiness_desc:0 "Общий порядок ремонта и снабжения делает отдельные морские театры устойчивее, а доки — производительнее."
nw21_sov_air_service:0 "Служба технической авиации"
nw21_sov_air_service_desc:0 "Региональные школы механиков и стандарты обслуживания снижают потери самолётов и упрощают серийное производство."
