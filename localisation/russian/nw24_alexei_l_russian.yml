l_russian:
 nw24.1.t:0 "Границы полномочий кабинета"
 nw24.1.d:0 "Врачи разрешили государю вернуться к части обязанностей, но министры всё ещё ждут личной подписи под десятками текущих распоряжений. Председатель кабинета предлагает разделить политические решения и повседневную работу ведомств. Двор опасается, что временное удобство станет постоянной уступкой.\n\nЦарь сохранит верховную власть при любом решении. Сейчас определяется другое: должен ли аппарат каждый раз ждать воли государя или исполнять заранее установленный круг поручений самостоятельно?"
 nw24.1.a:0 "Министры действуют по личным указаниям государя."
 nw24.1.b:0 "Определим кабинету самостоятельный круг обязанностей."
 nw24.2.t:0 "Хартия вступает в силу"
 nw24.2.d.personal:0 "В Зимнем дворце подписаны последние листы хартии. Государь сохранил личное руководство кабинетом; восстановившееся здоровье позволяет ему возвращаться к делам без прежних перерывов. Министерства получили ясный порядок исполнения указов, губернии — установленный путь обращения к центру. Это по-прежнему самодержавная монархия, но её работа теперь меньше зависит от придворных посредников."
 nw24.2.d.cabinet:0 "На столе председателя кабинета лежит подписанная хартия. Царь оставил за собой верховные решения, а министерства получили определённый круг самостоятельных обязанностей. Даже новый медицинский бюллетень не должен останавливать работу правительства. Двор принял это устройство ценой части повседневного контроля; содержание ответственного аппарата потребует постоянных расходов."
 nw24.2.d.limited:0 "Хартия подписана, однако государь пока не может ежедневно руководить всеми ведомствами. Документ закрепляет временное распределение обязанностей и избавляет аппарат от ожидания каждой аудиенции. При дальнейшем восстановлении здоровья личный мандат царя можно будет пересмотреть через решение правительства. Болезнь больше не означает остановку государства."
 nw24.2.a:0 "Установленные правила должны действовать и завтра."
 nw24.3.t:0 "Новая грамота доминиона"
 nw24.3.d:0 "Из Петрограда прибыл проект подтверждения особых прав нашего государства. Российское правительство предлагает сохранить действующее устройство автономии и закрепить финансовые гарантии, чтобы будущие споры о сметах не решались случайным указом.\n\nПодпись даст правительству опору для собственного бюджета. Можно и отложить согласование: отказ не меняет границ или автономии, а оставляет вопрос для следующих переговоров."
 nw24.3.a:0 "Закрепим гарантии подписью правительства."
 nw24.3.b:0 "Сметы ещё требуют согласования."
 nw24.3.c:0 "Мы больше не состоим в этих отношениях с Россией."
 nw24.4.t:0 "Ответ доминиона"
 nw24.4.d.signed:0 "Правительство государства [From.GetName] подписало грамоту. Подтверждение полномочий принято как обязательство центра соблюдать согласованные финансовые правила. После завершения монархической хартии этот договор станет частью постоянного компромисса — вместе с расходами, которые Россия взяла на себя."
 nw24.4.d.deferred:0 "Правительство государства [From.GetName] отложило подпись. Возражения относятся к финансовым положениям грамоты, а не к самому существованию доминиона. Доверие к центру несколько снизилось. Петроград сможет направить новый проект через решения; ход основной реформы правительства от этого не останавливается."
 nw24.4.a:0 "Примем ответ к сведению."
 nw24_alexei:0 "Хартия Российской монархии"
 nw24_alexei_desc:0 "Здоровье государя: [?nw_health|0]/100. Доверие губерний: [?nw_trust|0]/100.\nЛечение доступно и после окончания острой фазы болезни. Для общественного договора нужно доверие выше 49; сессии Государственного совета восстанавливают этот ресурс. Подписанные грамоты действующих доминионов влияют на итоговый компромисс."
 nw24_state_council:0 "Созвать Государственный совет губерний"
 nw24_state_council_desc:0 "Постоянное представительство заменяет разовые встречи с земствами. За 25 политической власти раз в 60 дней можно восстановить 12 пунктов доверия. Действие доступно при доверии ниже 89."
 nw24_retry_pol:0 "Вернуться к польской грамоте"
 nw24_retry_pol_desc:0 "Подготовим новый проект для польского правительства. Переговоры стоят 35 политической власти; повторная попытка возможна раз в 90 дней после ответа на предыдущее предложение. Подпись остаётся решением самого доминиона."
 nw24_retry_fin:0 "Вернуться к финляндской грамоте"
 nw24_retry_fin_desc:0 "Согласуем спорные финансовые положения и вновь направим документ в Финляндию. Стоимость — 35 политической власти, интервал между предложениями — 90 дней. Уровень автономии не меняется."
 nw24_restore_personal_rule:0 "Пересмотреть личный мандат государя"
 nw24_restore_personal_rule_desc:0 "При здоровье выше 69 можно завершить временное распределение полномочий и перейти к принятому ранее варианту личного руководства. За 40 политической власти ограниченный порядок будет заменён усиленным личным мандатом, без сложения двух духов."
 NW24_civil_service_bonus:0 "Имперская школа управления"
 nw24_cabinet_basic:0 "Самостоятельный круг министерств"
 nw24_cabinet_basic_desc:0 "Кабинет получает право исполнять установленные обязанности без отдельной аудиенции. Верховная власть остаётся у государя; ведомственный аппарат требует содержания."
 nw24_personal_office:0 "Коронный секретариат"
 nw24_personal_office_desc:0 "Министры работают по личным поручениям монарха. Центр быстрее принимает решения, но система по-прежнему зависит от возможности государя постоянно заниматься делами."
 nw24_cabinet_office:0 "Кабинет определённых полномочий"
 nw24_cabinet_office_desc:0 "Чёткое разделение обязанностей укрепляет стабильность повседневного управления. Самостоятельность ведомств не означает парламентской монархии."
 nw24_personal_rule:0 "Личный мандат восстановленного государя"
 nw24_personal_rule_desc:0 "Здоровье Алексея позволяет ему руководить исполнительной властью лично. Хартия закрепляет порядок работы правительства и его постоянные расходы."
 nw24_cabinet_rule:0 "Монархия действующего кабинета"
 nw24_cabinet_rule_desc:0 "Верховная власть царя сочетается с устойчивой самостоятельной работой министерств. Это помогает строительству и внутренней политике, но более развитый аппарат требует содержания."
 nw24_limited_rule:0 "Распределённые обязанности короны"
 nw24_limited_rule_desc:0 "Государь сохранил избранный личный мандат, но ещё не может полностью его исполнять. Лечение и последующий пересмотр полномочий позволяют улучшить этот порядок."
 nw24_convalescence:0 "Щадящий режим государя"
 nw24_convalescence_desc:0 "Острая фаза болезни прошла, однако царю всё ещё нужен покой. Дополнительное лечение в решениях снимет это ограничение, когда здоровье превысит 69."
 nw24_reform_cost:0 "Исполнение общественного договора"
 nw24_reform_cost_desc:0 "Первые расходы по согласованным обязательствам временно увеличивают хозяйственную нагрузку. Принятие хартии снимет этот переходный эффект досрочно."
 nw24_dominion_compact:0 "Финансовый компромисс с доминионами"
 nw24_dominion_compact_desc:0 "Хотя бы один действующий доминион подписал подтверждение прав. Стабильность и торговое доверие укрепились, а центр принял на себя дополнительные расходы. При прекращении соответствующих отношений эффект пересматривается ежемесячно."
 nw24_succession_statute:0 "Опубликованный порядок наследования"
 nw24_succession_statute_desc:0 "Престолонаследие и временное замещение власти определены законом, что уменьшает пространство для придворного торга."
 nw24_succession_settled:0 "Защищённая преемственность престола"
 nw24_succession_settled_desc:0 "Закон подкреплён подготовкой наследника вне придворных группировок. Этот порядок заменяет предыдущий вариант престолонаследия."
 nw24_civil_service:0 "Гражданская служба губерний"
 nw24_civil_service_desc:0 "Подготовленные служащие ускоряют выполнение строительных смет; содержание общих учреждений создаёт постоянную хозяйственную нагрузку."
 nw24_internal_market:0 "Согласование губернских рынков"
 nw24_internal_market_desc:0 "Временная программа согласует закупки, перевозки и строительные нормы. Её преимущества сопровождаются расходами на исполнение правил."
 nw24_public_peace:0 "Политическое перемирие"
 nw24_public_peace_desc:0 "Достигнутое согласие с Думой даёт правительству год более спокойной работы. Перемирие не меняет самодержавную форму власти."
