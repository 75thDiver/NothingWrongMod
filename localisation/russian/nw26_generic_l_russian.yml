l_russian:
 nw26_gen_administration:0 "Упорядоченная администрация"
 nw26_gen_administration_desc:0 "Подготовленные служащие получают понятные полномочия, а ведомства согласуют расходы до отправки приказов на места."
 nw26_gen_local_administration:0 "Местные административные соглашения"
 nw26_gen_local_administration_desc:0 "Центральные ведомства согласовали закупки и исполнение распоряжений с муниципальными учреждениями."
 nw26_gen_mass_army:0 "Территориальный резерв"
 nw26_gen_mass_army_desc:0 "Армия делает ставку на подготовленный резерв и быстрый призыв. Большое число частей предъявляет повышенные требования к снабжению."
 nw26_gen_professional_army:0 "Профессиональные кадры"
 nw26_gen_professional_army_desc:0 "Школы готовят командиров и специалистов для устойчивых соединений. Более требовательная подготовка замедляет выпуск новых подразделений."
 nw26_gen_industrial_adjustment:0 "Производственная координация"
 nw26_gen_industrial_adjustment_desc:0 "Временная программа улучшает работу существующих предприятий там, где невозможно немедленно открыть новую стройку."
 nw26_gen_investment_cost:0 "Расходы местных проектов"
 nw26_gen_investment_cost_desc:0 "Заказы профинансированы заранее; средства вернутся в хозяйство после выполнения программы."
 nw26_gen_logistics:0 "Согласованные перевозки"
 nw26_gen_logistics_desc:0 "Пересмотр графиков и норм складского учёта сокращает потери снабжения."
 nw26_gen_flexible_navy:0 "Прибрежное морское планирование"
 nw26_gen_flexible_navy_desc:0 "Малые силы готовят к охране собственных коммуникаций и взаимодействию с береговыми службами."
 nw26_gen_large_navy:0 "Оперативное планирование флота"
 nw26_gen_large_navy_desc:0 "Штаб готовит согласованные действия крупных соединений. Подготовка не создаёт бесплатных кораблей и требует хозяйственной базы."
 nw26_gen_agency_training:0 "Подготовка специальных служб"
 nw26_gen_agency_training_desc:0 "Кадровый учебный центр на ограниченный срок ускоряет освоение организационных улучшений агентства."
 nw26_gen_operatives:0 "Международные отделения"
 nw26_gen_operatives_desc:0 "Согласованные кадровые назначения позволяют содержать одного дополнительного оперативника. Дух применяется только при поддержке агентств."
 nw26_gen_encryption:0 "Защищённая служебная связь"
 nw26_gen_encryption_desc:0 "Ведомства приняли единые правила обращения с шифрами и закрытой перепиской."
 nw26_gen_decryption:0 "Радиоаналитические группы"
 nw26_gen_decryption_desc:0 "Аналитики объединяют наблюдения радиопостов и результаты технических исследований."
 nw26_gen_trade_programme:0 "Согласованные хозяйственные заказы"
 nw26_gen_trade_programme_desc:0 "Стороны приняли ограниченную программу поставок и подготовки предприятий. Это исполнение оплаченных заказов, а не новый военный союз."
 nw26_gen_subject_programme:0 "Согласованная местная программа"
 nw26_gen_subject_programme_desc:0 "Метрополия подтвердила финансирование местных ведомств. Программа сохраняет государственный и автономный статус участника."
 nw26.1.t:0 "Порядок работы ведомств"
 nw26.1.d:0 "Служащие требуют ясного распределения ответственности. Кабинет может опереться на подготовленные центральные ведомства либо закрепить согласование расходов с местными учреждениями. Глава государства и правящая партия сохраняют свои полномочия."
 nw26.1.a:0 "Укрепить профессиональный аппарат."
 nw26.1.b:0 "Закрепить местное согласование."
 nw26.1.c:0 "Вернуться к вопросу после обсуждения бюджета."
 nw26.1.stale:0 "Предложение утратило силу."
 nw26.10.t:0 "Местная программа и общее казначейство"
 nw26.10.d:0 "[FROM.GetName] предлагает согласовать закупки и работу местных учреждений. Согласие потребует 25 единиц политической власти от метрополии и даст субъекту хозяйственную поддержку на 180 дней. Самостоятельность страны и её тип автономии не меняются."
 nw26.10.a:0 "Поддержать ограниченную программу."
 nw26.10.b:0 "Сейчас средств на это нет."
 nw26.10.stale:0 "Предложение утратило силу."
 nw26.20.t:0 "Сосед предлагает хозяйственные заказы"
 nw26.20.d:0 "[FROM.GetName] готово оплатить совместную программу закупок. Принятие потребует 20 единиц политической власти и на 180 дней поддержит гражданские стройки обеих стран. Политические и военные обязательства не изменятся."
 nw26.20.a:0 "Принять ограниченную программу."
 nw26.20.b:0 "Отказаться от новых расходов."
 nw26.20.stale:0 "Предложение утратило силу."
 nw26.21.t:0 "Региональное административное совещание"
 nw26.21.d:0 "Представители [FROM.GetName] предлагают согласовать транспортные правила и служебные контакты. Принятие стоит 20 единиц политической власти; обе стороны получат логистическую программу на 180 дней. Обсуждение не создаёт фракцию и не меняет границы."
 nw26.21.a:0 "Принять ограниченную программу."
 nw26.21.b:0 "Отказаться от новых расходов."
 nw26.21.stale:0 "Предложение утратило силу."
 nw26.22.t:0 "Обмен техническими специалистами"
 nw26.22.d:0 "[FROM.GetName] предлагает обмен инженерами и опытом стандартизации. Принятие стоит 20 единиц политической власти; обе страны получат по одному бонусу 25% к исследованию электроники. Ни одна сторона не передаёт готовые технологии."
 nw26.22.a:0 "Принять ограниченную программу."
 nw26.22.b:0 "Отказаться от новых расходов."
 nw26.22.stale:0 "Предложение утратило силу."
 nw26.90.t:0 "Программа согласована"
 nw26.90.d:0 "Партнёр принял предложение. Применяются только заранее оговорённые хозяйственные результаты."
 nw26.90.a:0 "Принять к сведению."
 nw26.90.stale:0 "Предложение утратило силу."
 nw26.91.t:0 "Предложение отклонено"
 nw26.91.d:0 "Партнёр отказался от новых расходов. Прежние дипломатические отношения сохранены; повторное предложение возможно после перерыва."
 nw26.91.a:0 "Принять к сведению."
 nw26.91.stale:0 "Предложение утратило силу."
 nw26_generic_development:0 "Государственные программы"
 nw26_generic_development_desc:0 "Развитие оплачивается политическими ресурсами и временными расходами. Для совместных программ требуется ответ партнёра. Независимость и государственный строй определяются национальными сценариями."
 nw26_admin_funding:0 "Оплатить работу местных служб"
 nw26_admin_funding_desc:0 "На 120 дней вводится логистическая программа. Её финансирование на тот же срок увеличивает долю потребительских товаров на 2 процентных пункта."
 nw26_admin_reopen:0 "Вернуться к устройству ведомств"
 nw26_admin_reopen_desc:0 "Вновь обсудить порядок управления после отсрочки. Выбор не меняет правящую партию или главу государства."
 nw26_domestic_investment:0 "Финансировать гражданский проект"
 nw26_domestic_investment_desc:0 "Одна фабрика строится только в собственном контролируемом core со свободным местом. Если такого региона нет, доступна отдельная программа производственной координации. Стоимость включает 180 дней дополнительных потребительских расходов."
 nw26_workshop_coordination:0 "Согласовать работу действующих предприятий"
 nw26_workshop_coordination_desc:0 "Вместо новой стройки направить средства на существующие производства: рост эффективности +4% на 180 дней при расходах на потребительские товары +2 процентных пункта."
 nw26_staff_exercises:0 "Провести штабные учения"
 nw26_staff_exercises_desc:0 "Армия получит 10 опыта. На 120 дней казна отвлечёт часть средств на организацию учений."
 nw26_supply_schedule:0 "Пересмотреть графики снабжения"
 nw26_supply_schedule_desc:0 "Расход снабжения уменьшится на 3% на 180 дней; на тот же срок вырастут расходы хозяйственной программы."
 nw26_air_training:0 "Оплатить курс подготовки лётчиков"
 nw26_air_training_desc:0 "Авиация получит 10 опыта и программу уменьшения аварийности на 180 дней, с временными хозяйственными расходами."
 nw26_subject_consultations:0 "Согласовать программу с метрополией"
 nw26_subject_consultations_desc:0 "Направить сюзерену новое предложение о местной программе. Он вправе отказаться. Принятый проект длится 180 дней и не выдаёт очки автономии или независимость."
 nw26_trade_mission:0 "Хозяйственная миссия к соседу"
 nw26_trade_mission_desc:0 "Послать предложение одному случайному соседу, с которым нет войны. Получатель отдельно выбирает согласие или отказ. Расходы на подготовку не возвращаются при отказе; ответ ожидается до 30 дней."
 nw26_conference_mission:0 "Региональное совещание"
 nw26_conference_mission_desc:0 "Послать предложение одному случайному соседу, с которым нет войны. Получатель отдельно выбирает согласие или отказ. Расходы на подготовку не возвращаются при отказе; ответ ожидается до 30 дней."
 nw26_tech_mission:0 "Предложить обмен специалистами"
 nw26_tech_mission_desc:0 "Послать предложение одному случайному соседу, с которым нет войны. Получатель отдельно выбирает согласие или отказ. Расходы на подготовку не возвращаются при отказе; ответ ожидается до 30 дней."
 nw26_technical_exchange:0 "Обмен техническими специалистами"
 nw26_unlock_admin_tt:0 "Открывает платные программы местных служб в решениях."
 nw26_consultations_tt:0 "Предлагает метрополии местную хозяйственную программу. Требуется её согласие; автономный статус сохраняется."
 nw26_unlock_investment_tt:0 "Открывает ежегодное решение о гражданской стройке за 100 политической власти и 180 дней хозяйственных расходов."
 nw26_unlock_training_tt:0 "Открывает платные курсы подготовки лётчиков."
 nw26_unlock_trade_tt:0 "Открывает ежегодную хозяйственную миссию к соседу; получатель может отказаться."
 nw26_unlock_conference_tt:0 "Открывает региональное совещание после прохождения соответствующего фокуса; требуется согласие соседа."
 nw26_unlock_tech_tt:0 "Открывает ежегодное предложение об обмене специалистами: один бонус 25% к электронике каждой стороне при согласии."
