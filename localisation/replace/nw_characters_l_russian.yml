l_russian:
 NW_MAN_COMMISSION:0 "Русско-японская комиссия"
 NW_MAN_COMMISSION_desc:0 "Комиссия двух держав управляет Маньчжурией по статуту 1921 года. Российские представители ведают северными железнодорожными концессиями, японские — южными; бюджет, внешняя политика и военные вопросы требуют совместного решения. Китайская местная администрация подчинена комиссии."
 NW_HABSBURG_EMPEROR_DESC:0 "Франц Фердинанд пережил кризис 1914 года и унаследовал монархию после смерти Франца Иосифа. Венгерский конфликт заставил двор искать новую опору в соглашении австрийской, венгерской и славянской частей империи. К 1936 году это соглашение удерживает державу вместе, хотя споры о полномочиях корон так и не закончились."
