l_russian:
 NWG_a_government_without_government:0 "Федеративное соглашение коммун"
 NWG_a_government_without_government_desc:0 "Общины определят постоянный порядок совместной работы, не передавая всю повседневную власть единому центру."
 NWG_a_grill_in_every_home:0 "Местные общественные службы"
 NWG_a_grill_in_every_home_desc:0 "Школы, санитарная помощь и исправные учреждения дадут умеренному правительству заметную опору в обществе."
 NWG_a_new_leader:0 "Обновление государственного аппарата"
 NWG_a_new_leader_desc:0 "Кабинет обсудит, как разделить ответственность между профессиональными ведомствами и местными администрациями. Выбор оформляется отдельным событием."
 NWG_a_true_kakistocracy:0 "Правительство покровителей"
 NWG_a_true_kakistocracy_desc:0 "Влиятельные семьи и деловые круги предлагают кабинету поддержку в обмен на участие в распределении государственных заказов."
 NWG_a_useful_puppet:0 "Военные полномочия автономии"
 NWG_a_useful_puppet_desc:0 "Местное правительство возьмёт на себя подготовку частей, предназначенных для обороны своей территории."
 NWG_aa_and_antitank_production:0 "Противотанковые и зенитные средства"
 NWG_aa_and_antitank_production_desc:0 "Развитие техники требует специализированных орудий и подготовленных расчётов для борьбы с новыми угрозами."
 NWG_abolish_all_ownership:0 "Отмена частной собственности"
 NWG_abolish_all_ownership_desc:0 "Общины и трудовые объединения предлагают передать частные хозяйственные владения в коллективное распоряжение."
 NWG_an_enlightened_centrist:0 "Постоянные согласительные комиссии"
 NWG_an_enlightened_centrist_desc:0 "Комиссии помогут разбирать местные и хозяйственные конфликты до того, как они парализуют работу правительства."
 NWG_anarchism:0 "Федерация свободных коммун"
 NWG_anarchism_desc:0 "Сторонники самоуправления предлагают строить общий порядок на соглашениях местных общин и трудовых объединений."
 NWG_armament_effort:0 "Военные заказы"
 NWG_armament_effort_desc:0 "Оружейное предприятие появится только в контролируемом национальном регионе со свободным строительным местом. В противном случае программа улучшит действующее производство."
 NWG_armament_effort_ii:0 "Расширение оборонных контрактов"
 NWG_armament_effort_ii_desc:0 "Временная программа строительства оружейных предприятий оплачивается дополнительными расходами на потребительские товары."
 NWG_armament_effort_iii:0 "Согласование оборонных заказов"
 NWG_armament_effort_iii_desc:0 "Промышленники и штаб сведут перечни заказов в один план. Для этого должны быть завершены обе подготовительные программы."
 NWG_armament_effort_iv:0 "Военно-промышленная комиссия"
 NWG_armament_effort_iv_desc:0 "Специалисты разберут опыт снабжения армии и подготовят очередную промышленную разработку."
 NWG_armament_effort_v:0 "Завершение оборонной программы"
 NWG_armament_effort_v_desc:0 "Доведём до конца начатые стройки и обеспечим новым заводам устойчивую загрузку."
 NWG_armor_effort:0 "Развёртывание бронетанковых войск"
 NWG_armor_effort_desc:0 "Опыт учебных частей позволит перейти к устойчивой организации бронетехники в составе армии."
 NWG_army_effort:0 "Проверка вооружённых сил"
 NWG_army_effort_desc:0 "Штаб оценит состояние частей и накопленный опыт, не связывая военную программу с политическим выбором."
 NWG_artillery__support_equipment_production:0 "Артиллерия и армейское имущество"
 NWG_artillery__support_equipment_production_desc:0 "Согласуем выпуск орудий, приборов, средств связи и прочего имущества, необходимого для оснащения частей."
 NWG_at_any_cost:0 "Военные нужды любой ценой"
 NWG_at_any_cost_desc:0 "Радикальное руководство потребует передавать оборонным ведомствам материалы и транспорт даже за счёт тяжёлого сокращения гражданского потребления."
 NWG_autarky:0 "Стратегическая хозяйственная самостоятельность"
 NWG_autarky_desc:0 "Определим материалы и производства, потеря которых особенно опасна для устойчивости государства."
 NWG_autonomy_reason:0 "Развитие местного государственного управления"
 NWG_aviation_effort:0 "Национальная авиационная комиссия"
 NWG_aviation_effort_desc:0 "ВВС начинают собственную программу независимо от армии и внутренней политики."
 NWG_aviation_effort_ii:0 "Единые стандарты авиации"
 NWG_aviation_effort_ii_desc:0 "После любой производственной линии будет введена годовая программа уменьшения аварийности."
 NWG_aviation_effort_iii:0 "Система подготовки ВВС"
 NWG_aviation_effort_iii_desc:0 "Опыт двух специализаций позволит открыть отдельные платные курсы подготовки лётчиков."
 NWG_bicycle_effort:0 "Подвижность пехоты"
 NWG_bicycle_effort_desc:0 "Пересмотрим способы перевозки имущества и организацию марша, доступные обычному пехотному подразделению."
 NWG_bomber_focus:0 "Бомбардировочная авиация"
 NWG_bomber_focus_desc:0 "Комиссия поддержит одно исследование средней авиации для ударных задач."
 NWG_bomber_produtction:0 "Подготовка бомбардировочных частей"
 NWG_bomber_produtction_desc:0 "Комиссия согласует обучение экипажей и обслуживание машин, временно уменьшая аварийность."
 NWG_build_up_personal_wealth:0 "Совет промышленных объединений"
 NWG_build_up_personal_wealth_desc:0 "Крупные предприятия получат постоянное представительство при кабинете и возможность согласовывать долгосрочные проекты."
 NWG_capital_ship_effort:0 "Крупные артиллерийские корабли"
 NWG_capital_ship_effort_desc:0 "Средства выделяются на исследование линейных кораблей; готовый корабль не создаётся."
 NWG_cas_effort:0 "Штурмовая авиация"
 NWG_cas_effort_desc:0 "Следующая разработка самолётов непосредственной поддержки получит исследовательский бонус."
 NWG_centrism_gang:0 "Устойчивый порядок исполнения"
 NWG_centrism_gang_desc:0 "Выбранную административную программу закрепят в постоянной работе ведомств и местных учреждений."
 NWG_citizen_suppresion:0 "Чрезвычайное управление"
 NWG_citizen_suppresion_desc:0 "Кабинет установит особый порядок принятия решений и контроля исполнения государственных распоряжений."
 NWG_civilian_factory_focus:0 "Производство гражданского оборудования"
 NWG_civilian_factory_focus_desc:0 "Хозяйство должно выпускать станки, инструмент и материалы, необходимые для собственного роста."
 NWG_civilian_industry:0 "Приоритет гражданского хозяйства"
 NWG_civilian_industry_desc:0 "Кабинет направит часть новых средств на предприятия, производящие оборудование и товары мирного назначения."
 NWG_civilise_the_lesser_nations:0 "Имперская цивилизаторская миссия"
 NWG_civilise_the_lesser_nations_desc:0 "Сторонники державной программы оправдывают расширение зарубежного влияния распространением своих порядков, школ и административных учреждений."
 NWG_claim_foreign_lands_i:0 "Сверка пограничных договоров"
 NWG_claim_foreign_lands_i_desc:0 "Соберём карты, соглашения и материалы комиссий, необходимые для защиты признанных национальных прав."
 NWG_claim_foreign_lands_ii:0 "Комиссия по спорным территориям"
 NWG_claim_foreign_lands_ii_desc:0 "Пограничные вопросы требуют тщательного разбора документов, а не поспешных обещаний на митингах."
 NWG_claim_foreign_lands_iii:0 "Дипломатическое представление претензий"
 NWG_claim_foreign_lands_iii_desc:0 "Правительство изложит свою позицию по нерешённым спорам и подготовит её обсуждение с соседями."
 NWG_class_struggle:0 "Классовая борьба"
 NWG_class_struggle_desc:0 "Синдикалисты намерены открыто противостоять влиянию собственников и передать производственным организациям решающее слово на предприятиях."
 NWG_collectivist_ethos:0 "Общие обязанности"
 NWG_collectivist_ethos_desc:0 "Ведомства и общественные организации согласуют работу на случай чрезвычайного положения. Программа не меняет правящую партию."
 NWG_collectivization_of_agriculture:0 "Коллективизация сельского хозяйства"
 NWG_collectivization_of_agriculture_desc:0 "Государство объединит хозяйства и будет направлять обработку земли, закупку техники и сдачу сельскохозяйственной продукции."
 NWG_complacent_subjects:0 "Соглашение о местной обороне"
 NWG_complacent_subjects_desc:0 "Распределение военных обязанностей должно быть закреплено заранее, а не выясняться после объявления тревоги."
 NWG_concessions_to_the_aristocracy:0 "Привилегии земельной знати"
 NWG_concessions_to_the_aristocracy_desc:0 "Корона обменяет поддержку влиятельных землевладельцев на сохранение их особых прав в местном управлении."
 NWG_conservatism:0 "Преемственность управления"
 NWG_conservatism_desc:0 "Кабинет укрепит существующие учреждения, уточнив порядок их работы вместо очередной полной реорганизации."
 NWG_construction_effort:0 "Гражданские строительные подрядчики"
 NWG_construction_effort_desc:0 "Подрядчики получат заказ на новую фабрику при наличии подходящего региона и свободного места. При невозможности стройки будут согласованы действующие мощности."
 NWG_construction_effort_ii:0 "Гражданская подрядная сеть"
 NWG_construction_effort_ii_desc:0 "На ограниченный срок предприятия и подрядчики согласуют поставки для гражданского строительства."
 NWG_construction_effort_iii:0 "Строительная стандартизация"
 NWG_construction_effort_iii_desc:0 "Типовые проекты и единые нормы облегчат освоение новых строительных технологий."
 NWG_cruiser_effort:0 "Программа крейсеров"
 NWG_cruiser_effort_desc:0 "Проектные бюро получат поддержку следующей крейсерской разработки."
 NWG_defence_of_the_nation:0 "Оборона страны"
 NWG_defence_of_the_nation_desc:0 "Заранее определим рубежи развёртывания, важнейшие переправы и порядок прикрытия городов."
 NWG_define_war_crimes:0 "Особый порядок военного управления"
 NWG_define_war_crimes_desc:0 "Радикальное руководство потребует сосредоточить полномочия и подчинить ведомственную работу задачам своей оборонной программы."
 NWG_democratic_focus:0 "Гражданские учреждения"
 NWG_democratic_focus_desc:0 "Предсказуемые процедуры и доступные приёмные помогают разрешать споры до того, как они превращаются в политический кризис."
 NWG_deploy_infantry:0 "Согласование резервных частей"
 NWG_deploy_infantry_desc:0 "Армия получит опыт и временную логистическую поддержку. Личный состав и готовые дивизии не создаются."
 NWG_destroyer_effort:0 "Эскортные корабли"
 NWG_destroyer_effort_desc:0 "Исследовательская программа будет посвящена эсминцам и кораблям сопровождения."
 NWG_deterrence:0 "Оборона как средство сдерживания"
 NWG_deterrence_desc:0 "Потенциальный противник должен видеть, что нападение встретит подготовленную и устойчивую оборону."
 NWG_devotion_to_the_state:0 "Присяга государственной службе"
 NWG_devotion_to_the_state_desc:0 "Администрация установит общие требования к дисциплине, подготовке и ответственности служащих."
 NWG_dismantle_the_constitution:0 "Пересмотр основного закона"
 NWG_dismantle_the_constitution_desc:0 "Сторонники сильной власти считают существующий порядок препятствием для своей программы преобразований."
 NWG_divine_rulership:0 "Верховенство короны"
 NWG_divine_rulership_desc:0 "Монархисты закрепят за верховной властью решающее место в назначениях, законодательстве и определении государственного курса."
 NWG_doctrine_effort:0 "Штабная подготовка"
 NWG_doctrine_effort_desc:0 "Офицеры разберут опыт соединений и накопят знания для дальнейшего выбора военной доктрины."
 NWG_doctrine_effort_ii:0 "Учения кадровых соединений"
 NWG_doctrine_effort_ii_desc:0 "Командиры проведут следующий цикл штабных занятий для подготовки новой организации армии."
 NWG_doctrine_effort_iii:0 "Учения соединений"
 NWG_doctrine_effort_iii_desc:0 "Полевые занятия крупных частей проверят устойчивость снабжения, связи и работы штабов."
 NWG_economy_for_the_army:0 "Хозяйство национальной мобилизации"
 NWG_economy_for_the_army_desc:0 "Промышленные планы будут теснее связаны с подготовкой вооружённых сил и развитием военной инфраструктуры."
 NWG_embrace_tarrifs:0 "Умеренная таможенная защита"
 NWG_embrace_tarrifs_desc:0 "Таможенные сборы должны поддерживать местных производителей, не лишая хозяйство необходимых материалов и оборудования."
 NWG_empower_the_military:0 "Полномочия военного кабинета"
 NWG_empower_the_military_desc:0 "Командование будет напрямую участвовать в исполнении государственных программ и распределении средств на оборону."
 NWG_empower_trade_untions:0 "Представительство профессиональных союзов"
 NWG_empower_trade_untions_desc:0 "Профсоюзы будут постоянно участвовать в обсуждении производственных планов и условий труда."
 NWG_end_elections:0 "Назначаемая исполнительная власть"
 NWG_end_elections_desc:0 "Кабинет предложит заменить часть выборных процедур системой назначений и ведомственной ответственности."
 NWG_enforce_loyalty:0 "Партийное управление учреждениями"
 NWG_enforce_loyalty_desc:0 "Правящая партия потребует согласовать работу администрации с принятой политической и хозяйственной программой."
 NWG_equipment_effort:0 "Стандартизация стрелкового оружия"
 NWG_equipment_effort_desc:0 "Общие требования позволят быстрее закончить одну разработку пехотного вооружения."
 NWG_equipment_effort_ii:0 "Обновление пехотного вооружения"
 NWG_equipment_effort_ii_desc:0 "Военно-техническая комиссия поддержит ещё одну разработку стрелковых систем."
 NWG_equipment_effort_iii:0 "Долгосрочная программа вооружений"
 NWG_equipment_effort_iii_desc:0 "Два следующих пехотных исследования получат поддержку в рамках единого технического плана."
 NWG_equipment_facotires:0 "Заводы армейского снаряжения"
 NWG_equipment_facotires_2:0 "Расширение производства снаряжения"
 NWG_equipment_facotires_2_desc:0 "Новые мощности позволят выпускать больше вспомогательного имущества и специальных средств для армии."
 NWG_equipment_facotires_desc:0 "Дополнительные производственные линии обеспечат выпуск имущества, которое редко заметно на парадах, но постоянно требуется войскам."
 NWG_espionage_agency_developments:0 "Организация специальных служб"
 NWG_espionage_agency_developments_desc:0 "С La Résistance создаётся агентство, если его ещё нет. Без этого DLC учреждения займутся ограниченным исследованием связи."
 NWG_even_more_usefull:0 "Местный военный бюджет"
 NWG_even_more_usefull_desc:0 "Автономное правительство примет устойчивые обязательства по содержанию своей оборонной службы."
 NWG_expand_counter_intelligence:0 "Защищённая служебная связь"
 NWG_expand_counter_intelligence_desc:0 "Единые правила переписки повышают стойкость шифрования. Фиктивные оперативники не создаются."
 NWG_expand_decryption_capabilities:0 "Радиоаналитические группы"
 NWG_expand_decryption_capabilities_desc:0 "Подготовленные аналитики увеличат возможности расшифровки перехваченных сообщений."
 NWG_expand_operative_capacity_i:0 "Региональные отделения разведки"
 NWG_expand_operative_capacity_i_desc:0 "При действующем агентстве учебная программа временно ускоряет организационные улучшения. Без агентств применяется небольшой бонус к электронике."
 NWG_expand_operative_capacity_ii:0 "Подготовка кадров специальных служб"
 NWG_expand_operative_capacity_ii_desc:0 "Следующий учебный курс поддержит организационные улучшения агентства; без соответствующего DLC действует исследовательская альтернатива."
 NWG_expand_operative_capacity_iii:0 "Международная сеть"
 NWG_expand_operative_capacity_iii_desc:0 "При поддержке агентств появляется один дополнительный слот оперативника. Без La Résistance применяется исследовательская программа электроники."
 NWG_expand_state_holdings:0 "Расширение государственного хозяйства"
 NWG_expand_state_holdings_desc:0 "Казна примет дополнительные обязательства по управлению предприятиями, необходимыми для исполнения государственной программы."
 NWG_exploit_citizens:0 "Договор государства и деловых кругов"
 NWG_exploit_citizens_desc:0 "Кабинет рассчитывает получить устойчивые поставки и инвестиции в обмен на понятные условия государственных заказов."
 NWG_export_goods:0 "Выход на внешние рынки"
 NWG_export_goods_desc:0 "Поддержим предприятия, способные продавать готовую продукцию и расширять круг хозяйственных связей страны."
 NWG_extra_research_slot:0 "Политехнические учреждения"
 NWG_extra_research_slot_desc:0 "Страна получит дополнительную ячейку, если их меньше четырёх. При уже развитой исследовательской системе средства ускорят две промышленные разработки."
 NWG_extra_research_slot_ii:0 "Электротехнические лаборатории"
 NWG_extra_research_slot_ii_desc:0 "Лаборатории займутся двумя разработками в области электроники. Новая исследовательская ячейка этой программой не создаётся."
 NWG_family_values:0 "Семья и местное общество"
 NWG_family_values_desc:0 "Консерваторы предлагают укреплять школы, благотворительные общества и привычные формы местной взаимопомощи."
 NWG_fascism:0 "Движение национальной мобилизации"
 NWG_fascism_desc:0 "Радикальные националисты требуют единого руководства, массовой организации и подчинения общественной жизни своей программе."
 NWG_fighter_focus:0 "Истребительная авиация"
 NWG_fighter_focus_desc:0 "Средства направят на одно исследование лёгкой авиации. Остальные направления остаются отдельными техническими задачами."
 NWG_fighter_production:0 "Подготовка истребительных частей"
 NWG_fighter_production_desc:0 "Курсы и технические инструкции временно уменьшат аварийность и дадут авиационный опыт."
 NWG_firearm_factories:0 "Оружейные мастерские"
 NWG_firearm_factories_desc:0 "Новые производственные линии позволят увеличить выпуск стрелкового вооружения внутри страны."
 NWG_firearm_production:0 "Технология стрелкового производства"
 NWG_firearm_production_desc:0 "Оружейные инженеры получат отдельную программу исследований пехотного вооружения."
 NWG_flexible_navy:0 "Прибрежные морские силы"
 NWG_flexible_navy_desc:0 "Небольшой флот получит налаженную координацию и снабжение вместо дорогостоящей программы развития крупных соединений."
 NWG_for_the_empire:0 "Служба державных обязательств"
 NWG_for_the_empire_desc:0 "Военные и гражданские учреждения согласуют исполнение принятых внешних обязательств с возможностями страны."
 NWG_for_the_king:0 "Правительство при короне"
 NWG_for_the_king_desc:0 "Министры будут проводить согласованную программу под верховной ответственностью монарха."
 NWG_foreign_conscription:0 "Подготовка территориального резерва"
 NWG_foreign_conscription_desc:0 "Уточним порядок обучения и службы резервистов в отдалённых районах, не меняя их государственного подчинения."
 NWG_freedom_without_democracy:0 "Патерналистское общественное соглашение"
 NWG_freedom_without_democracy_desc:0 "Правительство обещает защиту привычного уклада в обмен на отказ от борьбы за устройство верховной власти."
 NWG_fund_partisans:0 "Работа с приграничными связями"
 NWG_fund_partisans_desc:0 "Личные знакомства и местные общества могут дать сведения, которые недоступны официальным представительствам."
 NWG_gain_autonomy:0 "Согласование местных полномочий"
 NWG_gain_autonomy_desc:0 "Предложение о хозяйственном сотрудничестве направляется метрополии. Изменение особого автономного статуса этим фокусом не предусмотрено."
 NWG_grand_army:0 "Главное военное управление"
 NWG_grand_army_desc:0 "Штабы получат общий порядок планирования, подготовки резервов и распределения средств."
 NWG_guide_industries:0 "Направление промышленных вложений"
 NWG_guide_industries_desc:0 "Кабинет установит первоочередные отрасли, от которых зависит выполнение державной программы."
 NWG_holy_warriors:0 "Религиозные общества государственной службы"
 NWG_holy_warriors_desc:0 "Учебные и благотворительные организации примут участие в подготовке людей к выполнению общественных обязанностей."
 NWG_holy_wars:0 "Внешние связи религиозного правительства"
 NWG_holy_wars_desc:0 "Религиозные и дипломатические учреждения согласуют поддержку обществ, с которыми новое правительство связывает свои интересы."
 NWG_hyperconservative_populism:0 "Патерналистский порядок"
 NWG_hyperconservative_populism_desc:0 "Влиятельные общественные организации предлагают правительству опираться на привычную иерархию и защиту местных интересов."
 NWG_i_just_wanna_grill:0 "Повседневные нужды страны"
 NWG_i_just_wanna_grill_desc:0 "Умеренное правительство сделает своей опорой исправную работу учреждений и ощутимое улучшение обычной жизни."
 NWG_ideological_fanaticism:0 "Закрепить новое устройство"
 NWG_ideological_fanaticism_desc:0 "Учреждениям предстоит превратить политическую программу в устойчивый порядок повседневной работы."
 NWG_immediate_conscription:0 "Проверка мобилизационных списков"
 NWG_immediate_conscription_desc:0 "Военное ведомство должно знать, кого можно призвать и сколько времени займёт сбор частей."
 NWG_imperial_army:0 "Армия державной политики"
 NWG_imperial_army_desc:0 "Командование подготовит организацию войск к задачам, которые правительство связывает с расширением своего влияния."
 NWG_improve_quality_of_mechanized:0 "Надёжность механизированных частей"
 NWG_improve_quality_of_mechanized_desc:0 "Испытания техники и обучение ремонтных подразделений должны уменьшить простои соединений в походе."
 NWG_improve_quality_of_motorized:0 "Надёжность автотранспорта"
 NWG_improve_quality_of_motorized_desc:0 "Испытания и заводская обратная связь сократят число поломок и упростят обслуживание армейских машин."
 NWG_increase_research_funding:0 "Долгосрочные научные заказы"
 NWG_increase_research_funding_desc:0 "Устойчивое финансирование позволит коллективам заниматься сложными задачами, не прерывая работу после каждого бюджетного спора."
 NWG_individualist_ethos:0 "Самостоятельность учреждений"
 NWG_individualist_ethos_desc:0 "Местным учреждениям предоставят ясные правила и пространство для повседневных решений. Государственный строй сохраняется."
 NWG_indoctrination:0 "Политическое воспитание"
 NWG_indoctrination_desc:0 "Учебные общества превратятся в постоянный инструмент распространения программы движения среди рабочих и сельского населения."
 NWG_industrial_effort:0 "Промышленная ревизия"
 NWG_industrial_effort_desc:0 "Инженеры изучат действующие предприятия и определят, какие технологии принесут хозяйству наибольшую пользу."
 NWG_industrial_superpower:0 "Координация крупной промышленности"
 NWG_industrial_superpower_desc:0 "Свяжем государственные заказы, транспортные планы и расширение важнейших предприятий."
 NWG_infrastructure_effort:0 "Региональные дороги"
 NWG_infrastructure_effort_desc:0 "Один подходящий контролируемый национальный регион получит инфраструктуру. Если расширять дороги уже негде, средства поддержат организацию перевозок."
 NWG_infrastructure_effort_ii:0 "Узлы внутреннего сообщения"
 NWG_infrastructure_effort_ii_desc:0 "Увеличим пропускную способность станций и дорог, связывающих важнейшие хозяйственные районы."
 NWG_intensify_exctraction:0 "Упорядочение добывающей отрасли"
 NWG_intensify_exctraction_desc:0 "Согласуем разведку, разработку месторождений и транспортировку сырья до потребителей."
 NWG_internationalism:0 "Международная солидарность труда"
 NWG_internationalism_desc:0 "Рабочие организации рассчитывают поддерживать связи поверх государственных границ, не полагаясь на несуществующий в этом мире Коминтерн."
 NWG_interventionism_focus:0 "Ограниченное внешнее участие"
 NWG_interventionism_focus_desc:0 "Правительство намерено поддерживать своё влияние дипломатическими и военными средствами там, где считает это оправданным."
 NWG_kleptocratic_corporatism:0 "Корпоративный режим"
 NWG_kleptocratic_corporatism_desc:0 "Крупные деловые объединения намерены получить постоянное участие в управлении хозяйством и распределении государственных заказов."
 NWG_large_navy:0 "Программа крупных соединений"
 NWG_large_navy_desc:0 "При наличии хотя бы двух верфей штаб сможет выбрать приоритет согласованных действий крупных сил. Прибрежная модель станет недоступна."
 NWG_leftwing_politics:0 "Рабочее и социалистическое движение"
 NWG_leftwing_politics_desc:0 "Профсоюзы, кооперативы и социалистические партии ищут общую основу для участия в управлении страной."
 NWG_liberalism:0 "Либеральная коалиция"
 NWG_liberalism_desc:0 "Сторонники гражданских свобод и открытого рынка подготовят общую правительственную программу."
 NWG_lore_autonomy:0 "Местные обязательства и метрополия"
 NWG_lore_autonomy_desc:0 "Субъект сможет развивать специальную хозяйственную программу в соответствии со своим действительным положением."
 NWG_lore_civil_service:0 "Постоянная внешняя служба"
 NWG_lore_civil_service_desc:0 "Накопленные договорные процедуры закрепляются в повседневной работе ведомств."
 NWG_lore_colonial_admin:0 "Местная колониальная администрация"
 NWG_lore_colonial_admin_desc:0 "Германская колониальная администрация подготовит хозяйственную программу, сохраняя действующее подчинение Берлину."
 NWG_lore_colonial_budget:0 "Программа колониального бюджета"
 NWG_lore_colonial_budget_desc:0 "Берлину будет предложен оплачиваемый хозяйственный проект. Автоматического повышения автономии и выдачи независимости нет."
 NWG_lore_colonial_transport:0 "Колониальные перевозки"
 NWG_lore_colonial_transport_desc:0 "В подходящем собственном национальном регионе расширяется инфраструктура. Если такой цели нет, применяется временная организационная поддержка снабжения."
 NWG_lore_conference:0 "Региональные совещания"
 NWG_lore_conference_desc:0 "Открывается платное предложение соседу о совместной логистической программе. Военные блоки и границы не меняются."
 NWG_lore_crown_diet:0 "Согласование местного бюджета"
 NWG_lore_crown_diet_desc:0 "Представительное учреждение согласует исполнение хозяйственных обязательств своей короны."
 NWG_lore_crowns_settlement:0 "Договорённость о местной программе"
 NWG_lore_crowns_settlement_desc:0 "Федеральному центру будет предложено поддержать временную хозяйственную программу. Согласие короны не означает выхода из федерации."
 NWG_lore_customs:0 "Согласование торговых правил"
 NWG_lore_customs_desc:0 "Промышленное исследование поможет учреждениям и предприятиям приспособиться к согласованным правилам торговли."
 NWG_lore_diet:0 "Работа местных учреждений"
 NWG_lore_diet_desc:0 "Доминион согласует текущую работу своего представительного учреждения и исполнительных ведомств."
 NWG_lore_diplomacy:0 "Внешние хозяйственные связи"
 NWG_lore_diplomacy_desc:0 "Представители государства подготовят рабочие контакты без универсальных требований чужих земель и военных союзов."
 NWG_lore_dominion:0 "Предложение доминиона"
 NWG_lore_dominion_agreement:0 "Согласованная программа доминиона"
 NWG_lore_dominion_agreement_desc:0 "Метрополии будет предложен очередной ограниченный хозяйственный проект. Политический статус и независимость не изменяются автоматически."
 NWG_lore_dominion_desc:0 "Польский или финляндский доминион предложит России местную программу. Принятие не меняет фиксированный тип автономии."
 NWG_lore_federal_crown:0 "Федеральные обязательства короны"
 NWG_lore_federal_crown_desc:0 "Внутренняя корона Габсбургской федерации уточнит работу местных органов в рамках существующего автономного устройства."
 NWG_lore_federal_rails:0 "Федеральное транспортное проектирование"
 NWG_lore_federal_rails_desc:0 "Местные инженеры подготовят следующую строительную технологию для общих транспортных задач."
 NWG_lore_imperial_market:0 "Общий хозяйственный рынок"
 NWG_lore_imperial_market_desc:0 "Промышленная исследовательская программа поддержит участие доминиона в хозяйственных связях империи."
 NWG_lore_language_service:0 "Согласованная служебная переписка"
 NWG_lore_language_service_desc:0 "Порядок работы ведомств уменьшит повседневные споры о полномочиях и исполнении распоряжений."
 NWG_lore_local_officers:0 "Местная подготовка офицеров"
 NWG_lore_local_officers_desc:0 "Военные учреждения доминиона получат опыт для дальнейшей подготовки своих частей."
 NWG_lore_local_schools:0 "Технические училища"
 NWG_lore_local_schools_desc:0 "Подготовка местных специалистов поддержит одно исследование электроники."
 NWG_lore_nonbloc:0 "Самостоятельные хозяйственные связи"
 NWG_lore_nonbloc_desc:0 "Независимое государство закрепит порядок внешних контактов, сохраняя действительные международные обязательства."
 NWG_lore_technical_exchange:0 "Обмен техническими специалистами"
 NWG_lore_technical_exchange_desc:0 "Открываются ежегодные предложения соседям о взаимной поддержке одного исследования электроники."
 NWG_lore_trade_missions:0 "Хозяйственные миссии"
 NWG_lore_trade_missions_desc:0 "Открываются ежегодные предложения соседям об ограниченных совместных заказах. Получатель отдельно принимает или отклоняет предложение."
 NWG_lore_treaties:0 "Договорная подготовка"
 NWG_lore_treaties_desc:0 "Дипломатическая служба подготовит порядок переговоров. Практические совещания открываются следующим профильным фокусом."
 NWG_lore_work_regulation:0 "Порядок местных работ"
 NWG_lore_work_regulation_desc:0 "Администрация согласует исполнение хозяйственных распоряжений и уменьшит неопределённость местных обязательств."
 NWG_major_power:0 "Расширить государственные возможности"
 NWG_major_power_desc:0 "Престиж зависит от способности выполнять принятые обязательства. Укрепим учреждения, отвечающие за крупные программы."
 NWG_man_of_the_people:0 "Опора на местные общества"
 NWG_man_of_the_people_desc:0 "Правительство укрепит связи с общинами, которые поддерживают его курс на порядок и хозяйственную защиту."
 NWG_mechanization_effort:0 "Механизация армейских частей"
 NWG_mechanization_effort_desc:0 "Изучим организацию соединений, способных перевозить людей и имущество вместе с бронетехникой."
 NWG_messenger_of_god:0 "Религиозное обоснование власти"
 NWG_messenger_of_god_desc:0 "Сторонники нового порядка намерены теснее связать авторитет государства с учением ведущих религиозных учреждений."
 NWG_metal_excavation:0 "Разведка металлических руд"
 NWG_metal_excavation_desc:0 "Геологи сосредоточатся на районах, способных обеспечить промышленность собственным металлом."
 NWG_militarism:0 "Готовность территориальных частей"
 NWG_militarism_desc:0 "Командование уточнит мобилизационные поручения и подготовит общество к оборонным обязанностям."
 NWG_militarized_schooling:0 "Военизированное воспитание"
 NWG_militarized_schooling_desc:0 "Школы и молодёжные организации должны воспитывать будущих призывников в духе дисциплины и безусловной верности движению."
 NWG_military_coup:0 "Военный кабинет"
 NWG_military_coup_desc:0 "Часть командования считает, что правительство должно опереться на армейскую дисциплину и прямую ответственность исполнителей."
 NWG_military_industrial_complex:0 "Единый производственный график"
 NWG_military_industrial_complex_desc:0 "На год вводится программа роста производственной эффективности. Результат отражает организацию предприятий, а не появление новых фабрик."
 NWG_military_industry_focus:0 "Стандарты военного производства"
 NWG_military_industry_focus_desc:0 "Единые технические требования позволят быстрее освоить следующую промышленную технологию."
 NWG_military_research:0 "Военно-техническая комиссия"
 NWG_military_research_desc:0 "Офицеры и инженеры подготовят исследовательское задание на новое пехотное вооружение."
 NWG_military_youth:0 "Подготовка резервистов"
 NWG_military_youth_desc:0 "Ограниченный учебный сезон укрепит организацию частей без создания бесплатных дивизий."
 NWG_misc_equipment_purchase:0 "Склад вспомогательного имущества"
 NWG_misc_equipment_purchase_desc:0 "Закупим средства связи, инструмент и полевое имущество для оснащения действующих частей."
 NWG_misc_political_actions:0 "Административные распоряжения"
 NWG_misc_political_actions_desc:0 "Новые инструкции подкрепляются бюджетом местных служб. После утверждения программы можно оплачивать конкретные мероприятия через решения."
 NWG_modern_serfdom:0 "Сословные повинности"
 NWG_modern_serfdom_desc:0 "Землевладельцы добиваются закрепления обязательных работ и платежей сельских общин в пользу своих хозяйств и местных учреждений."
 NWG_modernization_of_the_army:0 "Реформа генерального штаба"
 NWG_modernization_of_the_army_desc:0 "Новые технические требования к пехотному вооружению станут основой реорганизации армии и отдельных штабных учений."
 NWG_monarchism:0 "Программа верховной короны"
 NWG_monarchism_desc:0 "Монархисты требуют закрепить за короной решающее место в устройстве государства и согласовать с ней работу правительства."
 NWG_more_metals:0 "Разработка подтверждённых месторождений"
 NWG_more_metals_desc:0 "Промышленность получит более устойчивые поставки металла из уже разведанных районов."
 NWG_motorization_effort:0 "Моторизация частей"
 NWG_motorization_effort_desc:0 "Выделим транспорт и специалистов для соединений, которым требуется повышенная оперативная подвижность."
 NWG_national_supremacy:0 "Национальное превосходство"
 NWG_national_supremacy_desc:0 "Сторонники державного курса предлагают строить внутреннюю и внешнюю политику на особых правах господствующей нации."
 NWG_national_unity:0 "Общие государственные обязанности"
 NWG_national_unity_desc:0 "Гражданское согласие должно опираться на ясное распределение прав, обязанностей и ответственности учреждений."
 NWG_nationalisation:0 "Государственные хозяйственные общества"
 NWG_nationalisation_desc:0 "Правительство расширит участие в предприятиях, которые считает необходимыми для устойчивости страны."
 NWG_nationalism:0 "Национальное единство"
 NWG_nationalism_desc:0 "Национальные организации предлагают укреплять государство через общие гражданские обязанности и культурную политику."
 NWG_nationalize_foreign_assets:0 "Общественное участие в предприятиях"
 NWG_nationalize_foreign_assets_desc:0 "Организации работников потребуют закрепить контроль над решениями, определяющими судьбу крупных производств."
 NWG_natural_oil:0 "Разведка нефтеносных районов"
 NWG_natural_oil_desc:0 "Систематические изыскания помогут определить, где добыча топлива может быть экономически оправданной."
 NWG_nav_effort:0 "Морская авиация"
 NWG_nav_effort_desc:0 "Комиссия подготовит исследовательскую программу морских бомбардировщиков."
 NWG_naval_effort:0 "Морская комиссия"
 NWG_naval_effort_desc:0 "Программа доступна при наличии собственного контролируемого побережья. Армия и авиация не требуют её прохождения."
 NWG_naval_effort_ii:0 "Ремонтные и производственные графики"
 NWG_naval_effort_ii_desc:0 "После любой флотской специализации на год повышается выпуск верфей."
 NWG_naval_invasions:0 "Планирование морских операций"
 NWG_naval_invasions_desc:0 "Штабы разберут вопросы сопровождения и высадки, получив морской опыт для дальнейших преобразований."
 NWG_neoimperialism:0 "Программа державного восстановления"
 NWG_neoimperialism_desc:0 "Сторонники сильной державы связывают внутренние преобразования с восстановлением её международного влияния."
 NWG_neutrality_focus:0 "Политика вооружённого нейтралитета"
 NWG_neutrality_focus_desc:0 "Страна будет укреплять собственную безопасность, избегая обязательств, которые могут втянуть её в чужой конфликт."
 NWG_nuclear_arms_production:0 "Военные исследования атомной энергии"
 NWG_nuclear_arms_production_desc:0 "Изучим, могут ли результаты ядерной физики иметь военное применение, не подменяя исследования обещаниями готового оружия."
 NWG_nuclear_effort:0 "Ядерная исследовательская комиссия"
 NWG_nuclear_effort_desc:0 "Финансирование направляется на ядерное исследование. Готовое оружие и реакторы не выдаются."
 NWG_officer_training_schools:0 "Офицерские школы"
 NWG_officer_training_schools_desc:0 "Годовая учебная программа поддержит организацию армии и подготовит дальнейшие штабные занятия."
 NWG_one_faith:0 "Место веры в общественной жизни"
 NWG_one_faith_desc:0 "Религиозные учреждения и гражданская администрация определят порядок совместной работы в школах и местных обществах."
 NWG_open_borders:0 "Торговые и научные связи"
 NWG_open_borders_desc:0 "Обмен специалистами, товарами и знаниями укрепит хозяйство без обязательного участия в военных блоках."
 NWG_open_market:0 "Открытый внутренний рынок"
 NWG_open_market_desc:0 "Сократим лишние ограничения на торговлю и договоримся об общих правилах для предприятий разных провинций."
 NWG_paramilitarism:0 "Территориальная подготовка населения"
 NWG_paramilitarism_desc:0 "Учебные общества и местная администрация согласуют подготовку людей к защите своих районов."
 NWG_partisan_defence:0 "Защита тыловых коммуникаций"
 NWG_partisan_defence_desc:0 "Годовая логистическая программа и упорядоченная работа тыла укрепят устойчивость государства."
 NWG_partisanism:0 "Оборона местных районов"
 NWG_partisanism_desc:0 "Наладим связь и снабжение территориальных подразделений, а также их взаимодействие с регулярной армией."
 NWG_peace_through_war:0 "Помощь зарубежным рабочим организациям"
 NWG_peace_through_war_desc:0 "Движение направит средства на обмен опытом, обучение и поддержку единомышленников за границей."
 NWG_peasant_militias:0 "Крестьянские ополчения"
 NWG_peasant_militias_desc:0 "Движение создаст в сельских районах собственные кадры инструкторов и порядок подготовки территориальных вооружённых объединений."
 NWG_peoples_army:0 "Народная армия"
 NWG_peoples_army_desc:0 "Местные организации получат постоянные обязанности по подготовке людей, учёту оружия и защите своих общин."
 NWG_permanent_revolution:0 "Перманентная революция"
 NWG_permanent_revolution_desc:0 "Интернационалисты считают национальное правительство промежуточным этапом и намерены поддерживать революционные движения за границей без опоры на советский центр."
 NWG_planned_economy:0 "Государственный хозяйственный план"
 NWG_planned_economy_desc:0 "Сопоставим производственные возможности, потребности населения и задачи развития на ближайшие годы."
 NWG_police_state:0 "Полицейское государство"
 NWG_police_state_desc:0 "Военный кабинет расширит полномочия внутреннего надзора и поставит общественные организации под постоянный административный контроль."
 NWG_political_change:0 "Проверка государственных учреждений"
 NWG_political_change_desc:0 "Прежде чем расширять полномочия ведомств, правительство выяснит, кто отвечает за исполнение повседневных распоряжений."
 NWG_political_commissars:0 "Политические представители в учреждениях"
 NWG_political_commissars_desc:0 "Правящая партия направит уполномоченных для согласования ведомственной работы с общей программой."
 NWG_political_correctness:0 "Политическое единство движения"
 NWG_political_correctness_desc:0 "Международное течение потребует согласовать публичные выступления, партийную прессу и деятельность рабочих организаций."
 NWG_president_more_like_ceo:0 "Кабинет хозяйственных полномочных"
 NWG_president_more_like_ceo_desc:0 "Правительство оформит устойчивое участие крупных предприятий в управлении важнейшими хозяйственными программами."
 NWG_private_armies:0 "Военно-технические подрядчики"
 NWG_private_armies_desc:0 "Предприятия возьмут на себя дополнительные задачи обслуживания армии, не получая права самостоятельно вести государственную войну."
 NWG_private_military_companies:0 "Частные военные подрядчики"
 NWG_private_military_companies_desc:0 "Частным предприятиям поручат отдельные технические и транспортные задачи, сохранив ответственность за оборону у государства."
 NWG_privatize_industries:0 "Частные промышленные общества"
 NWG_privatize_industries_desc:0 "Передадим часть хозяйственных проектов предприятиям, готовым взять на себя расходы и обязательства по их выполнению."
 NWG_protect_our_borders_and_only_our_borders:0 "Собственная оборона прежде всего"
 NWG_protect_our_borders_and_only_our_borders_desc:0 "Правительство намерено сосредоточить средства на защите страны и избежать необеспеченных внешних обязательств."
 NWG_purchase_guns:0 "Резерв пехотного вооружения"
 NWG_purchase_guns_desc:0 "Создадим запас оружия для пополнения учебных и территориальных частей."
 NWG_purchase_motorized:0 "Автомобили для армии"
 NWG_purchase_motorized_desc:0 "Сформируем резерв грузовиков для перевозки снабжения и обслуживания военных учреждений."
 NWG_purchasing_equipment:0 "Программа закупок вооружения"
 NWG_purchasing_equipment_desc:0 "Изучим зарубежные образцы и условия поставок, не связывая армию обязательствами перед единственным продавцом."
 NWG_quality:0 "Профессиональная армия"
 NWG_quality_armor:0 "Слаженность бронетанковых частей"
 NWG_quality_armor_desc:0 "Командиры, экипажи и ремонтные подразделения будут готовиться вместе, чтобы слаженно действовать в походе и бою."
 NWG_quality_desc:0 "Кадровая модель улучшает организацию и накопление опыта ценой более долгой подготовки подразделений."
 NWG_quantity:0 "Территориальный резерв"
 NWG_quantity_desc:0 "Массовая модель ускоряет подготовку и призыв, но увеличивает расход снабжения. Профессиональный приоритет станет недоступен."
 NWG_quantity_of_armor:0 "Массовые бронетанковые соединения"
 NWG_quantity_of_armor_desc:0 "Упрощение снабжения и серийное производство помогут увеличивать число оснащённых бронетехникой частей."
 NWG_racial_laws:0 "Расовые законы"
 NWG_racial_laws_desc:0 "Радикальное движение намерено закрепить неравенство граждан по происхождению и поставить доступ к должностям под контроль своих организаций."
 NWG_rare_metals_excavation:0 "Легирующие материалы"
 NWG_rare_metals_excavation_desc:0 "Промышленности нужны не только большие объёмы металла, но и устойчивые поставки специальных добавок."
 NWG_reduce_mechanized_production_costs:0 "Серийная механизированная техника"
 NWG_reduce_mechanized_production_costs_desc:0 "Унификация деталей и планирование заказов помогут наладить устойчивый выпуск сложных армейских машин."
 NWG_reduce_motorized_production_costs:0 "Серийные армейские автомобили"
 NWG_reduce_motorized_production_costs_desc:0 "Унификация деталей и долговременные заказы позволят уменьшить потери времени при выпуске грузовиков."
 NWG_research_funding:0 "Фонд прикладных исследований"
 NWG_research_funding_desc:0 "Часть государственных заказов будет направлена на доведение перспективных разработок до практического применения."
 NWG_resource_excavation:0 "Обзор природных ресурсов"
 NWG_resource_excavation_desc:0 "Геологические и промышленные службы уточнят хозяйственные возможности страны. Программа помогает исследованиям и не создаёт месторождения из ничего."
 NWG_revanchism:0 "Новая опора исполнительной власти"
 NWG_revanchism_desc:0 "Сторонники решительного изменения порядка предлагают опереться на армию, церковь или верховную корону."
 NWG_rightwing_politics:0 "Национально-консервативный лагерь"
 NWG_rightwing_politics_desc:0 "Консерваторы и национальные организации согласуют программу сильной власти и хозяйственного развития."
 NWG_road_effort:0 "Дороги провинций"
 NWG_road_effort_desc:0 "Свяжем сельскохозяйственные и промышленные районы с ближайшими станциями и рынками."
 NWG_rocket_effort:0 "Ракетные исследования"
 NWG_rocket_effort_desc:0 "Исследовательские учреждения получат поддержку одного проекта ракетной техники."
 NWG_save_ethnic_minorities:0 "Соглашения с национальными общинами"
 NWG_save_ethnic_minorities_desc:0 "Местным обществам будут предложены ясные гарантии культурной жизни и участия в государственных учреждениях."
 NWG_secret_weapons:0 "Приборы специального назначения"
 NWG_secret_weapons_desc:0 "Инженеры подготовят одну разработку электронной аппаратуры для специальных задач."
 NWG_ship_production_en_masse:0 "Стандарты кораблестроения"
 NWG_ship_production_en_masse_desc:0 "Общие проекты и согласованные заказы помогут верфям сокращать простои и подготовительные расходы."
 NWG_socialism_in_one_country:0 "Социализм в собственной стране"
 NWG_socialism_in_one_country_desc:0 "Социалистическое правительство сосредоточит преобразования на национальном хозяйстве, не ожидая победы всемирной революции."
 NWG_socialist_science:0 "Наука государственного плана"
 NWG_socialist_science_desc:0 "Научные коллективы получат устойчивые задачи, связанные с долгосрочным хозяйственным развитием страны."
 NWG_special_forces:0 "Подготовка особых подразделений"
 NWG_special_forces_desc:0 "Горная местность, реки и труднодоступные районы требуют специального обучения и подходящего снаряжения."
 NWG_spread_freedom:0 "Дипломатия представительного правительства"
 NWG_spread_freedom_desc:0 "Дипломатические представители будут поддерживать связи с учреждениями, разделяющими принципы принятого государственного порядка."
 NWG_state_sponsored_crusades:0 "Корона и внешняя служба"
 NWG_state_sponsored_crusades_desc:0 "Представители монарха согласуют культурные, дипломатические и хозяйственные начинания за пределами страны."
 NWG_state_welfare:0 "Общественные службы"
 NWG_state_welfare_desc:0 "Дополнительное содержание служб требует средств, но позволяет выполнять принятые государством обязательства перед населением."
 NWG_submarine_effort:0 "Подводный флот"
 NWG_submarine_effort_desc:0 "Технические бюро поддержат одно исследование подводных лодок."
 NWG_successful_economy:0 "Завершение первого хозяйственного плана"
 NWG_successful_economy_desc:0 "Гражданское строительство и исследовательская программа теперь согласованы. Кабинет сможет готовить следующий этап развития."
 NWG_supreme_leader:0 "Ответственность главы правительства"
 NWG_supreme_leader_desc:0 "Определим полномочия руководителя кабинета и порядок согласования решений между министрами."
 NWG_syndicalism:0 "Синдикалистская программа"
 NWG_syndicalism_desc:0 "Профсоюзы требуют передать организованным работникам участие в управлении производством и распределением средств."
 NWG_synthetic_oil__rubber:0 "Синтетические материалы"
 NWG_synthetic_oil__rubber_desc:0 "Химические предприятия изучат способы получать нужные хозяйству материалы при ограниченных природных поставках."
 NWG_tank_deployment:0 "Учебная бронетанковая часть"
 NWG_tank_deployment_desc:0 "Подготовим командиров и технический состав для развёртывания бронетехники на собственной организационной основе."
 NWG_tank_purchase:0 "Испытательная партия бронемашин"
 NWG_tank_purchase_desc:0 "Небольшая партия техники позволит изучить обслуживание и применение бронечастей до крупных заказов."
 NWG_technology_sharing:0 "Международный обмен исследованиями"
 NWG_technology_sharing_desc:0 "Университетам и техническим обществам будет проще обмениваться публикациями и результатами испытаний."
 NWG_territorial_claims:0 "Защита договорных прав"
 NWG_territorial_claims_desc:0 "Соберём окончательные материалы по признанным национальным территориям, находящимся под чужим управлением."
 NWG_the_greatest_minds:0 "Совет научных обществ"
 NWG_the_greatest_minds_desc:0 "Объединим усилия университетов, лабораторий и частных исследовательских объединений."
 NWG_the_marines:0 "Подготовка морской пехоты"
 NWG_the_marines_desc:0 "Подготовка следующего исследования морской пехоты получит отдельный технологический бонус."
 NWG_the_most_loyal_subjects:0 "Постоянное представительство автономий"
 NWG_the_most_loyal_subjects_desc:0 "Представители зависимых территорий смогут обсуждать хозяйственные вопросы до того, как они станут политическими кризисами."
 NWG_the_road_to_war:0 "Подготовка к международному кризису"
 NWG_the_road_to_war_desc:0 "Дипломатические разногласия могут затронуть торговлю и безопасность. Проверим готовность ведомств к ухудшению обстановки."
 NWG_theocracy:0 "Религиозно-государственное соглашение"
 NWG_theocracy_desc:0 "Религиозные учреждения предлагают укрепить свою роль в образовании, общественной жизни и обосновании государственной власти."
 NWG_there_is_no_god_only_anarchism:0 "Союз самоуправляющихся общин"
 NWG_there_is_no_god_only_anarchism_desc:0 "Местные общества создадут постоянные органы согласования общих дел, сохранив самостоятельность повседневного управления."
 NWG_under_god:0 "Соглашение с религиозными учреждениями"
 NWG_under_god_desc:0 "Государство определит обязанности религиозных обществ и порядок их участия в образовании и благотворительности."
 NWG_volunteer_corps:0 "Кадры зарубежных военных миссий"
 NWG_volunteer_corps_desc:0 "Подготовленные специалисты смогут направляться за границу, если правительство отдельно примет решение о такой помощи."
 NWG_war_propoganda:0 "Разъяснить задачи обороны"
 NWG_war_propoganda_desc:0 "Обществу необходимо понимать, на что расходуются военные средства и какие угрозы считает серьёзными правительство."
 NWG_whats_a_head_of_state:0 "Съезды местного самоуправления"
 NWG_whats_a_head_of_state_desc:0 "Координацию общих дел возьмут на себя уполномоченные местных общин и трудовых объединений."
 NWG_why_we_fight:0 "Общественное согласие об обороне"
 NWG_why_we_fight_desc:0 "Обсудим пределы внешних обязательств и основания применения военной силы, чтобы избежать разрыва между кабинетом и обществом."
 NWG_workers_paradise:0 "Система рабочего самоуправления"
 NWG_workers_paradise_desc:0 "Производственные советы и профсоюзы закрепят свои обязанности по управлению предприятиями и обеспечению работников."
 NWG_workers_rights:0 "Трудовые соглашения"
 NWG_workers_rights_desc:0 "Представители предприятий и работников закрепят порядок оплаты, найма и разрешения производственных споров."
 NWG_world_police_force:0 "Подготовка международных миссий"
 NWG_world_police_force_desc:0 "Правительство создаст порядок организации зарубежных миссий без автоматического принятия военных обязательств."
 nwg_spirit_a_government_without_government:0 "Федеративное соглашение коммун"
 nwg_spirit_a_government_without_government_desc:0 "Общины определят постоянный порядок совместной работы, не передавая всю повседневную власть единому центру."
 nwg_spirit_a_grill_in_every_home:0 "Местные общественные службы"
 nwg_spirit_a_grill_in_every_home_desc:0 "Школы, санитарная помощь и исправные учреждения дадут умеренному правительству заметную опору в обществе."
 nwg_spirit_a_true_kakistocracy:0 "Правительство покровителей"
 nwg_spirit_a_true_kakistocracy_desc:0 "Влиятельные семьи и деловые круги предлагают кабинету поддержку в обмен на участие в распределении государственных заказов."
 nwg_spirit_abolish_all_ownership:0 "Отмена частной собственности"
 nwg_spirit_abolish_all_ownership_desc:0 "Общины и трудовые объединения предлагают передать частные хозяйственные владения в коллективное распоряжение."
 nwg_spirit_an_enlightened_centrist:0 "Постоянные согласительные комиссии"
 nwg_spirit_an_enlightened_centrist_desc:0 "Комиссии помогут разбирать местные и хозяйственные конфликты до того, как они парализуют работу правительства."
 nwg_spirit_anarchism:0 "Федерация свободных коммун"
 nwg_spirit_anarchism_desc:0 "Сторонники самоуправления предлагают строить общий порядок на соглашениях местных общин и трудовых объединений."
 nwg_spirit_at_any_cost:0 "Военные нужды любой ценой"
 nwg_spirit_at_any_cost_desc:0 "Радикальное руководство потребует передавать оборонным ведомствам материалы и транспорт даже за счёт тяжёлого сокращения гражданского потребления."
 nwg_spirit_autarky:0 "Стратегическая хозяйственная самостоятельность"
 nwg_spirit_autarky_desc:0 "Определим материалы и производства, потеря которых особенно опасна для устойчивости государства."
 nwg_spirit_bomber_produtction:0 "Серийное производство бомбардировщиков"
 nwg_spirit_bomber_produtction_desc:0 "Заводы получат согласованный заказ на машины и оборудование, прошедшие армейские испытания."
 nwg_spirit_build_up_personal_wealth:0 "Совет промышленных объединений"
 nwg_spirit_build_up_personal_wealth_desc:0 "Крупные предприятия получат постоянное представительство при кабинете и возможность согласовывать долгосрочные проекты."
 nwg_spirit_citizen_suppresion:0 "Чрезвычайное управление"
 nwg_spirit_citizen_suppresion_desc:0 "Кабинет установит особый порядок принятия решений и контроля исполнения государственных распоряжений."
 nwg_spirit_civilise_the_lesser_nations:0 "Имперская цивилизаторская миссия"
 nwg_spirit_civilise_the_lesser_nations_desc:0 "Сторонники державной программы оправдывают расширение зарубежного влияния распространением своих порядков, школ и административных учреждений."
 nwg_spirit_class_struggle:0 "Классовая борьба"
 nwg_spirit_class_struggle_desc:0 "Синдикалисты намерены открыто противостоять влиянию собственников и передать производственным организациям решающее слово на предприятиях."
 nwg_spirit_collectivization_of_agriculture:0 "Коллективизация сельского хозяйства"
 nwg_spirit_collectivization_of_agriculture_desc:0 "Государство объединит хозяйства и будет направлять обработку земли, закупку техники и сдачу сельскохозяйственной продукции."
 nwg_spirit_concessions_to_the_aristocracy:0 "Привилегии земельной знати"
 nwg_spirit_concessions_to_the_aristocracy_desc:0 "Корона обменяет поддержку влиятельных землевладельцев на сохранение их особых прав в местном управлении."
 nwg_spirit_conservatism:0 "Конституционные консерваторы"
 nwg_spirit_conservatism_desc:0 "Консервативные партии готовы защищать традиционные учреждения в рамках представительного порядка."
 nwg_spirit_defence_of_the_nation:0 "Оборона страны"
 nwg_spirit_defence_of_the_nation_desc:0 "Заранее определим рубежи развёртывания, важнейшие переправы и порядок прикрытия городов."
 nwg_spirit_define_war_crimes:0 "Особый порядок военного управления"
 nwg_spirit_define_war_crimes_desc:0 "Радикальное руководство потребует сосредоточить полномочия и подчинить ведомственную работу задачам своей оборонной программы."
 nwg_spirit_deterrence:0 "Оборона как средство сдерживания"
 nwg_spirit_deterrence_desc:0 "Потенциальный противник должен видеть, что нападение встретит подготовленную и устойчивую оборону."
 nwg_spirit_devotion_to_the_state:0 "Присяга государственной службе"
 nwg_spirit_devotion_to_the_state_desc:0 "Администрация установит общие требования к дисциплине, подготовке и ответственности служащих."
 nwg_spirit_divine_rulership:0 "Верховенство короны"
 nwg_spirit_divine_rulership_desc:0 "Монархисты закрепят за верховной властью решающее место в назначениях, законодательстве и определении государственного курса."
 nwg_spirit_economy_for_the_army:0 "Хозяйство национальной мобилизации"
 nwg_spirit_economy_for_the_army_desc:0 "Промышленные планы будут теснее связаны с подготовкой вооружённых сил и развитием военной инфраструктуры."
 nwg_spirit_embrace_tarrifs:0 "Умеренная таможенная защита"
 nwg_spirit_embrace_tarrifs_desc:0 "Таможенные сборы должны поддерживать местных производителей, не лишая хозяйство необходимых материалов и оборудования."
 nwg_spirit_empower_the_military:0 "Полномочия военного кабинета"
 nwg_spirit_empower_the_military_desc:0 "Командование будет напрямую участвовать в исполнении государственных программ и распределении средств на оборону."
 nwg_spirit_empower_trade_untions:0 "Представительство профессиональных союзов"
 nwg_spirit_empower_trade_untions_desc:0 "Профсоюзы будут постоянно участвовать в обсуждении производственных планов и условий труда."
 nwg_spirit_end_elections:0 "Назначаемая исполнительная власть"
 nwg_spirit_end_elections_desc:0 "Кабинет предложит заменить часть выборных процедур системой назначений и ведомственной ответственности."
 nwg_spirit_enforce_loyalty:0 "Партийное управление учреждениями"
 nwg_spirit_enforce_loyalty_desc:0 "Правящая партия потребует согласовать работу администрации с принятой политической и хозяйственной программой."
 nwg_spirit_espionage_agency_developments:0 "Служба политической информации"
 nwg_spirit_espionage_agency_developments_desc:0 "Систематический сбор сведений позволит отличать реальные угрозы от слухов и придворных донесений."
 nwg_spirit_expand_counter_intelligence:0 "Контрразведывательная проверка"
 nwg_spirit_expand_counter_intelligence_desc:0 "Проверим порядок допуска к секретным материалам и защиту важных государственных учреждений."
 nwg_spirit_expand_decryption_capabilities:0 "Шифровальная служба"
 nwg_spirit_expand_decryption_capabilities_desc:0 "Специалисты по связи займутся защитой нашей переписки и изучением иностранных способов шифрования."
 nwg_spirit_expand_state_holdings:0 "Расширение государственного хозяйства"
 nwg_spirit_expand_state_holdings_desc:0 "Казна примет дополнительные обязательства по управлению предприятиями, необходимыми для исполнения государственной программы."
 nwg_spirit_exploit_citizens:0 "Договор государства и деловых кругов"
 nwg_spirit_exploit_citizens_desc:0 "Кабинет рассчитывает получить устойчивые поставки и инвестиции в обмен на понятные условия государственных заказов."
 nwg_spirit_export_goods:0 "Выход на внешние рынки"
 nwg_spirit_export_goods_desc:0 "Поддержим предприятия, способные продавать готовую продукцию и расширять круг хозяйственных связей страны."
 nwg_spirit_family_values:0 "Семья и местное общество"
 nwg_spirit_family_values_desc:0 "Консерваторы предлагают укреплять школы, благотворительные общества и привычные формы местной взаимопомощи."
 nwg_spirit_fascism:0 "Движение национальной мобилизации"
 nwg_spirit_fascism_desc:0 "Радикальные националисты требуют единого руководства, массовой организации и подчинения общественной жизни своей программе."
 nwg_spirit_fighter_production:0 "Серийный выпуск истребителей"
 nwg_spirit_fighter_production_desc:0 "Согласуем заводские нормы и армейскую приёмку, чтобы новые машины поступали в части без долгих задержек."
 nwg_spirit_firearm_production:0 "Стандарты оружейного производства"
 nwg_spirit_firearm_production_desc:0 "Единые допуски и правила приёмки уменьшат брак и упростят ремонт пехотного оружия."
 nwg_spirit_for_the_empire:0 "Служба державных обязательств"
 nwg_spirit_for_the_empire_desc:0 "Военные и гражданские учреждения согласуют исполнение принятых внешних обязательств с возможностями страны."
 nwg_spirit_for_the_king:0 "Правительство при короне"
 nwg_spirit_for_the_king_desc:0 "Министры будут проводить согласованную программу под верховной ответственностью монарха."
 nwg_spirit_freedom_without_democracy:0 "Патерналистское общественное соглашение"
 nwg_spirit_freedom_without_democracy_desc:0 "Правительство обещает защиту привычного уклада в обмен на отказ от борьбы за устройство верховной власти."
 nwg_spirit_grand_army:0 "Главное военное управление"
 nwg_spirit_grand_army_desc:0 "Штабы получат общий порядок планирования, подготовки резервов и распределения средств."
 nwg_spirit_guide_industries:0 "Направление промышленных вложений"
 nwg_spirit_guide_industries_desc:0 "Кабинет установит первоочередные отрасли, от которых зависит выполнение державной программы."
 nwg_spirit_holy_warriors:0 "Религиозные общества государственной службы"
 nwg_spirit_holy_warriors_desc:0 "Учебные и благотворительные организации примут участие в подготовке людей к выполнению общественных обязанностей."
 nwg_spirit_holy_wars:0 "Внешние связи религиозного правительства"
 nwg_spirit_holy_wars_desc:0 "Религиозные и дипломатические учреждения согласуют поддержку обществ, с которыми новое правительство связывает свои интересы."
 nwg_spirit_hyperconservative_populism:0 "Патерналистский порядок"
 nwg_spirit_hyperconservative_populism_desc:0 "Влиятельные общественные организации предлагают правительству опираться на привычную иерархию и защиту местных интересов."
 nwg_spirit_i_just_wanna_grill:0 "Повседневные нужды страны"
 nwg_spirit_i_just_wanna_grill_desc:0 "Умеренное правительство сделает своей опорой исправную работу учреждений и ощутимое улучшение обычной жизни."
 nwg_spirit_ideological_fanaticism:0 "Закрепить новое устройство"
 nwg_spirit_ideological_fanaticism_desc:0 "Учреждениям предстоит превратить политическую программу в устойчивый порядок повседневной работы."
 nwg_spirit_imperial_army:0 "Армия державной политики"
 nwg_spirit_imperial_army_desc:0 "Командование подготовит организацию войск к задачам, которые правительство связывает с расширением своего влияния."
 nwg_spirit_improve_quality_of_mechanized:0 "Надёжность механизированных частей"
 nwg_spirit_improve_quality_of_mechanized_desc:0 "Испытания техники и обучение ремонтных подразделений должны уменьшить простои соединений в походе."
 nwg_spirit_improve_quality_of_motorized:0 "Надёжность автотранспорта"
 nwg_spirit_improve_quality_of_motorized_desc:0 "Испытания и заводская обратная связь сократят число поломок и упростят обслуживание армейских машин."
 nwg_spirit_indoctrination:0 "Политическое воспитание"
 nwg_spirit_indoctrination_desc:0 "Учебные общества превратятся в постоянный инструмент распространения программы движения среди рабочих и сельского населения."
 nwg_spirit_industrial_superpower:0 "Координация крупной промышленности"
 nwg_spirit_industrial_superpower_desc:0 "Свяжем государственные заказы, транспортные планы и расширение важнейших предприятий."
 nwg_spirit_intensify_exctraction:0 "Упорядочение добывающей отрасли"
 nwg_spirit_intensify_exctraction_desc:0 "Согласуем разведку, разработку месторождений и транспортировку сырья до потребителей."
 nwg_spirit_internationalism:0 "Международная солидарность труда"
 nwg_spirit_internationalism_desc:0 "Рабочие организации рассчитывают поддерживать связи поверх государственных границ, не полагаясь на несуществующий в этом мире Коминтерн."
 nwg_spirit_kleptocratic_corporatism:0 "Корпоративный режим"
 nwg_spirit_kleptocratic_corporatism_desc:0 "Крупные деловые объединения намерены получить постоянное участие в управлении хозяйством и распределении государственных заказов."
 nwg_spirit_liberalism:0 "Либеральная коалиция"
 nwg_spirit_liberalism_desc:0 "Сторонники гражданских свобод и открытого рынка подготовят общую правительственную программу."
 nwg_spirit_man_of_the_people:0 "Опора на местные общества"
 nwg_spirit_man_of_the_people_desc:0 "Правительство укрепит связи с общинами, которые поддерживают его курс на порядок и хозяйственную защиту."
 nwg_spirit_messenger_of_god:0 "Религиозное обоснование власти"
 nwg_spirit_messenger_of_god_desc:0 "Сторонники нового порядка намерены теснее связать авторитет государства с учением ведущих религиозных учреждений."
 nwg_spirit_militarized_schooling:0 "Военизированное воспитание"
 nwg_spirit_militarized_schooling_desc:0 "Школы и молодёжные организации должны воспитывать будущих призывников в духе дисциплины и безусловной верности движению."
 nwg_spirit_military_coup:0 "Военный кабинет"
 nwg_spirit_military_coup_desc:0 "Часть командования считает, что правительство должно опереться на армейскую дисциплину и прямую ответственность исполнителей."
 nwg_spirit_military_industry_focus:0 "Управление оборонными предприятиями"
 nwg_spirit_military_industry_focus_desc:0 "Арсеналы и частные заводы получат согласованные планы поставок и общие правила отчётности."
 nwg_spirit_modern_serfdom:0 "Сословные повинности"
 nwg_spirit_modern_serfdom_desc:0 "Землевладельцы добиваются закрепления обязательных работ и платежей сельских общин в пользу своих хозяйств и местных учреждений."
 nwg_spirit_monarchism:0 "Программа верховной короны"
 nwg_spirit_monarchism_desc:0 "Монархисты требуют закрепить за короной решающее место в устройстве государства и согласовать с ней работу правительства."
 nwg_spirit_national_supremacy:0 "Национальное превосходство"
 nwg_spirit_national_supremacy_desc:0 "Сторонники державного курса предлагают строить внутреннюю и внешнюю политику на особых правах господствующей нации."
 nwg_spirit_national_unity:0 "Общие государственные обязанности"
 nwg_spirit_national_unity_desc:0 "Гражданское согласие должно опираться на ясное распределение прав, обязанностей и ответственности учреждений."
 nwg_spirit_nationalisation:0 "Государственные хозяйственные общества"
 nwg_spirit_nationalisation_desc:0 "Правительство расширит участие в предприятиях, которые считает необходимыми для устойчивости страны."
 nwg_spirit_nationalism:0 "Национальное единство"
 nwg_spirit_nationalism_desc:0 "Национальные организации предлагают укреплять государство через общие гражданские обязанности и культурную политику."
 nwg_spirit_nationalize_foreign_assets:0 "Общественное участие в предприятиях"
 nwg_spirit_nationalize_foreign_assets_desc:0 "Организации работников потребуют закрепить контроль над решениями, определяющими судьбу крупных производств."
 nwg_spirit_neoimperialism:0 "Программа державного восстановления"
 nwg_spirit_neoimperialism_desc:0 "Сторонники сильной державы связывают внутренние преобразования с восстановлением её международного влияния."
 nwg_spirit_neutrality_focus:0 "Политика вооружённого нейтралитета"
 nwg_spirit_neutrality_focus_desc:0 "Страна будет укреплять собственную безопасность, избегая обязательств, которые могут втянуть её в чужой конфликт."
 nwg_spirit_one_faith:0 "Место веры в общественной жизни"
 nwg_spirit_one_faith_desc:0 "Религиозные учреждения и гражданская администрация определят порядок совместной работы в школах и местных обществах."
 nwg_spirit_open_borders:0 "Торговые и научные связи"
 nwg_spirit_open_borders_desc:0 "Обмен специалистами, товарами и знаниями укрепит хозяйство без обязательного участия в военных блоках."
 nwg_spirit_open_market:0 "Открытый внутренний рынок"
 nwg_spirit_open_market_desc:0 "Сократим лишние ограничения на торговлю и договоримся об общих правилах для предприятий разных провинций."
 nwg_spirit_paramilitarism:0 "Территориальная подготовка населения"
 nwg_spirit_paramilitarism_desc:0 "Учебные общества и местная администрация согласуют подготовку людей к защите своих районов."
 nwg_spirit_partisan_defence:0 "Защита государственных сведений"
 nwg_spirit_partisan_defence_desc:0 "Уточним порядок хранения документов и взаимодействия гражданских ведомств с военной контрразведкой."
 nwg_spirit_partisanism:0 "Оборона местных районов"
 nwg_spirit_partisanism_desc:0 "Наладим связь и снабжение территориальных подразделений, а также их взаимодействие с регулярной армией."
 nwg_spirit_peace_through_war:0 "Помощь зарубежным рабочим организациям"
 nwg_spirit_peace_through_war_desc:0 "Движение направит средства на обмен опытом, обучение и поддержку единомышленников за границей."
 nwg_spirit_peasant_militias:0 "Крестьянские ополчения"
 nwg_spirit_peasant_militias_desc:0 "Движение создаст в сельских районах собственные кадры инструкторов и порядок подготовки территориальных вооружённых объединений."
 nwg_spirit_peoples_army:0 "Народная армия"
 nwg_spirit_peoples_army_desc:0 "Местные организации получат постоянные обязанности по подготовке людей, учёту оружия и защите своих общин."
 nwg_spirit_permanent_revolution:0 "Перманентная революция"
 nwg_spirit_permanent_revolution_desc:0 "Интернационалисты считают национальное правительство промежуточным этапом и намерены поддерживать революционные движения за границей без опоры на советский центр."
 nwg_spirit_planned_economy:0 "Государственный хозяйственный план"
 nwg_spirit_planned_economy_desc:0 "Сопоставим производственные возможности, потребности населения и задачи развития на ближайшие годы."
 nwg_spirit_police_state:0 "Полицейское государство"
 nwg_spirit_police_state_desc:0 "Военный кабинет расширит полномочия внутреннего надзора и поставит общественные организации под постоянный административный контроль."
 nwg_spirit_political_commissars:0 "Политические представители в учреждениях"
 nwg_spirit_political_commissars_desc:0 "Правящая партия направит уполномоченных для согласования ведомственной работы с общей программой."
 nwg_spirit_political_correctness:0 "Политическое единство движения"
 nwg_spirit_political_correctness_desc:0 "Международное течение потребует согласовать публичные выступления, партийную прессу и деятельность рабочих организаций."
 nwg_spirit_president_more_like_ceo:0 "Кабинет хозяйственных полномочных"
 nwg_spirit_president_more_like_ceo_desc:0 "Правительство оформит устойчивое участие крупных предприятий в управлении важнейшими хозяйственными программами."
 nwg_spirit_private_armies:0 "Военно-технические подрядчики"
 nwg_spirit_private_armies_desc:0 "Предприятия возьмут на себя дополнительные задачи обслуживания армии, не получая права самостоятельно вести государственную войну."
 nwg_spirit_private_military_companies:0 "Частные военные подрядчики"
 nwg_spirit_private_military_companies_desc:0 "Частным предприятиям поручат отдельные технические и транспортные задачи, сохранив ответственность за оборону у государства."
 nwg_spirit_privatize_industries:0 "Частные промышленные общества"
 nwg_spirit_privatize_industries_desc:0 "Передадим часть хозяйственных проектов предприятиям, готовым взять на себя расходы и обязательства по их выполнению."
 nwg_spirit_protect_our_borders_and_only_our_borders:0 "Собственная оборона прежде всего"
 nwg_spirit_protect_our_borders_and_only_our_borders_desc:0 "Правительство намерено сосредоточить средства на защите страны и избежать необеспеченных внешних обязательств."
 nwg_spirit_quality:0 "Профессиональная армия"
 nwg_spirit_quality_armor:0 "Слаженность бронетанковых частей"
 nwg_spirit_quality_armor_desc:0 "Командиры, экипажи и ремонтные подразделения будут готовиться вместе, чтобы слаженно действовать в походе и бою."
 nwg_spirit_quality_desc:0 "Сосредоточим средства на подготовке кадров, слаженности подразделений и сохранении опытных специалистов."
 nwg_spirit_quantity:0 "Массовая армия"
 nwg_spirit_quantity_desc:0 "Сделаем упор на доступное вооружение, устойчивое пополнение и подготовку многочисленного резерва."
 nwg_spirit_quantity_of_armor:0 "Массовые бронетанковые соединения"
 nwg_spirit_quantity_of_armor_desc:0 "Упрощение снабжения и серийное производство помогут увеличивать число оснащённых бронетехникой частей."
 nwg_spirit_racial_laws:0 "Расовые законы"
 nwg_spirit_racial_laws_desc:0 "Радикальное движение намерено закрепить неравенство граждан по происхождению и поставить доступ к должностям под контроль своих организаций."
 nwg_spirit_reduce_mechanized_production_costs:0 "Серийная механизированная техника"
 nwg_spirit_reduce_mechanized_production_costs_desc:0 "Унификация деталей и планирование заказов помогут наладить устойчивый выпуск сложных армейских машин."
 nwg_spirit_reduce_motorized_production_costs:0 "Серийные армейские автомобили"
 nwg_spirit_reduce_motorized_production_costs_desc:0 "Унификация деталей и долговременные заказы позволят уменьшить потери времени при выпуске грузовиков."
 nwg_spirit_save_ethnic_minorities:0 "Соглашения с национальными общинами"
 nwg_spirit_save_ethnic_minorities_desc:0 "Местным обществам будут предложены ясные гарантии культурной жизни и участия в государственных учреждениях."
 nwg_spirit_socialism_in_one_country:0 "Социализм в собственной стране"
 nwg_spirit_socialism_in_one_country_desc:0 "Социалистическое правительство сосредоточит преобразования на национальном хозяйстве, не ожидая победы всемирной революции."
 nwg_spirit_socialist_science:0 "Наука государственного плана"
 nwg_spirit_socialist_science_desc:0 "Научные коллективы получат устойчивые задачи, связанные с долгосрочным хозяйственным развитием страны."
 nwg_spirit_special_forces:0 "Подготовка особых подразделений"
 nwg_spirit_special_forces_desc:0 "Горная местность, реки и труднодоступные районы требуют специального обучения и подходящего снаряжения."
 nwg_spirit_state_sponsored_crusades:0 "Корона и внешняя служба"
 nwg_spirit_state_sponsored_crusades_desc:0 "Представители монарха согласуют культурные, дипломатические и хозяйственные начинания за пределами страны."
 nwg_spirit_state_welfare:0 "Гражданская социальная помощь"
 nwg_spirit_state_welfare_desc:0 "Общественные кассы и государственные учреждения согласуют помощь нуждающимся и поддержку городских служб."
 nwg_spirit_successful_economy:0 "Устойчивый хозяйственный рост"
 nwg_spirit_successful_economy_desc:0 "Завершённые предприятия и согласованные перевозки должны стать основой дальнейших вложений, а не разовой кампанией."
 nwg_spirit_syndicalism:0 "Синдикалистская программа"
 nwg_spirit_syndicalism_desc:0 "Профсоюзы требуют передать организованным работникам участие в управлении производством и распределением средств."
 nwg_spirit_the_greatest_minds:0 "Совет научных обществ"
 nwg_spirit_the_greatest_minds_desc:0 "Объединим усилия университетов, лабораторий и частных исследовательских объединений."
 nwg_spirit_theocracy:0 "Религиозно-государственное соглашение"
 nwg_spirit_theocracy_desc:0 "Религиозные учреждения предлагают укрепить свою роль в образовании, общественной жизни и обосновании государственной власти."
 nwg_spirit_there_is_no_god_only_anarchism:0 "Союз самоуправляющихся общин"
 nwg_spirit_there_is_no_god_only_anarchism_desc:0 "Местные общества создадут постоянные органы согласования общих дел, сохранив самостоятельность повседневного управления."
 nwg_spirit_under_god:0 "Соглашение с религиозными учреждениями"
 nwg_spirit_under_god_desc:0 "Государство определит обязанности религиозных обществ и порядок их участия в образовании и благотворительности."
 nwg_spirit_whats_a_head_of_state:0 "Съезды местного самоуправления"
 nwg_spirit_whats_a_head_of_state_desc:0 "Координацию общих дел возьмут на себя уполномоченные местных общин и трудовых объединений."
 nwg_spirit_workers_paradise:0 "Система рабочего самоуправления"
 nwg_spirit_workers_paradise_desc:0 "Производственные советы и профсоюзы закрепят свои обязанности по управлению предприятиями и обеспечению работников."
 nwg_spirit_workers_rights:0 "Трудовые соглашения"
 nwg_spirit_workers_rights_desc:0 "Представители предприятий и работников закрепят порядок оплаты, найма и разрешения производственных споров."
