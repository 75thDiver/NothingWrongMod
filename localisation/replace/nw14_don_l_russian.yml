l_russian:
 nw14_don_divided_dnr:0 "Расколотый Дон"
 nw14_don_divided_dnr_desc:0 "Вчерашние соседи стоят по разные стороны фронта. В каждой станице найдётся семья, у которой родня служит по ту сторону Дона. Силы уходят на борьбу за родную землю, а общий враг ждёт, пока казаки ослабят друг друга."
 nw14_don_divided_don:0 "Расколотый Дон"
 nw14_don_divided_don_desc:0 "Вчерашние соседи стоят по разные стороны фронта. В каждой станице найдётся семья, у которой родня служит по ту сторону Дона. Силы уходят на борьбу за родную землю, а общий враг ждёт, пока казаки ослабят друг друга."
 nw14_don_united:0 "Единый Дон"
 nw14_don_united_desc:0 "Дон больше не разделён фронтом. Пора сводить разбросанные полки, налаживать связь между станицами и снова выступать вместе. Старые счёты ещё помнят, но дорога впереди теперь одна."
