l_russian:
 nw_sov_unbroken_growth:0 "Двадцать лет промышленного роста"
 nw_sov_unbroken_growth_desc:0 "Заводы не эвакуировали, железные дороги не превращались в линию фронта, а французские займы продолжали поступать. Промышленный пояс империи вырос за пределы старых столиц. Но за высокими показателями остаются деревня, дешёвый труд и огромные расстояния."
 nw_sov_court_government:0 "Правительство придворных"
 nw_sov_court_government_desc:0 "До министерского кресла иногда ближе через дворцовую приёмную, чем через Государственную думу. Двор умеет защищать самодержавие от оппозиции, но смена покровителя способна перечеркнуть несколько лет работы целого ведомства."
 nw_sov_fragile_sovereign:0 "Хрупкий самодержец"
 nw_sov_fragile_sovereign_desc:0 "Алексей II унаследовал державу, в которой всякое важное решение ждёт государевой подписи. Приступ болезни или затянувшаяся аудиенция становятся государственным делом. Пока молодой император ищет собственную опору, за право говорить от его имени спорят министры и придворные."
 nw_sov_restless_borderlands:0 "Империя многих народов"
 nw_sov_restless_borderlands_desc:0 "Польский компромисс, финляндские права, кавказские гарнизоны и среднеазиатские походы держатся на разных основаниях. Петербург может собрать огромную армию, но общая верность престолу ещё не означает согласия с его чиновниками."
 nw_ger_continental_workshop:0 "Мастерская континента"
 nw_ger_continental_workshop_desc:0 "Рурские комбинаты, электротехнические концерны и химические заводы работают на рынки, которые не перерезала мировая война. Заказы Миттельевропы дают промышленности уверенность; зависимость соседей от германских поставок стала самостоятельным дипломатическим доводом."
 nw_ger_crown_and_reichstag:0 "Корона и рейхстаг"
 nw_ger_crown_and_reichstag_desc:0 "Канцлеру необходимо большинство, кайзеру — послушный канцлер. Коалиции собирают под обещания, распускают из-за бюджета и снова собирают перед очередным кризисом. Эта система сохраняет монархию, но редко позволяет кабинету действовать быстро."
 nw_ger_high_seas_fleet:0 "Флот без потолка"
 nw_ger_high_seas_fleet_desc:0 "Кильские верфи не знают ограничений Вашингтонского договора. Адмиралы требуют кораблей для защиты торговли и колоний, промышленники охотно принимают заказы. Каждая новая эскадра, впрочем, оплачивается из того же бюджета, что дороги, школы и сухопутная армия."
 nw_aus_federal_bargain:0 "Компромисс четырёх корон"
 nw_aus_federal_bargain_desc:0 "Федерализация пережила сопротивление Будапешта, но её победа не отменила торга между землями. Общие учреждения работают, пока участники видят в них собственную выгоду. Императору приходится договариваться даже тогда, когда он мог бы приказать."
 nw_aus_many_languages:0 "Одна армия, много языков"
 nw_aus_many_languages_desc:0 "Полковые традиции и общая присяга связывают солдат разных земель. Приказы же по-прежнему проходят через переводчиков, отдельные канцелярии и местные интересы. В мирное время это кажется привычным устройством; на учениях задержки измеряются уже потерянными часами."
 nw_aus_adriatic_system:0 "Адриатическая система"
 nw_aus_adriatic_system_desc:0 "Победы над Италией и Сербией вывели Вену далеко за прежние пределы влияния. Порты, клиенты и договоры прикрывают подступы к Адриатике. Теперь недостаточно выиграть войну: нужно платить за порядок, который возник после победы."
 nw_tur_palace_and_army:0 "Дворец и армия"
 nw_tur_palace_and_army_desc:0 "Омер Фарук пришёл к власти вместе с офицерами, обещавшими остановить отступление империи. Двор держится на армии, а армия получает назначения и средства от двора. Личная верность султану укрепляет режим, но делает опасным любой спор внутри военного руководства."
 nw_tur_lost_provinces:0 "Счёт утраченных провинций"
 nw_tur_lost_provinces_desc:0 "В штабах висят карты с границами, которых больше нет. Проливы, Иония, армянские земли и Мосул напоминают о поражениях последних десятилетий. Обещание возвращения объединяет недовольных, однако не добавляет казне денег и не заменяет подготовки армии."
 nw_tur_german_machinery:0 "Модернизация в кредит"
 nw_tur_german_machinery_desc:0 "Германские станки и инструкторы позволяют наверстать часть отставания. Новые предприятия должны обслуживать армию, но сначала приходится учить рабочих и платить по контрактам. Независимость султанской политики всё чаще обсуждают рядом с условиями очередного займа."
 nw_fra_paying_bonds:0 "Русские купоны"
 nw_fra_paying_bonds_desc:0 "Выплаты по русским бумагам приходят в срок, и семейные сбережения не исчезли вместе с империей-заёмщиком. Банки Парижа превращают этот доход в новые кредиты. Французское влияние часто начинается там, где заканчивается чужая возможность занимать без поручителя."
 nw_fra_revenge_without_war:0 "Реванш без войны"
 nw_fra_revenge_without_war_desc:0 "Потерянные провинции остаются частью французского политического языка. Кабинетам удобнее отвечать на германское усиление кредитами, тарифами и договорами, чем всеобщей мобилизацией. Общество требует твёрдости, но согласие заканчивается на вопросе о её цене."
 nw_fra_leagues_and_front:0 "Правительство Французского действия"
 nw_fra_leagues_and_front_desc:0 "Аксьён Франсез добилась власти, но победа правых не прекратила политический спор. Республиканцы не признают новое устройство окончательным, профсоюзы опасаются расправы, а монархисты расходятся в вопросе о сроках реставрации. Кабинет удерживается на поддержке консерваторов и обещании вернуть Франции её прежнее влияние."
 nw_eng_imperial_retreat:0 "Сокращение обязательств"
 nw_eng_imperial_retreat_desc:0 "Карта ещё помнит британские цвета там, где больше нет британских гарнизонов. Эвакуации и новые договоры облегчили расходы лишь отчасти: пенсионные обязательства, долги и безработица остались в метрополии. Правительству приходится объяснять, почему отступление необходимо для сохранения империи."
 nw_eng_eastern_anchor:0 "Восточный якорь"
 nw_eng_eastern_anchor_desc:0 "Сингапур должен удержать то, что ещё связывает Британию с Азией. Адмиралтейство переносит сюда внимание, склады и корабли. Торговые пути стали короче на кабинетных картах и гораздо длиннее для людей, которым предстоит их защищать."
 nw_eng_invergordon_memory:0 "Память об Инвергордоне"
 nw_eng_invergordon_memory_desc:0 "Моряки уже показали, что бюджетная экономия имеет предел. Командование восстановило дисциплину, но очередное сокращение жалованья или тяжёлый поход снова поднимают старые разговоры. Флот остаётся огромной силой, уверенность в его беспрекословном послушании — нет."
 nw_jap_silk_crisis:0 "Рухнувший шёлковый рынок"
 nw_jap_silk_crisis_desc:0 "Доходы от шёлка кормили деревни и оплачивали импорт. Теперь торговцы снижают закупки, крестьянские семьи влезают в долги, а рекрутские комиссии слышат всё больше рассказов о разорении. Армейские обещания нового порядка находят благодарных слушателей."
 nw_jap_officers_politics:0 "Политика молодых офицеров"
 nw_jap_officers_politics_desc:0 "После убийств 1932 года никто не уверен, где заканчивается армейское недовольство и начинается заговор. Министры оглядываются на военных, военные спорят между собой о спасении империи. За громкими клятвами верности трону скрываются несовместимые программы."
 nw_jap_railway_foothold:0 "Южно-Маньчжурская дорога"
 nw_jap_railway_foothold_desc:0 "Железная дорога даёт Японии влияние, которое не отмечено на карте сплошным цветом. Охрана, склады и концессии создают опору на материке. Но всякое расширение этого присутствия затрагивает права России и номинальный суверенитет Китая."
 nw_usa_populist_storm:0 "Популистская буря"
 nw_usa_populist_storm_desc:0 "Сторонники Лонга обещают разделить богатство, другие движения предлагают пенсии, общественные работы или возврат к старым порядкам. Их объединяет убеждение, что Вашингтон перестал слышать страну. Прежним партиям уже недостаточно победить друг друга, чтобы вернуть доверие."
 nw_usa_oceanic_distance:0 "За двумя океанами"
 nw_usa_oceanic_distance_desc:0 "Европейские кризисы кажутся американскому избирателю чужими счетами. Конгресс охотно обсуждает защиту собственных берегов и с подозрением встречает дальние обязательства. Промышленные возможности страны огромны; готовность расходовать их на чужие конфликты значительно скромнее."
 nw_chi_nanjing_compromise:0 "Нанкинский компромисс"
 nw_chi_nanjing_compromise_desc:0 "Провинциальные командующие признают столицу, пока столица признаёт их армии и местные доходы. Общий флаг облегчает переговоры с иностранцами, но приказ из Нанкина всё ещё может задержаться на границе чужого военного округа."
 nw_chi_double_patron:0 "Помощь с оговорками"
 nw_chi_double_patron_desc:0 "Россия предлагает кредиты и военных специалистов, одновременно поддерживая отторгнутые окраины. Отказаться от помощи трудно, забыть о потерях невозможно. Правительство ищет германскую альтернативу и старается не превратить зависимость от одного покровителя в зависимость от другого."
 nw_chi_currency_reform:0 "Новая валюта, старые долги"
 nw_chi_currency_reform_desc:0 "Реформа должна вернуть правительству контроль над деньгами после серебряного кризиса. Банки приспосабливаются к новым правилам, торговцы проверяют каждую бумагу, провинциальные власти берегут собственные кассы. Доверие нельзя ввести одним распоряжением министерства."
 nw_raj_congress_federation:0 "Республика договоров"
 nw_raj_congress_federation_desc:0 "Независимость объединила страну под знамёнами Конгресса. Управлять ею оказалось труднее: княжеские дворы, провинциальные собрания и общинные лидеры понимают федерацию по-разному. Дели приходится превращать победу освободительного движения в повседневную работу государства."
 nw_raj_undivided_market:0 "Общий индийский рынок"
 nw_raj_undivided_market_desc:0 "Новая республика сохранила связи между портами, промышленными районами и сельскохозяйственными областями. Большой внутренний рынок даёт собственную опору развитию. Пользоваться этим преимуществом мешают бедность, неравномерность инфраструктуры и старые внутренние барьеры."
 nw_raj_communal_compromise:0 "Хрупкое общинное согласие"
 nw_raj_communal_compromise_desc:0 "Мусульманская лига требует гарантий провинциальных прав, Конгресс настаивает на единстве республики. Пока споры ведутся на заседаниях, а не на улицах, раздел остаётся угрозой, а не свершившимся фактом. Любая попытка обойти переговоры может изменить это равновесие."
 nw_man_two_railways:0 "Территория совместного управления"
 nw_man_two_railways_desc:0 "После войны 1919–1921 годов Россия и Япония закрепили совместное управление Маньчжурией. Комиссия распоряжается бюджетом, железными дорогами и внешними сношениями. Китайские чиновники ведут текущие дела, но не могут изменить установленный державами порядок."
 nw_man_guarded_peace:0 "Статут кондоминиума"
 nw_man_guarded_peace_desc:0 "Китай проиграл войну северо-восточных железных дорог. Договор вывел Маньчжурию из его непосредственного управления и запретил ей самостоятельную внешнюю и военную политику. Российские и японские гарнизоны пользуются договорным проходом; местная администрация отвечает за снабжение, сбор доходов и порядок."
 nw_mon_russian_resident:0 "Русский резидент"
 nw_mon_russian_resident_desc:0 "Помощь Петербурга позволила закрепить независимое от Китая управление и расширить монгольские владения. За займы, оружие и инструкторов приходится расплачиваться свободой внешнеполитического выбора. Резидент редко отдаёт приказ открыто: чаще достаточно напомнить об условиях следующей поставки."
 nw_mon_steppe_unification:0 "Собрать степь"
 nw_mon_steppe_unification_desc:0 "Внешняя и Внутренняя Монголия оказались под одной властью, но кочевые пути не стали административными границами. Требуется согласовать налоги, снабжение и отношения с местной знатью. У правительства теперь больше земли и больше расстояний между людьми, которыми оно должно управлять."
 nw_sik_sponsored_independence:0 "Независимость под покровительством"
 nw_sik_sponsored_independence_desc:0 "Отделение от Китая стало возможным благодаря местному восстанию и русской поддержке. Новая власть нуждается в поставках через границу, пока собственные учреждения только складываются. Покровитель гарантирует её существование и ждёт, что его интересы будут услышаны первыми."
 nw_sik_oasis_politics:0 "Политика оазисов"
 nw_sik_oasis_politics_desc:0 "Кашгар, Хотан и северные торговые города живут разными интересами. Власть столицы доходит до них вместе с караваном, чиновником и отрядом охраны. Создать общую республику труднее, чем провозгласить её на площади после победы."
 nw_tib_regency:0 "Время регентства"
 nw_tib_regency_desc:0 "После смерти XIII Далай-ламы государством управляет регент. Монастырские учреждения обеспечивают преемственность, но каждое важное назначение затрагивает интересы соперничающих кругов. Поиск нового воплощения определит не только религиозное будущее Тибета."
 nw_tib_indian_guarantee:0 "Южная опора"
 nw_tib_indian_guarantee_desc:0 "Дели связывает безопасность Тибета с безопасностью собственной северной границы. Индийская гарантия даёт Лхасе дипломатическую опору, не отменяя трудностей управления восточными приобретениями. Помощь соседа полезна именно до тех пор, пока не начинает заменять собственные решения."
 nw_brm_unfinished_independence:0 "Независимость без передышки"
 nw_brm_unfinished_independence_desc:0 "Британская власть ушла вслед за индийским движением, оставив после себя чиновничий аппарат, торговые связи и старые споры. Центральное правительство хочет говорить от имени всей Бирмы. В пограничных областях сначала спрашивают, что новая столица сможет предложить взамен прежних договоров."
 nw_shx_provincial_bargain:0 "Хозяйство Янь Сишаня"
 nw_shx_provincial_bargain_desc:0 "Шаньси строит заводы, содержит собственные войска и ведёт дела так, будто общекитайское правительство находится за пределами повседневной политики. Признание Нанкина сохраняет удобную вывеску. Реальные полномочия столицы по-прежнему определяются договорённостью с провинциальной властью."
 nw_xsm_provincial_bargain:0 "Договор с ма-кликой"
 nw_xsm_provincial_bargain_desc:0 "Военные семьи северо-запада отвечают за дороги, сбор доходов и лояльность своих частей. Союз со столицей обеспечивает признание и поставки. Превратить это соглашение в обычное подчинение губернатора будет гораздо труднее, чем подписать общий документ."
 nw_yun_provincial_bargain:0 "Провинция за горами"
 nw_yun_provincial_bargain_desc:0 "Горные дороги защищают Юньнань от внезапного вмешательства и одновременно удорожают всё, что приходит извне. Местное командование признаёт Нанкин, сохраняя собственные рычаги власти. Центр пока предпочитает такой порядок ещё одному походу на далёкую провинцию."
 nw_gxc_provincial_bargain:0 "Армия гуансийской клики"
 nw_gxc_provincial_bargain_desc:0 "Гуансийские командующие предлагают Нанкину дисциплинированные части и поддержку общенационального дела. Взамен они рассчитывают сохранить назначения и контроль над провинцией. Столице нужна эта армия, но не её привычка самостоятельно решать, когда приказ центра обязателен."
 nw_sri_neapolitan_councils:0 "Советы Неаполя"
 nw_sri_neapolitan_councils_desc:0 "Рабочие организации и крестьянские комитеты свергли прежний порядок, но не договорились об устройстве нового. Коллективное руководство удерживает революционное единство ценой долгих споров о снабжении, собственности и отношениях с Сицилией."
 nw_sri_agrarian_south:0 "Наследство юга"
 nw_sri_agrarian_south_desc:0 "Старые земельные отношения рухнули быстрее, чем появились новые склады, мастерские и дороги. Республика обещала землю и хлеб; выполнить второе обещание теперь важнее, чем снова подтвердить первое. Для промышленного рывка ей не хватает и капитала, и специалистов."
 nw_sri_revolutionary_beacon:0 "Маяк без Интернационала"
 nw_sri_revolutionary_beacon_desc:0 "Неаполь стал адресом для социалистов, которым негде искать советскую Россию. Газеты, делегаты и политические эмигранты придают маленькой республике влияние за её границами. Соседи читают те же газеты и всё чаще видят в ней угрозу собственному порядку."
 nw_spm_parliamentary_refuge:0 "Республика после поражения"
 nw_spm_parliamentary_refuge_desc:0 "Северные промышленники, республиканцы и умеренные согласились сохранить парламент там, где не удалось сохранить Италию. Савойскому дому разрешили вернуться без короны. Каждое правительство должно доказывать, что этот компромисс способен дать больше, чем очередной призыв к реваншу."
 nw_spm_french_shelter:0 "Под французской гарантией"
 nw_spm_french_shelter_desc:0 "Париж предоставляет дипломатическую защиту и доступ к кредитам. Они позволяют восстанавливать хозяйство, пока за границами стоят соперники. Оппозиция всё чаще спрашивает, сколько самостоятельности останется у республики, когда придёт время расплачиваться за эту помощь."
 nw_lbv_viennese_settlement:0 "Республика под венским надзором"
 nw_lbv_viennese_settlement_desc:0 "Федеральные учреждения дают местным землям возможность договариваться между собой. Во внешних делах последняя подпись всё равно остаётся за Веной. Венецианским политикам приходится одновременно защищать самостоятельность республики и доказывать покровителю свою надёжность."
 nw_pap_temporal_power:0 "Возвращение светской власти"
 nw_pap_temporal_power_desc:0 "Папа снова отвечает за дороги, налоги и полицию, а не только за судьбу католического мира. Международный авторитет помогает Риму, но государственное хозяйство нельзя вести одними энцикликами. Курии приходится заново учиться делам, от которых её десятилетиями отделяла граница Ватикана."
 nw_mlt_order_state:0 "Орден на острове"
 nw_mlt_order_state_desc:0 "Уход британского гарнизона вернул ордену территорию и вместе с ней обязанности государства. Порт, снабжение и отношения с жителями требуют иных навыков, чем дипломатические церемонии. Связь с Римом укрепляет легитимность новой власти, но не делает остров менее зависимым от морской торговли."
 nw_gre_overextended_victory:0 "Цена Великой идеи"
 nw_gre_overextended_victory_desc:0 "Приобретения последних десятилетий выглядят убедительно на карте. За её рамкой остаются стоимость гарнизонов, содержание флота и спорные права жителей новых владений. Греция стала сильнее, но ещё не научилась недорого удерживать всё, чего добилась."
 nw_gre_island_lifelines:0 "Островные линии снабжения"
 nw_gre_island_lifelines_desc:0 "Кипр, Додеканес и зависимые государства связывают Афины с восточным Средиземноморьем. Каждый порт требует кораблей и складов, каждая тревога отвлекает силы от материка. Морская связь поддерживает греческое влияние и делает его уязвимым для перебоев."
 nw_bul_committee_state:0 "Государство воевод"
 nw_bul_committee_state_desc:0 "ВМРО перенесла методы подпольной организации в правительственные кабинеты. Вооружённые сети обеспечивают режиму опору, а царь придаёт ему привычную внешнюю форму. Чиновникам приходится согласовывать решения не только с министрами, но и с людьми, которые привыкли получать ответ силой."
 nw_bul_third_war_defeat:0 "После Третьей Балканской"
 nw_bul_third_war_defeat_desc:0 "Поражение закрыло выход к Эгейскому морю и оставило тысячи людей с надеждой на возвращение. Подпольные отряды обещают исправить границы; казна должна кормить страну уже сейчас. Новая война кажется ответом именно тем, кто меньше всего думает о её цене."
 nw_rom_legionary_regime:0 "Легионерская власть"
 nw_rom_legionary_regime_desc:0 "Легион соединяет религиозное возрождение с требованием национальной дисциплины. Победа над Болгарией придала его обещаниям вес. Но Бессарабия остаётся российской, а Трансильвания — габсбургской, и власть вынуждена объяснять разницу между громкими лозунгами и осторожной дипломатией."
 nw_rom_oil_diplomacy:0 "Нефть Плоешти"
 nw_rom_oil_diplomacy_desc:0 "Покупатели румынской нефти готовы спорить друг с другом за поставки и контракты. Бухарест получает валюту и возможность торговаться. Вместе с ними приходят иностранные требования, которые не исчезают после окончания деловой встречи."
 nw_ser_defeated_kingdom:0 "Королевство под надзором"
 nw_ser_defeated_kingdom_desc:0 "Парламент заседает, корона сохраняет церемонии, но важнейшие решения проверяют на соответствие венским условиям. Для общества это напоминание о войне 1930–1931 годов. Правительство должно управлять страной, в которой покорность и предательство слишком легко становятся синонимами."
 nw_ser_underground_networks:0 "Подполье после поражения"
 nw_ser_underground_networks_desc:0 "Ветераны, офицеры и национальные общества не признали окончательность послевоенного устройства. Они скрывают оружие и ищут связи по обе стороны границы. Сочувствие к их целям широко, но правительство опасается, что очередная акция даст Вене повод вмешаться снова."
 nw_alb_habsburg_credit:0 "Венский кредит"
 nw_alb_habsburg_credit_desc:0 "Присоединение албанских земель укрепило государство, но дороги, казармы и таможни требуют денег. Главным кредитором остаются габсбургские банки. Тирана ведёт самостоятельную политику, хотя разрыв с Веной сделал бы обслуживание долга и новые закупки куда труднее."
 nw_mnt_small_crown:0 "Малая корона между соседями"
 nw_mnt_small_crown_desc:0 "Петровичи-Негоши сохранили престол, которого их лишила бы иная история. Независимость требует постоянного равновесия между сербскими связями и австрийским влиянием. Небольшой двор может вести самостоятельную политику, пока помнит о пределах собственных ресурсов."
 nw_mac_unrecognized_republic:0 "Республика без признания"
 nw_mac_unrecognized_republic_desc:0 "Собственные учреждения уже стали частью повседневной жизни, тогда как соседи продолжают спорить о самом праве государства на существование. Учителя, священники и бывшие четники поддерживают новую идентичность. Границы республики приходится защищать не только на местности, но и в каждом дипломатическом разговоре."
 nw_str_straits_republic:0 "Государство у Проливов"
 nw_str_straits_republic_desc:0 "Республика возникла в узле чужих притязаний. Греческая защита позволяет ей существовать, османские претензии не дают забыть о временности спокойствия. Портовые доходы помогают содержать управление, но каждый спор о судоходстве превращается в вопрос высокой политики."
 nw_str_greek_proxy:0 "Греческое прокси-государство"
 nw_str_greek_proxy_desc:0 "Границы республики защищают греческие гарнизоны, а её бюджет зависит от помощи Афин. Местное правительство ведёт повседневные дела, но армия и внешняя политика остаются частью греческой системы безопасности. Выход из этой зависимости потребует большего, чем парламентское решение."
 nw_egy_nile_kingdom:0 "Нильская держава"
 nw_egy_nile_kingdom_desc:0 "Суэц, Судан и Ливия вывели Каир из положения зависимой столицы. Королевство контролирует важнейшие пути и рассчитывает говорить от имени арабского мира. Расширение ещё предстоит превратить в управляемое хозяйство, а престиж — в устойчивые доходы."
 nw_egy_southern_and_western_unrest:0 "За пределами долины"
 nw_egy_southern_and_western_unrest_desc:0 "В Киренаике помнят Сенусийю, в Судане — собственные религиозные и политические традиции. Каирские чиновники считают новые земли частью королевства, местные общества оценивают их по налогам и поведению гарнизонов. Победа в походе не означает окончания сопротивления."
 nw_egy_empire_of_the_nile:0 "Империя Нила"
 nw_egy_empire_of_the_nile_desc:0 "Каир объединил под одной короной Египет, Судан и ливийское побережье. Нил связывает южные владения со столицей, а Суэц даёт правительству собственный голос в мировой политике. Эти приобретения укрепили престиж монархии, но власть за пределами старого Египта ещё держится на гарнизонах и соглашениях с местными элитами."
 nw_irq_mosul_question:0 "Мосульский вопрос"
 nw_irq_mosul_question_desc:0 "Багдад получает доходы от северных нефтяных месторождений, а османские карты продолжают относить их к утраченным владениям. Двору Гази приходится сочетать национальную риторику с поиском внешних гарантий. Нефть делает спор ценнее и потому опаснее."
 nw_syr_french_supervision:0 "Французский надзор"
 nw_syr_french_supervision_desc:0 "Государственные учреждения действуют под пристальным вниманием французских представителей. Договоры обещают порядок и развитие, оппозиция видит в них продолжение чужой власти иными средствами. Кабинету удаётся провести решение тем легче, чем меньше оно затрагивает интересы покровителя."
 nw_leb_coastal_compromise:0 "Прибрежный компромисс"
 nw_leb_coastal_compromise_desc:0 "Расширенная прибрежная территория даёт порты и торговые доходы. Держится она на соглашениях между местными общинами, деловыми кругами и французской администрацией. Любая попытка укрепить центр упирается в вопрос о том, чьи гарантии при этом станут слабее."
 nw_jor_two_banks:0 "Эмират двух берегов"
 nw_jor_two_banks_desc:0 "Присоединение Палестины связало двор Абдаллы с городскими элитами и торговыми сетями к западу от Иордана. Общая власть ещё не означает общего административного порядка. Двор предпочитает договариваться с влиятельными семьями, сохраняя за собой роль последнего посредника."
 nw_sau_conquered_hejaz:0 "Неджд и Хиджаз"
 nw_sau_conquered_hejaz_desc:0 "Королевство объединяет внутренние области Аравии и города паломнических путей. Их хозяйство и привычки различаются сильнее, чем предполагает единая карта. Авторитет династии удерживает союз, пока местные соглашения подкрепляются распределением доходов и защитой дорог."
 nw_oma_emirate_compact:0 "Соглашение эмиратов"
 nw_oma_emirate_compact_desc:0 "Общее название объединяет побережье и внутренние владения, но каждый правящий дом бережёт собственные договоры. Внешнее давление побуждает держаться вместе. Повседневные вопросы налогов и полномочий показывают, сколько ещё предстоит сделать до появления единой администрации."
 nw_yem_republican_union:0 "Собрать Йемен"
 nw_yem_republican_union_desc:0 "Республика получила общее пространство раньше, чем единые учреждения. Местные общины и старые центры влияния готовы признать столицу, если она уважает их положение. Правительству необходимы дороги и казначейство, но каждое начинание начинается с нового соглашения."
 nw_kur_persian_connection:0 "Персидская опора"
 nw_kur_persian_connection_desc:0 "Родство с шахским домом даёт монархии внешнюю поддержку и удобный дипломатический канал. Внутри страны её положение зависит от местных вождей и городских элит. Османский реванш делает покровительство необходимым, не устраняя споров о цене этой зависимости."
 nw_per_spheres_and_reform:0 "Реформы между сферами"
 nw_per_spheres_and_reform_desc:0 "Шах укрепляет армию и государственные учреждения, пока север смотрит на Россию, а нефтяные интересы юга связаны с Британией. Новая железная дорога может означать развитие для Тегерана и угрозу влиянию для чужой столицы. Централизация идёт вместе с постоянным внешним торгом."
 nw_ire_thirty_two_counties:0 "Тридцать два графства"
 nw_ire_thirty_two_counties_desc:0 "Победа принесла единую республику, но не общее согласие с её существованием. На северо-востоке сильны общины, связывавшие своё будущее с Британией. Дублин защищает единство острова и ищет способ сделать его приемлемым для тех, кто не считал независимость своей победой."
 nw_can_formal_dominion:0 "Корона без подчинения"
 nw_can_formal_dominion_desc:0 "Связь с короной сохраняется, но внешнюю торговлю, расходы и флот Оттава всё чаще рассматривает как собственное дело. Лондон нуждается в канадской поддержке сильнее, чем может ею распоряжаться. Новая свобода требует решений, которые раньше удобно было оставлять метрополии."
 nw_ast_formal_dominion:0 "Ответственность за южные моря"
 nw_ast_formal_dominion_desc:0 "Британское присутствие сосредоточено в Сингапуре, однако это уже не обещание защиты любой ценой. Канберра рассчитывает на общую корону и одновременно обсуждает собственные корабли, склады и торговые договоры. Самостоятельность перестала быть только конституционной формулой."
 nw_nzl_formal_dominion:0 "За пределами прежних гарантий"
 nw_nzl_formal_dominion_desc:0 "Веллингтон сохраняет верность короне, наблюдая, как сокращаются возможности метрополии. Привычная торговля остаётся основой хозяйства, а защиту морских путей приходится обсуждать заново. Формальная свобода не приближает далёкие рынки и не делает дешевле собственную оборону."
 nw_saf_republic_outside_union:0 "Республика вне унии"
 nw_saf_republic_outside_union_desc:0 "Выход из имперской унии удовлетворил давние требования части общества. Теперь кабинет должен доказать, что самостоятельность принесёт пользу и тем, кто опасался разрыва. Старые социальные противоречия пережили смену государственного устройства."
 nw_pua_peoples_union:0 "Союз общин"
 nw_pua_peoples_union_desc:0 "Прежние колониальные границы уступили место союзу, который обещает представительство местным народам. Разные общины поддержали освобождение, но по-разному понимают общую власть и собственность. Единство приходится подтверждать распределением земли, доходов и должностей."
 nw_pua_colonial_economy:0 "Хозяйство колониального вывоза"
 nw_pua_colonial_economy_desc:0 "Дороги и предприятия строили для вывоза сырья, а не для связи между всеми частями страны. Новое правительство располагает этими активами, но зависит от прежних рынков и технических специалистов. Политическая независимость ещё не обеспечила хозяйственной самостоятельности."
 nw_lag_joint_interest:0 "Порт общих интересов"
 nw_lag_joint_interest_desc:0 "Британская администрация и германские экономические права существуют рядом в тесном портовом пространстве. Такая договорённость сохраняет торговлю, но затрудняет любое самостоятельное решение. Лагос богат связями и беден возможностью выбирать между ними."
 nw_sie_new_patron:0 "Новый покровитель"
 nw_sie_new_patron_desc:0 "Уход Британии не сделал казну и порт Фритауна самодостаточными. Французская поддержка закрывает часть прежних обязательств и создаёт новые. Местная власть получила другое окно для переговоров, но пока не возможность обходиться без внешнего покровителя."
 nw_gam_new_patron:0 "Новый покровитель"
 nw_gam_new_patron_desc:0 "Уход Британии не сделал казну и порт Батерста самодостаточными. Французская поддержка закрывает часть прежних обязательств и создаёт новые. Местная власть получила другое окно для переговоров, но пока не возможность обходиться без внешнего покровителя."
 nw_por_african_extension:0 "Расширенные африканские владения"
 nw_por_african_extension_desc:0 "Новые внутренние территории увеличили португальскую Африку и расстояния между её административными центрами. Лиссабон рассчитывает связать их дорогами и торговлей. Пока расходы на присутствие растут быстрее, чем доходы от расширения."
 nw_eth_red_sea_window:0 "Окно к Красному морю"
 nw_eth_red_sea_window_desc:0 "Возвращённое побережье даёт империи порты и возможность меньше зависеть от чужих путей. Само по себе море не создаёт железных дорог и подготовленных кадров. Двору предстоит связать новые владения с нагорьем и удержать их без бесконечного напряжения казны."
 nw_eth_ogaden_truce:0 "Перемирие в Огадене"
 nw_eth_ogaden_truce_desc:0 "Граница успокоилась раньше, чем закончились взаимные претензии. Пограничные начальники следят за передвижениями соседей, скотоводы продолжают пересекать линии на карте. Империи нужен мир для развития, но оставить юго-восток без внимания она не может."
 nw_som_coastal_republic:0 "Республика побережья"
 nw_som_coastal_republic_desc:0 "Освобождение от колониальной власти соединило национальные требования с обещаниями социального переустройства. Порты связывают страну с внешним миром, внутренние районы — с местными соглашениями. Республика должна убедить обе стороны, что новая столица представляет и их интересы."
 nw_bel_congo_pressure:0 "Конго среди чужих интересов"
 nw_bel_congo_pressure_desc:0 "Бельгийское Конго сохранилось, но германское присутствие в Африке не исчезло после несостоявшейся войны. Брюссель бережёт колониальные доходы и старается не превращать деловое соперничество держав в военное. Уступка, безопасная в Европе, может дорого обойтись на африканской границе."
 nw_hol_eastern_trade:0 "Восточная торговля под давлением"
 nw_hol_eastern_trade_desc:0 "Ост-Индия остаётся основой нидерландской колониальной торговли. В Азии действуют усиливающаяся Япония, независимая Индия и ослабленная Британия, поэтому привычного равновесия больше нет. Сохранить нейтралитет теперь означает внимательно выбирать каждое соглашение."
 nw_phi_uncertain_transition:0 "Независимость в чужой гонке"
 nw_phi_uncertain_transition_desc:0 "Курс на самостоятельность сохраняется, но вокруг островов растут флоты держав, не связанных морскими договорами. Собственные учреждения должны научиться отвечать за безопасность раньше, чем исчезнет американская опора. Каждый новый корабль соседей делает этот переход менее отвлечённым вопросом."
 nw_mal_singapore_hub:0 "Сингапурский узел"
 nw_mal_singapore_hub_desc:0 "Британия переносит на восток ту часть имперской силы, которую ещё способна содержать. Склады, ремонтные работы и военные заказы оживляют портовое хозяйство. Одновременно Малайя становится местом, где метрополия намерена удерживать свои позиции даже ценой растущего напряжения."
 nw_ins_indian_example:0 "Индийский пример"
 nw_ins_indian_example_desc:0 "Весть о независимой Индии обсуждают в газетах, студенческих кружках и портах. Пример большого соседа придаёт национальным требованиям новую убедительность. Колониальная администрация может контролировать учреждения, но ей всё труднее утверждать, что самостоятельность остаётся лишь далёкой возможностью."
 nw_afg_northern_giant:0 "У границы империи"
 nw_afg_northern_giant_desc:0 "Северный сосед пережил десятилетия без революционного распада и сохранил свои среднеазиатские владения. Кабулу приходится учитывать эту силу, не отказываясь от собственной самостоятельности. Торговые возможности и страх вмешательства часто обсуждаются на одних и тех же переговорах."
 nw_spr_southern_example:0 "Итальянский пример"
 nw_spr_southern_example_desc:0 "Существование советской республики в южной Италии даёт левым близкий и понятный образец. Правые видят в нём предупреждение о судьбе государства, которое утратило порядок. Испанский спор остаётся собственным, но обе стороны всё чаще приводят в нём одни и те же зарубежные примеры."
 nw_pol_imperial_autonomy:0 "Расширенные права автономии"
 nw_pol_imperial_autonomy_desc:0 "Польский сейм распоряжается внутренними делами царства, а местная администрация отвечает перед Варшавой. Петербург сохраняет внешнюю политику и верховную власть. Расширенные права успокоили умеренных, но вопрос о границах самостоятельности остаётся открытым."
 nw_fin_imperial_autonomy:0 "Расширенные права автономии"
 nw_fin_imperial_autonomy_desc:0 "Сейм, собственные законы и местное управление отделяют княжество от обычных губерний империи. Новый компромисс с Петербургом укрепил эти права. Финляндия пользуется общим рынком, сохраняя привычку решать свои дела самостоятельно."
 nw_ion_greek_proxy:0 "Греческое прокси-государство"
 nw_ion_greek_proxy_desc:0 "Границы республики защищают греческие гарнизоны, а её бюджет зависит от помощи Афин. Местное правительство ведёт повседневные дела, но армия и внешняя политика остаются частью греческой системы безопасности. Выход из этой зависимости потребует большего, чем парламентское решение."
 nw_man_commission_statute:0 "Статут 1921 года"
 nw_man_commission_statute_desc:0 "Маньчжурия не является марионеткой одной державы: её суверенитет ограничен договором о совместном управлении. Самостоятельные войны, блоки, гарантии, вмешательство и военные сделки запрещены. Армия, исследования, политические назначения и новое строительство подчинены комиссии; российские и японские гарнизоны располагают договорным проходом."
 nw_oma_union_against_saud:0 "Единение против гнёта Саудов"
 nw_oma_union_against_saud_desc:0 "Эмиры спорят о пошлинах, границах владений и старшинстве домов. Но опыт саудовского наступления напоминает каждому, чего стоит одиночество. Общая оборона стала основой союза: пока внешняя угроза сохраняется, правители готовы откладывать старые счёты и поддерживать федеральное правительство."
