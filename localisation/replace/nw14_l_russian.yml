 nw14.60.t:0 "Зарубежная поддержка рабочих организаций"
 nw14.60.d:0 "Рабочие организации получили средства и связных из Германии. Правительство может ответить социальными уступками и расследованием финансирования или оставить дело без вмешательства."
 nw14.60.a:0 "Расследовать финансирование и обсудить требования."
 nw14.60.b:0 "Не вмешиваться в легальную деятельность."
 nw14_pan:0 "Панъевропейская дипломатия"
 nw14_pan_desc:0 "Членство добровольное. Приглашения доступны только независимым европейским демократиям вне фракций. Отказ не даёт повода к войне."
 nw14_invite_BEL:0 "Пригласить Бельгию"
 nw14_invite_BEL_desc:0 "Правительство страны самостоятельно ответит на предложение."
 nw14_guarantee_BEL:0 "Гарантировать безопасность: Бельгию"
 nw14_guarantee_BEL_desc:0 "Гарантия не требует вступления в союз и не меняет государственный строй адресата."
