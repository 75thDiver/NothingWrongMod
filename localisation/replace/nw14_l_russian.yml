 NW14_GER_start_democratic:0 "СДПГ — КПГ"
 NW14_GER_start_democratic_long:0 "Коалиция Социал-демократической и Коммунистической партий Германии"
 NW14_SOV_royal_bulletin:0 "Тревожный бюллетень из дворца"
 NW14_SOV_royal_bulletin_desc:0 "Врачи сообщают об ухудшении состояния Алексея II. Кабинет должен предложить стране ясный путь: лечение и сохранение престола, регентство Кирилла Владимировича, республиканскую мобилизацию или власть защитников трона."
 nw14.70.t:0 "Здоровье царя"
 nw14.70.d:0 "Состояние Алексея II ухудшилось. Придворные врачи требуют покоя, министры настаивают на непрерывности управления, а в губерниях множатся слухи о будущем престола. Решение не предопределит исход болезни, но определит, какие силы поведут Россию через кризис."
 nw14.70.a:0 "Сосредоточиться на лечении и сохранить престол"
 nw14.70.b:0 "Подготовить регентство Кирилла Владимировича"
 nw14.70.c:0 "Призвать к республике и Учредительному собранию"
 nw14.70.e:0 "Передать инициативу защитникам трона"
 NW14_SOV_crown_long_01:0 "Преемственность престола"
 NW14_SOV_crown_long_01_desc:0 "Закрепить порядок наследования и снять двусмысленность вокруг больного государя."
 NW14_SOV_crown_long_02:0 "Кабинет ответственности"
 NW14_SOV_crown_long_02_desc:0 "Министры будут отвечать перед царём за исполнение согласованной программы."
 NW14_SOV_crown_long_03:0 "Совет короны"
 NW14_SOV_crown_long_03_desc:0 "Созвать представителей двора, правительства и губерний для разбора спорных решений."
 NW14_SOV_crown_long_04:0 "Закон о престолонаследии"
 NW14_SOV_crown_long_04_desc:0 "Уточнить процедуру регентства, чтобы переход власти не зависел от придворных слухов."
 NW14_SOV_crown_long_05:0 "Государственный совет губерний"
 NW14_SOV_crown_long_05_desc:0 "Земства получат постоянный канал для передачи нужд централизованному кабинету."
 NW14_SOV_crown_long_06:0 "Примирение двора и Думы"
 NW14_SOV_crown_long_06_desc:0 "Уступки монарха ограничат конфликт с выборными учреждениями без отказа от самодержавия."
 NW14_SOV_crown_long_07:0 "Царская инспекция"
 NW14_SOV_crown_long_07_desc:0 "Проверки снабжения и управления должны вернуть двору сведения из отдалённых губерний."
 NW14_SOV_crown_long_08:0 "Земская служба"
 NW14_SOV_crown_long_08_desc:0 "Подготовленные местные чиновники ускорят исполнение решений и снизят произвол на местах."
 NW14_SOV_crown_long_09:0 "Имперская школа управления"
 NW14_SOV_crown_long_09_desc:0 "Кадетские корпуса и университеты подготовят новое поколение государственных служащих."
 NW14_SOV_crown_long_10:0 "Верность короне и закону"
 NW14_SOV_crown_long_10_desc:0 "Армейская присяга будет сочетать службу государю с установленной процедурой командования."
 NW14_SOV_crown_long_11:0 "Губернские офицерские советы"
 NW14_SOV_crown_long_11_desc:0 "Военные округа получат право сообщать о проблемах, не превращаясь в политические штабы."
 NW14_SOV_crown_long_12:0 "Единый мобилизационный план"
 NW14_SOV_crown_long_12_desc:0 "Планирование транспорта и запасов повысит готовность без немедленного расширения армии."
 NW14_SOV_crown_long_13:0 "Договор с обществом"
 NW14_SOV_crown_long_13_desc:0 "Правительство соединит местное представительство, умеренные реформы и сохранение короны."
 NW14_SOV_crown_long_14:0 "Наследник вне придворных интриг"
 NW14_SOV_crown_long_14_desc:0 "Участие наследника в публичной работе снизит риск вакуума власти при новом ухудшении здоровья."
 NW14_SOV_crown_long_15:0 "Согласие короны и губерний"
 NW14_SOV_crown_long_15_desc:0 "После уступок и реформ центр сможет просить регионы о долгосрочной поддержке."
 NW14_SOV_crown_long_16:0 "Имперская хартия управления"
 NW14_SOV_crown_long_16_desc:0 "Хартия определит обязанности кабинета, Думы и земств при неизменном верховенстве монарха."
 NW14_SOV_crown_long_17:0 "Защита внутреннего рынка"
 NW14_SOV_crown_long_17_desc:0 "Тарифы и заказы дадут промышленности предсказуемый спрос, но повысят цены на импорт."
 NW14_SOV_crown_long_18:0 "Спокойная монархия"
 NW14_SOV_crown_long_18_desc:0 "Двор завершит кризис через управляемую преемственность и устойчивую работу учреждений."
 NW14_SOV_kirill_long_01:0 "Новый император"
 NW14_SOV_kirill_long_01_desc:0 "Кирилл Владимирович объявит о преемстве и потребует от армии личной присяги."
 NW14_SOV_kirill_long_02:0 "Манифест династии"
 NW14_SOV_kirill_long_02_desc:0 "Возвращение имперской символики объединит сторонников трона, но встревожит соседей."
 NW14_SOV_kirill_long_03:0 "Совет при государе"
 NW14_SOV_kirill_long_03_desc:0 "Ограниченный совет ускорит решения, одновременно усиливая влияние военных и двора."
 NW14_SOV_kirill_long_04:0 "Верность корпусов"
 NW14_SOV_kirill_long_04_desc:0 "Командующие подтвердят присягу; политически сомнительные части лишатся части снабжения."
 NW14_SOV_kirill_long_05:0 "Резервный призыв"
 NW14_SOV_kirill_long_05_desc:0 "Подготовить обученный резерв на случай кризиса границ, не переводя страну на военное положение."
 NW14_SOV_kirill_long_06:0 "Генеральный план железных дорог"
 NW14_SOV_kirill_long_06_desc:0 "Штаб обозначит магистрали, необходимые для переброски войск между фронтирами."
 NW14_SOV_kirill_long_07:0 "Центральный приказ"
 NW14_SOV_kirill_long_07_desc:0 "Региональные штабы будут обязаны передавать отчёты единому командованию."
 NW14_SOV_kirill_long_08:0 "Арсеналы внутреннего пояса"
 NW14_SOV_kirill_long_08_desc:0 "Уральские мастерские получат заказы на ремонт и стандартизированные запчасти."
 NW14_SOV_kirill_long_09:0 "Разведывательное управление"
 NW14_SOV_kirill_long_09_desc:0 "Военная разведка сосредоточится на приграничных кризисах и защите коммуникаций."
 NW14_SOV_kirill_long_10:0 "Каспийская линия"
 NW14_SOV_kirill_long_10_desc:0 "Укрепить снабжение Кавказа и каспийских портов до решения вопроса о внешней политике."
 NW14_SOV_kirill_long_11:0 "Переговоры с Тегераном"
 NW14_SOV_kirill_long_11_desc:0 "Россия предложит соглашение о транзите и торговле, сохранив возможность жёсткого давления."
 NW14_SOV_kirill_long_12:0 "Дальневосточные гарнизоны"
 NW14_SOV_kirill_long_12_desc:0 "Укрепление восточных узлов поможет удержать протяжённую границу и поддержку местных властей."
 NW14_SOV_kirill_long_13:0 "Балтийские верфи"
 NW14_SOV_kirill_long_13_desc:0 "Заказы флоту восстановят судостроительные мощности, но отвлекут ресурсы от сухопутных сил."
 NW14_SOV_kirill_long_14:0 "Союзники у проливов"
 NW14_SOV_kirill_long_14_desc:0 "Дипломаты проверят готовность соседей к договору о проходе и безопасности морских путей."
 NW14_SOV_kirill_long_15:0 "Имперские кредиты промышленности"
 NW14_SOV_kirill_long_15_desc:0 "Казённые займы поддержат тяжёлые заводы в обмен на приоритет оборонных заказов."
 NW14_SOV_kirill_long_16:0 "Пределы экспансии"
 NW14_SOV_kirill_long_16_desc:0 "Совет оценит, какие внешние цели страна способна обеспечить армией и снабжением."
 NW14_SOV_kirill_long_17:0 "Военная промышленность короны"
 NW14_SOV_kirill_long_17_desc:0 "Объединить закупки и ремонт в систему, подчинённую императорскому штабу."
 NW14_SOV_kirill_long_18:0 "Имперское возрождение"
 NW14_SOV_kirill_long_18_desc:0 "Кирилл завершит консолидацию престола и получит средства для осторожной внешней политики."
 NW14_SOV_sr_long_01:0 "Земельный мандат"
 NW14_SOV_sr_long_01_desc:0 "Эсеровское правительство подтвердит передачу помещичьих земель местным комитетам."
 NW14_SOV_sr_long_02:0 "Выборные земельные комиссии"
 NW14_SOV_sr_long_02_desc:0 "Крестьяне и юристы будут разбирать споры о границах наделов и компенсациях."
 NW14_SOV_sr_long_03:0 "Сельскохозяйственный кредит"
 NW14_SOV_sr_long_03_desc:0 "Кооперативам выдадут доступные займы; нехватка залога ограничит охват программы."
 NW14_SOV_sr_long_04:0 "Областные собрания"
 NW14_SOV_sr_long_04_desc:0 "Региональные собрания получат бюджетные полномочия и ответственность за исполнение реформ."
 NW14_SOV_sr_long_05:0 "Федеративный проект"
 NW14_SOV_sr_long_05_desc:0 "Национальные окраины пригласят к переговорам о языковых правах и представительстве."
 NW14_SOV_sr_long_06:0 "Договор о единстве республики"
 NW14_SOV_sr_long_06_desc:0 "Федерация сохранит общую армию и рынок в обмен на расширение местного самоуправления."
 NW14_SOV_sr_long_07:0 "Сельские учительские семинарии"
 NW14_SOV_sr_long_07_desc:0 "Подготовка учителей свяжет земельную реформу с грамотностью и административной работой."
 NW14_SOV_sr_long_08:0 "Земская медицина"
 NW14_SOV_sr_long_08_desc:0 "Местные больницы получат стабильное финансирование, хотя поставки медикаментов останутся узким местом."
 NW14_SOV_sr_long_09:0 "Кооперативные элеваторы"
 NW14_SOV_sr_long_09_desc:0 "Хранение зерна уменьшит сезонные потери и позволит сельским общинам торговаться за лучшие цены."
 NW14_SOV_sr_long_10:0 "Народная гвардия"
 NW14_SOV_sr_long_10_desc:0 "Местные части подчинят гражданским властям и снабдят для защиты дорог и складов."
 NW14_SOV_sr_long_11:0 "Контроль над офицерством"
 NW14_SOV_sr_long_11_desc:0 "Армейские назначения будут проверяться парламентской комиссией без роспуска профессионального штаба."
 NW14_SOV_sr_long_12:0 "Республиканская присяга"
 NW14_SOV_sr_long_12_desc:0 "Военные подтвердят верность Учредительному собранию, а не отдельным политическим клубам."
 NW14_SOV_sr_long_13:0 "Мандат Учредительного собрания"
 NW14_SOV_sr_long_13_desc:0 "Правительство назначит открытые выборы и обязуется подчиниться их результату."
 NW14_SOV_sr_long_14:0 "Закон о свободе объединений"
 NW14_SOV_sr_long_14_desc:0 "Легальные партии сохранят возможность спорить с эсерами и менять кабинет голосованием."
 NW14_SOV_sr_long_15:0 "Трудовой арбитраж"
 NW14_SOV_sr_long_15_desc:0 "Независимые комиссии будут разбирать конфликты между фабричными комитетами и владельцами."
 NW14_SOV_sr_long_16:0 "Бюджет через собрание"
 NW14_SOV_sr_long_16_desc:0 "Военные и хозяйственные расходы пройдут публичное обсуждение и получат законное основание."
 NW14_SOV_sr_long_17:0 "Республика общин"
 NW14_SOV_sr_long_17_desc:0 "Сельские комитеты, города и федеративные области свяжут свои полномочия единым правом."
 NW14_SOV_sr_long_18:0 "Земля и свобода"
 NW14_SOV_sr_long_18_desc:0 "Эсеры завершат переход к устойчивой аграрной демократии, сохранив выборный контроль над властью."
 NW14_SOV_menshevik_long_01:0 "Социалистическая законность"
 NW14_SOV_menshevik_long_01_desc:0 "Меньшевики подтвердят, что смена кабинета возможна через выборы, а не партийный приказ."
 NW14_SOV_menshevik_long_02:0 "Съезд профсоюзов"
 NW14_SOV_menshevik_long_02_desc:0 "Профсоюзы получат место за столом переговоров, сохранив самостоятельность от правительства."
 NW14_SOV_menshevik_long_03:0 "Муниципальные бюджеты"
 NW14_SOV_menshevik_long_03_desc:0 "Города смогут планировать транспорт и жильё в пределах общих правил казначейства."
 NW14_SOV_menshevik_long_04:0 "Свободная печать"
 NW14_SOV_menshevik_long_04_desc:0 "Газеты разных направлений будут спорить о курсе страны без предварительной цензуры."
 NW14_SOV_menshevik_long_05:0 "Коалиция труда и демократии"
 NW14_SOV_menshevik_long_05_desc:0 "Умеренные социалисты предложат сотрудничество центристам и независимым депутатам."
 NW14_SOV_menshevik_long_06:0 "Пакт о парламентской ответственности"
 NW14_SOV_menshevik_long_06_desc:0 "Партнёры договорятся о бюджете и отказе от одностороннего разгона собрания."
 NW14_SOV_menshevik_long_07:0 "Профессиональная государственная служба"
 NW14_SOV_menshevik_long_07_desc:0 "Набор чиновников по экзамену уменьшит партийную смену кадров в провинции."
 NW14_SOV_menshevik_long_08:0 "Независимые городские суды"
 NW14_SOV_menshevik_long_08_desc:0 "Суды станут доступнее жителям и смогут рассматривать трудовые и муниципальные споры."
 NW14_SOV_menshevik_long_09:0 "Общественные мастерские"
 NW14_SOV_menshevik_long_09_desc:0 "Городские кооперативы получат оборудование для ремонта транспорта и коммунальной инфраструктуры."
 NW14_SOV_menshevik_long_10:0 "Гражданская оборона"
 NW14_SOV_menshevik_long_10_desc:0 "Местные комиссии подготовят эвакуацию и распределение запасов без политической милитаризации."
 NW14_SOV_menshevik_long_11:0 "Совет армейской реформы"
 NW14_SOV_menshevik_long_11_desc:0 "Офицеры и депутаты согласуют модернизацию, избегая чисток и параллельных партийных штабов."
 NW14_SOV_menshevik_long_12:0 "Снабжение по контракту"
 NW14_SOV_menshevik_long_12_desc:0 "Открытые закупки укрепят доверие между армией, промышленниками и парламентом."
 NW14_SOV_menshevik_long_13:0 "Палата труда"
 NW14_SOV_menshevik_long_13_desc:0 "Национальный совет труда будет примирять профсоюзы, предпринимателей и кабинет."
 NW14_SOV_menshevik_long_14:0 "Страхование рабочих"
 NW14_SOV_menshevik_long_14_desc:0 "Фабричные взносы создадут страхование от травм и потери заработка."
 NW14_SOV_menshevik_long_15:0 "Смешанная промышленная политика"
 NW14_SOV_menshevik_long_15_desc:0 "Государство инвестирует в ключевые отрасли, оставляя кооперативам и частным фирмам пространство роста."
 NW14_SOV_menshevik_long_16:0 "Конституционная гарантия оппозиции"
 NW14_SOV_menshevik_long_16_desc:0 "Правительство закрепит права меньшинства и регулярную сменяемость кабинета."
 NW14_SOV_menshevik_long_17:0 "Республика договорённостей"
 NW14_SOV_menshevik_long_17_desc:0 "Профсоюзы, города и умеренные партии поддержат общий парламентский курс."
 NW14_SOV_menshevik_long_18:0 "Социалистическая демократия"
 NW14_SOV_menshevik_long_18_desc:0 "Меньшевики добьются республики, где реформы защищены законом и открытым политическим спором."
 NW14_SOV_bolshevik_long_01:0 "Рабочий контроль заводов"
 NW14_SOV_bolshevik_long_01_desc:0 "Советы получат доступ к производственным отчётам, а директора — единые обязательные нормы."
 NW14_SOV_bolshevik_long_02:0 "Комитеты снабжения"
 NW14_SOV_bolshevik_long_02_desc:0 "Региональные органы будут учитывать зерно и топливо, чтобы снизить перебои между городом и деревней."
 NW14_SOV_bolshevik_long_03:0 "Государственный кредит"
 NW14_SOV_bolshevik_long_03_desc:0 "Банк направит ограниченные займы предприятиям, выполняющим плановые заказы."
 NW14_SOV_bolshevik_long_04:0 "Сеть отраслевых трестов"
 NW14_SOV_bolshevik_long_04_desc:0 "Родственные заводы объединят закупки и ремонт, сохранив учёт себестоимости."
 NW14_SOV_bolshevik_long_05:0 "План первого цикла"
 NW14_SOV_bolshevik_long_05_desc:0 "Плановый орган выберет несколько узких мест, вместо одновременного переустройства всей экономики."
 NW14_SOV_bolshevik_long_06:0 "Обязательства местных советов"
 NW14_SOV_bolshevik_long_06_desc:0 "Советы получат конкретные производственные цели и право сообщать о невыполнимых квотах."
 NW14_SOV_bolshevik_long_07:0 "Рабочие факультеты"
 NW14_SOV_bolshevik_long_07_desc:0 "Краткие курсы откроют техническое образование рабочим и подготовят кадры для новых предприятий."
 NW14_SOV_bolshevik_long_08:0 "Ликбез в губерниях"
 NW14_SOV_bolshevik_long_08_desc:0 "Школы и мобильные библиотеки увеличат грамотность и поддержку советских учреждений."
 NW14_SOV_bolshevik_long_09:0 "Электрические станции"
 NW14_SOV_bolshevik_long_09_desc:0 "Приоритетные сети дадут промышленным узлам энергию, потребовав крупных капиталовложений."
 NW14_SOV_bolshevik_long_10:0 "Железные дороги под единым учётом"
 NW14_SOV_bolshevik_long_10_desc:0 "Единый график перевозок распределит вагоны между армией, шахтами и городским продовольствием."
 NW14_SOV_bolshevik_long_11:0 "Политическая комиссия армии"
 NW14_SOV_bolshevik_long_11_desc:0 "Комиссары будут отвечать за связь армии с советским государством, не заменяя командиров в тактике."
 NW14_SOV_bolshevik_long_12:0 "Школа красных командиров"
 NW14_SOV_bolshevik_long_12_desc:0 "Курсы подготовят новое офицерство из ветеранов и рабочих, но не мгновенно заменят опытные кадры."
 NW14_SOV_bolshevik_long_13:0 "Профсоюзы при планировании"
 NW14_SOV_bolshevik_long_13_desc:0 "Отраслевые союзы будут участвовать в нормах труда и принимать ответственность за их выполнение."
 NW14_SOV_bolshevik_long_14:0 "Новая трудовая дисциплина"
 NW14_SOV_bolshevik_long_14_desc:0 "Сдельная оплата и гарантии снабжения должны повысить выпуск без сплошной чрезвычайщины."
 NW14_SOV_bolshevik_long_15:0 "Советы национальностей"
 NW14_SOV_bolshevik_long_15_desc:0 "Республики получат представительство при обсуждении языка, бюджета и распределения кадров."
 NW14_SOV_bolshevik_long_16:0 "Договор республик"
 NW14_SOV_bolshevik_long_16_desc:0 "Федеративные участники подтвердят общий рынок и армию при признании их местных советов."
 NW14_SOV_bolshevik_long_17:0 "Интернациональная связь"
 NW14_SOV_bolshevik_long_17_desc:0 "Москва предложит европейским рабочим партиям обмен опытом и материальную помощь через переговоры."
 NW14_SOV_bolshevik_long_18:0 "Союз советских республик"
 NW14_SOV_bolshevik_long_18_desc:0 "Центральные органы закрепят федерацию и первый план, оставив следующий цикл предметом нового обсуждения."
 NW14_SOV_black_long_01:0 "Клятва защитников"
 NW14_SOV_black_long_01_desc:0 "Черносотенные организации принесут присягу короне и будут объединены под единым политическим штабом."
 NW14_SOV_black_long_02:0 "Союз русского народа"
 NW14_SOV_black_long_02_desc:0 "Региональные отделения получат централизованное финансирование и инструкции."
 NW14_SOV_black_long_03:0 "Государственная печать"
 NW14_SOV_black_long_03_desc:0 "Лояльные издатели объяснят чрезвычайный курс угрозой распада и подрывной агитацией."
 NW14_SOV_black_long_04:0 "Проверка губернских властей"
 NW14_SOV_black_long_04_desc:0 "Губернаторы, уличённые в нелояльности, будут заменены назначенцами центра."
 NW14_SOV_black_long_05:0 "Имперская служба безопасности"
 NW14_SOV_black_long_05_desc:0 "Расширить надзор за подпольем, одновременно увеличив недовольство либералов и социалистов."
 NW14_SOV_black_long_06:0 "Союз престола и офицерства"
 NW14_SOV_black_long_06_desc:0 "Армейское командование поддержит режим в обмен на влияние при назначениях и бюджете."
 NW14_SOV_black_long_07:0 "Патриотические школы"
 NW14_SOV_black_long_07_desc:0 "Школы усилят государственную лояльность, но вытеснят местные языковые и образовательные инициативы."
 NW14_SOV_black_long_08:0 "Церковные попечительства"
 NW14_SOV_black_long_08_desc:0 "Приходы возьмут на себя благотворительность и станут каналом поддержки официальной идеологии."
 NW14_SOV_black_long_09:0 "Корпоративные палаты"
 NW14_SOV_black_long_09_desc:0 "Предпринимателей и лояльные профсоюзы сведут в управляемые государством отраслевые объединения."
 NW14_SOV_black_long_10:0 "Казённые трудовые контракты"
 NW14_SOV_black_long_10_desc:0 "Государственные заказы обеспечат заводы работой, усилив зависимость промышленников от кабинета."
 NW14_SOV_black_long_11:0 "Офицерский резерв"
 NW14_SOV_black_long_11_desc:0 "Союзы ветеранов помогут комплектовать новые части, но получат политическое влияние."
 NW14_SOV_black_long_12:0 "Единый внутренний фронт"
 NW14_SOV_black_long_12_desc:0 "Жандармерия, гарнизоны и губернаторы согласуют порядок действий при массовых протестах."
 NW14_SOV_black_long_13:0 "Пересмотр думских полномочий"
 NW14_SOV_black_long_13_desc:0 "Правительство ограничит контроль Думы над чрезвычайными расходами."
 NW14_SOV_black_long_14:0 "Дисциплина профсоюзов"
 NW14_SOV_black_long_14_desc:0 "Независимые союзы поставят под надзор, рискуя спровоцировать забастовки."
 NW14_SOV_black_long_15:0 "Преференции казённых заводов"
 NW14_SOV_black_long_15_desc:0 "Заказы направят верным предприятиям ради быстрого выпуска вооружений."
 NW14_SOV_black_long_16:0 "Положение о внутренней безопасности"
 NW14_SOV_black_long_16_desc:0 "Чрезвычайные меры станут законной нормой и ослабят возможность мирного оппонирования."
 NW14_SOV_black_long_17:0 "Централизованное хозяйство"
 NW14_SOV_black_long_17_desc:0 "Региональные бюджеты подчинят столичным приоритетам обороны и политического контроля."
 NW14_SOV_black_long_18:0 "Государство защитников трона"
 NW14_SOV_black_long_18_desc:0 "Черносотенный кабинет завершит перестройку режима вокруг монархии, армии и сил внутреннего надзора."
 NW14_SOV_crown_long_final:0 "Государство под защитой короны"
 NW14_SOV_crown_long_final_desc:0 "Двор, кабинет и губернские учреждения закрепят общий порядок управления. Монархия сохранит верховную власть, но больше не будет зависеть от одних придворных распоряжений."
 NW14_SOV_kirill_long_final:0 "Новая имперская доктрина"
 NW14_SOV_kirill_long_final_desc:0 "Кирилл завершит выбранный курс: армия получит ясные внешние ориентиры, а государство — управляемую систему приоритетов."
 NW14_SOV_sr_long_final:0 "Земская республика"
 NW14_SOV_sr_long_final_desc:0 "Учредительное собрание закрепит земельную реформу, федеративный договор и возможность смены правительства голосованием."
 NW14_SOV_menshevik_long_final:0 "Республика соглашения"
 NW14_SOV_menshevik_long_final_desc:0 "Профсоюзы, городские советы и парламентская коалиция будут разделять ответственность за реформы."
 NW14_SOV_bolshevik_long_final:0 "Центр революционного движения"
 NW14_SOV_bolshevik_long_final_desc:0 "Советы закрепят единый хозяйственный и военный курс, а Москва станет главным партнёром революционных движений Европы."
 NW14_SOV_black_long_final:0 "Железная корона"
 NW14_SOV_black_long_final_desc:0 "Режим защитников трона соединит монархический символ, армейскую поддержку и централизованный аппарат принуждения."
 NW14_SOV_national_reconstruction_01:0 "Сибирский транспортный комитет"
 NW14_SOV_national_reconstruction_01_desc:0 "Железнодорожники и губернаторы определят участки, где задержки мешают торговле и снабжению."
 NW14_SOV_national_reconstruction_02:0 "Мосты через Волгу"
 NW14_SOV_national_reconstruction_02_desc:0 "Усиление переправ соединит промышленные районы с зерновыми губерниями."
 NW14_SOV_national_reconstruction_03:0 "Транссибирские разъезды"
 NW14_SOV_national_reconstruction_03_desc:0 "Дополнительные разъезды повысят пропускную способность магистрали без строительства новой линии."
 NW14_SOV_national_reconstruction_04:0 "Ремонт паровозного парка"
 NW14_SOV_national_reconstruction_04_desc:0 "Мастерские получат запас деталей и смогут быстрее возвращать локомотивы в строй."
 NW14_SOV_national_reconstruction_05:0 "Уральские инженерные бюро"
 NW14_SOV_national_reconstruction_05_desc:0 "Региональные институты разработают оборудование, которое можно производить внутри страны."
 NW14_SOV_national_reconstruction_06:0 "Государственный заказ металлу"
 NW14_SOV_national_reconstruction_06_desc:0 "Стабильные заказы поддержат металлургию, но потребуют долгосрочных бюджетных обязательств."
 NW14_SOV_national_reconstruction_07:0 "Сибирская угольная разведка"
 NW14_SOV_national_reconstruction_07_desc:0 "Геологи оценят месторождения и подготовят инфраструктуру для их будущей разработки."
 NW14_SOV_national_reconstruction_08:0 "Сельские элеваторы"
 NW14_SOV_national_reconstruction_08_desc:0 "Новые склады сократят порчу зерна и облегчат снабжение городов."
 NW14_SOV_national_reconstruction_09:0 "Общероссийская почта"
 NW14_SOV_national_reconstruction_09_desc:0 "Единые тарифы и расписания ускорят связь между министерствами и окраинными управлениями."
 NW14_SOV_national_reconstruction_10:0 "Радиотелеграфные станции"
 NW14_SOV_national_reconstruction_10_desc:0 "Сеть связи сократит задержки военных донесений и торговых сводок."
 NW14_SOV_national_reconstruction_11:0 "Политехнические институты"
 NW14_SOV_national_reconstruction_11_desc:0 "Инженерное образование расширит кадровую базу промышленности и армии."
 NW14_SOV_national_reconstruction_12:0 "Лаборатории материаловедения"
 NW14_SOV_national_reconstruction_12_desc:0 "Испытания металлов и топлива помогут повысить надёжность оборудования."
 NW14_SOV_national_reconstruction_13:0 "Обновление арсеналов"
 NW14_SOV_national_reconstruction_13_desc:0 "Военные склады проведут инвентаризацию и пополнят наиболее востребованные запасы."
 NW14_SOV_national_reconstruction_14:0 "Манёвры на широком фронте"
 NW14_SOV_national_reconstruction_14_desc:0 "Штаб проверит снабжение и связь в условиях больших расстояний."
 NW14_SOV_national_reconstruction_15:0 "Моторные мастерские армии"
 NW14_SOV_national_reconstruction_15_desc:0 "Ремонтные подразделения подготовят парк грузовиков и полевых тягачей."
 NW14_SOV_national_reconstruction_16:0 "Военная авиационная школа"
 NW14_SOV_national_reconstruction_16_desc:0 "Лётные школы подготовят инструкторов и техников для расширения авиации."
 NW14_SOV_national_reconstruction_17:0 "Балтийская эскадра"
 NW14_SOV_national_reconstruction_17_desc:0 "Флот проверит готовность портов и распределение задач между кораблями."
 NW14_SOV_national_reconstruction_18:0 "Каспийские порты"
 NW14_SOV_national_reconstruction_18_desc:0 "Портовые работы улучшат связь Кавказа с внутренними рынками."
 NW14_SOV_national_reconstruction_19:0 "Дальневосточная торговая палата"
 NW14_SOV_national_reconstruction_19_desc:0 "Купцы и чиновники составят правила транзита и таможенного обмена в Азии."
 NW14_SOV_national_reconstruction_20:0 "Пограничная дипломатия"
 NW14_SOV_national_reconstruction_20_desc:0 "Россия предложит соседям консультации о транзите, чтобы снизить риск случайной эскалации."
 NW14_SOV_national_reconstruction_21:0 "Общий рынок губерний"
 NW14_SOV_national_reconstruction_21_desc:0 "Устранение внутренних пошлин упростит торговлю между регионами."
 NW14_SOV_national_reconstruction_22:0 "Казначейская ревизия"
 NW14_SOV_national_reconstruction_22_desc:0 "Проверка расходов высвободит средства для транспорта и образования."
 NW14_SOV_national_reconstruction_23:0 "Государственный страховой банк"
 NW14_SOV_national_reconstruction_23_desc:0 "Ссуды восстановят предприятия после аварий и пожаров, если владельцы выполняют аудит."
 NW14_SOV_national_reconstruction_24:0 "Техническая выставка в Петрограде"
 NW14_SOV_national_reconstruction_24_desc:0 "Показ отечественных разработок даст инженерам и промышленникам площадку для обмена опытом."

 nw14.71.t:0 "Мандат Учредительного собрания"
 nw14.71.d:0 "После окончания гражданской войны предстоит определить, какая сила получит право сформировать правительство. Эсеры требуют уважать крестьянское большинство; меньшевики предлагают коалицию и парламентский контроль; большевики считают, что решающая власть должна перейти Советам."
 nw14.71.a:0 "Передать мандат социалистам-революционерам"
 nw14.71.b:0 "Сформировать коалицию меньшевиков и умеренных"
 nw14.71.c:0 "Закрепить власть за большевистскими Советами"
 nw14.72.t:0 "Курс нового императора"
 nw14.72.d:0 "Кирилл Владимирович укрепил своё положение, но империя не может одновременно готовить экспансию и восстанавливать доверие внутри страны. Генеральный штаб настаивает на активной политике на рубежах; министры предлагают сначала довести до конца внутреннее восстановление."
 nw14.72.a:0 "Готовить решительное укрепление рубежей"
 nw14.72.b:0 "Сначала восстановить государство и доверие губерний"
 nw14.73.t:0 "Как объединить крестьянскую республику?"
 nw14.73.d:0 "Земельная реформа получила поддержку деревни, но теперь спор идёт о полномочиях областей. Федералисты требуют закрепить местное самоуправление; сторонники единого аграрного кабинета опасаются, что разрозненные решения сорвут реформу."
 nw14.73.a:0 "Сохранить сильные полномочия областей"
 nw14.73.b:0 "Подчинить реформу единому республиканскому центру"
NW14_SOV_economic_programme:0 "Государственный план восстановления"
NW14_SOV_economic_programme_desc:0 "Общие инвестиции в транспорт, промышленность и образование не зависят от того, какая политическая сила возглавит страну."
NW14_SOV_army_programme:0 "Реформирование сухопутных сил"
NW14_SOV_army_programme_desc:0 "Армия должна опираться на подготовленные штабы, снабжение и резерв, а не на разовые решения в час кризиса."
NW14_SOV_army_staff:0 "Штабная реформа"
NW14_SOV_army_staff_desc:0 "Новый штат Генерального штаба распределяет задачи и ответственность между корпусами."
NW14_SOV_army_artillery:0 "Артиллерийские школы"
NW14_SOV_army_artillery_desc:0 "Единые таблицы стрельбы и подготовка расчётов возвращают тяжёлым батареям решающую роль."
NW14_SOV_army_reserve:0 "Система подготовленного резерва"
NW14_SOV_army_reserve_desc:0 "Земские сборы и регулярные учения превращают мобилизационные списки в обученный резерв."
NW14_SOV_army_corps:0 "Корпусное управление"
NW14_SOV_army_corps_desc:0 "Корпуса получают устойчивую связь с округами и собственными службами снабжения."
NW14_SOV_army_logistics:0 "Снабжение по железным дорогам"
NW14_SOV_army_logistics_desc:0 "Военные перевозки заранее согласуются с пропускной способностью магистралей."
NW14_SOV_army_support:0 "Единый стандарт вооружения"
NW14_SOV_army_support_desc:0 "Арсеналы переходят на согласованные требования к винтовкам, пулемётам и боеприпасам."
NW14_SOV_army_manoeuvres:0 "Большие манёвры"
NW14_SOV_army_manoeuvres_desc:0 "Крупные окружные манёвры проверяют штабные планы до того, как их потребует война."
NW14_SOV_army_officers:0 "Академия командного состава"
NW14_SOV_army_officers_desc:0 "Военные училища связывают теорию, полевую практику и подготовку младших командиров."
NW14_SOV_army_mobilisation:0 "План мобилизационных округов"
NW14_SOV_army_mobilisation_desc:0 "Округа получают заранее назначенные маршруты, склады и ответственных за сбор частей."
NW14_SOV_army_command:0 "Единое командование армии"
NW14_SOV_army_command_desc:0 "Штабы, округа и учебные заведения работают по согласованной программе, рассчитанной на долгую модернизацию."
NW14_SOV_navy_programme:0 "Морская программа России"
NW14_SOV_navy_programme_desc:0 "Разные флоты России получат общие приоритеты и устойчивую систему подготовки, ремонта и связи."
NW14_SOV_navy_baltic:0 "Балтийская эскадра"
NW14_SOV_navy_baltic_desc:0 "Балтийский флот получает ясную задачу: прикрыть столицу и торговые подходы к ней."
NW14_SOV_navy_black_sea:0 "Черноморское командование"
NW14_SOV_navy_black_sea_desc:0 "Флот Чёрного моря готовится защищать побережье и поддерживать перевозки на юге."
NW14_SOV_navy_pacific:0 "Тихоокеанская эскадра"
NW14_SOV_navy_pacific_desc:0 "Дальний Восток перестаёт зависеть от случайного присутствия отдельных кораблей."
NW14_SOV_navy_shipyards:0 "Расширить судостроительные мощности"
NW14_SOV_navy_shipyards_desc:0 "Заказы распределяются между доступными верфями, чтобы флот не зависел от одного порта."
NW14_SOV_navy_escorts:0 "Охрана морских коммуникаций"
NW14_SOV_navy_escorts_desc:0 "Сопровождение торговых судов становится такой же штатной задачей, как и поиск противника."
NW14_SOV_navy_repair:0 "Ремонтная служба флота"
NW14_SOV_navy_repair_desc:0 "Плановый ремонт и снабжение экипажей продлевают срок службы кораблей."
NW14_SOV_navy_signals:0 "Морская радиосвязь"
NW14_SOV_navy_signals_desc:0 "Командование флотов получает общие правила радиосвязи и передачи разведданных."
NW14_SOV_navy_mines:0 "Школа минной войны"
NW14_SOV_navy_mines_desc:0 "Минные заграждения и траление становятся предметом систематической подготовки."
NW14_SOV_navy_staff:0 "Объединённый морской штаб"
NW14_SOV_navy_staff_desc:0 "Общий штаб согласует задачи Балтики, Чёрного моря и Тихого океана."
NW14_SOV_navy_command:0 "Объединённый морской штаб"
NW14_SOV_navy_command_desc:0 "Флоты сохраняют региональные задачи, но действуют по единому плану строительства и подготовки."
NW14_SOV_air_programme:0 "Воздушные силы нового поколения"
NW14_SOV_air_programme_desc:0 "Авиация соединит отечественное производство, подготовку экипажей и поддержку сухопутных войск."
NW14_SOV_air_office:0 "Главное управление авиации"
NW14_SOV_air_office_desc:0 "Разрозненные авиационные части получают единый порядок учёта, снабжения и подготовки."
NW14_SOV_air_engines:0 "Отечественные авиадвигатели"
NW14_SOV_air_engines_desc:0 "Заказы конструкторским бюро связывают требования лётчиков с возможностями заводов."
NW14_SOV_air_schools:0 "Школы военных лётчиков"
NW14_SOV_air_schools_desc:0 "Подготовка экипажей опирается на регулярный налёт и стандартизированную программу."
NW14_SOV_air_fighters:0 "Истребительная авиация"
NW14_SOV_air_fighters_desc:0 "Перехватчики и их наземное обслуживание получают приоритет в планировании закупок."
NW14_SOV_air_recon:0 "Воздушная разведка"
NW14_SOV_air_recon_desc:0 "Наблюдение с воздуха помогает штабам оценивать движение войск и состояние дорог."
NW14_SOV_air_bombers:0 "Бомбардировочная авиация"
NW14_SOV_air_bombers_desc:0 "Дальняя авиация развивается постепенно, с учётом дальности, двигателей и подготовки экипажей."
NW14_SOV_air_radio:0 "Связь с наземными частями"
NW14_SOV_air_radio_desc:0 "Корректировщики и авиачасти отрабатывают совместные действия с сухопутными штабами."
NW14_SOV_air_logistics:0 "Сеть аэродромного снабжения"
NW14_SOV_air_logistics_desc:0 "Запасные площадки и ремонтные команды снижают зависимость авиации от нескольких крупных баз."
NW14_SOV_air_doctrine:0 "Единая воздушная доктрина"
NW14_SOV_air_doctrine_desc:0 "Опыт частей и школ сводится в общие правила применения авиации."
NW14_SOV_air_command:0 "Главное командование авиации"
NW14_SOV_air_command_desc:0 "Управление авиацией объединяет лётные школы, конструкторские бюро и боевые части."
