l_russian:
 nw14_production:0 "Согласованные производственные цепочки"
 nw14_production_desc:0 "Единые стандарты и долгие контракты позволяют предприятиям планировать работу."
 nw14_trade:0 "Согласованные торговые правила"
 nw14_trade_desc:0 "Предсказуемые сборы облегчают торговлю, не отменяя национальную хозяйственную политику."
 nw14_labour:0 "Трудовой арбитраж"
 nw14_labour_desc:0 "Споры рассматриваются по установленной процедуре; организациям приходится соблюдать принятые решения."
 nw14_discipline:0 "Единая служебная подготовка"
 nw14_discipline_desc:0 "Совместные правила подготовки и снабжения повышают слаженность частей."
 nw14_agrarian:0 "Земельное посредничество"
 nw14_agrarian_desc:0 "Кредит и рассмотрение споров помогают хозяйствам пережить перемены."
 nw14_succession:0 "Установленный порядок преемства"
 nw14_succession_desc:0 "Ведомства знают, как передаются полномочия при смене монарха."
 nw14_crown_admin:0 "Ответственное управление короны"
 nw14_crown_admin_desc:0 "Сильная исполнительная власть требует постоянного содержания чиновничьего аппарата."
 nw14_democratic_admin:0 "Устоявшийся конституционный порядок"
 nw14_democratic_admin_desc:0 "Правительство действует в установленных пределах и может быть сменено законным путём."
 nw14_war_supply:0 "Чрезвычайная служба снабжения"
 nw14_war_supply_desc:0 "Ускоренное распределение запасов помогает фронту ценой нагрузки на гражданское хозяйство."
 nw14_expansion:0 "Приоритет имперской армии"
 nw14_expansion_desc:0 "Внешняя политика опирается на армию, получающую большую долю общих ресурсов."
 nw14_planned:0 "Приоритетное планирование"
 nw14_planned_desc:0 "Ключевые отрасли получают ресурсы раньше потребительского сектора."
 nw14_propaganda:0 "Верноподданная мобилизация"
 nw14_propaganda_desc:0 "Поддерживаемые режимом организации мобилизуют сторонников и усиливают политическую поляризацию."
 nw14_repression:0 "Чрезвычайные полномочия"
 nw14_repression_desc:0 "Принуждение ускоряет исполнение приказов и увеличивает расходы на содержание аппарата."
 nw14_black_admin:0 "Кабинет защитников трона"
 nw14_black_admin_desc:0 "Крайне правый кабинет использует монархическую символику для укрепления собственной власти."
 nw14_federal_admin:0 "Действующий федеральный договор"
 nw14_federal_admin_desc:0 "Полномочия корон определены соглашением, которое служит основой общих решений."
 NW14_research:0 "Национальная исследовательская программа"
 NW14_GER_red_reichstag:0 "Красный рейхстаг"
 NW14_GER_red_reichstag_desc:0 "Кайзер открывает сессию перед залом, в котором большинство принадлежит СДПГ и КПГ. Прежде чем спорить о будущем империи, кабинет должен доказать, что способен провести хотя бы бюджет."
 NW14_GER_committee_rules:0 "Регламент комиссий"
 NW14_GER_committee_rules_desc:0 "Мандаты дают право голоса, но не умение договариваться. Публичный порядок рассмотрения законов лишит канцелярию возможности прятать неудобные проекты."
 NW14_GER_budget_hearing:0 "Открыть бюджетные слушания"
 NW14_GER_budget_hearing_desc:0 "Расходы двора, армии и страховых касс впервые окажутся на одном столе. Голосование потребует большинства действующего рейхстага."
 NW14_GER_provincial_petitions:0 "Петиции из земель"
 NW14_GER_provincial_petitions_desc:0 "Баварские депутаты говорят о полномочиях земель, прусские — о порядке. Выслушав их сейчас, мы избежим разговора через баррикады."
 NW14_GER_shop_stewards:0 "Фабричные старосты"
 NW14_GER_shop_stewards_desc:0 "Рабочие хотят участвовать в обсуждении условий труда. Дать им законный канал влияния дешевле, чем останавливать каждый завод полицией."
 NW14_GER_prussian_officers:0 "Разговор с прусским корпусом"
 NW14_GER_prussian_officers_desc:0 "Офицеры присягали монарху, а жалованье им утверждает парламент. Пора объяснить, почему эти обязательства пока не противоречат друг другу."
 NW14_GER_italian_question:0 "Итальянский вопрос"
 NW14_GER_italian_question_desc:0 "ИСР предлагает германским рабочим солидарность. Для одних это помощь товарищам, для других — приглашение повторить итальянскую революцию дома."
 NW14_GER_press_arbitration:0 "Комиссия по печати"
 NW14_GER_press_arbitration_desc:0 "Газеты уже делят страну на предателей и спасителей. Независимое разбирательство позволит снять часть обвинений без закрытия редакций."
 NW14_GER_federal_audience:0 "Аудиенция представителей земель"
 NW14_GER_federal_audience_desc:0 "Берлин не исчерпывает собой Германию. Правительства земель должны услышать, что столичный кризис не отменяет их законных полномочий."
 NW14_GER_choose_course:0 "Кому принадлежит последнее слово?"
 NW14_GER_choose_course_desc:0 "Совместное управление держалось на недоговорённостях. Теперь придётся решить, определяет ли политику корона, парламент или революционная улица."
 NW14_GER_for_kaiser:0 "За Кайзера!"
 NW14_GER_for_kaiser_desc:0 "Гогенцоллерны не намерены превращаться в подпись под чужими решениями. Мы начнём собирать блок восстановления коронных полномочий."
 NW14_GER_court_cabinet:0 "Кабинет доверия короны"
 NW14_GER_court_cabinet_desc:0 "Кайзер назначит министров, готовых отвечать перед дворцом. Рейхстаг воспримет это как прямой вызов своему большинству."
 NW14_GER_national_conservatives:0 "Соглашение с НННП"
 NW14_GER_national_conservatives_desc:0 "Национал-консерваторам нужны защита землевладения и сильная исполнительная власть. Их семьдесят голосов станут опорой нового кабинета."
 NW14_GER_centre_guarantees:0 "Гарантии католическим землям"
 NW14_GER_centre_guarantees_desc:0 "Центр не подпишет пустой чек прусской бюрократии. Сохраним конфессиональные школы и права земель в обмен на поддержку кабинета."
 NW14_GER_progressive_bargain:0 "Сделка с прогрессистами"
 NW14_GER_progressive_bargain_desc:0 "Предприниматели готовы терпеть сильную корону, если суды и договоры останутся неприкосновенны. Уступка дорогая, но необходимая."
 NW14_GER_emergency_session:0 "Чрезвычайная сессия"
 NW14_GER_emergency_session_desc:0 "Даже собранный правый блок не располагает большинством. Дворец открыто обойдёт парламент чрезвычайным указом; спокойного исхода никто не обещает."
 NW14_GER_officer_oath:0 "Обновить офицерскую присягу"
 NW14_GER_officer_oath_desc:0 "Командование получит недвусмысленный приказ подчиняться короне. Это укрепит вертикаль и оттолкнёт часть солдатских комитетов."
 NW14_GER_ban_kpd:0 "Запретить КПГ"
 NW14_GER_ban_kpd_desc:0 "Запрет коммунистической партии лишит её депутатов мандатов, но не убеждений. Освободившиеся кресла останутся вакантными, а подполье станет опаснее."
 NW14_GER_split_unions:0 "Разделить профсоюзы"
 NW14_GER_split_unions_desc:0 "Лояльным союзам предложат арбитраж и страховые фонды. Непримиримые организации лишатся легальных касс."
 NW14_GER_ban_spd:0 "Запретить СДПГ"
 NW14_GER_ban_spd_desc:0 "Последняя крупная легальная оппозиция будет закрыта. Режим получит свободу действий ценой окончательного разрыва с парламентской практикой."
 NW14_GER_crown_budget:0 "Коронный бюджет"
 NW14_GER_crown_budget_desc:0 "Оставшиеся депутаты не смогут заблокировать расходы кабинета. Ускоренное управление требует дополнительного чиновничьего аппарата."
 NW14_GER_land_compact:0 "Соглашение с князьями"
 NW14_GER_land_compact_desc:0 "Земли сохранят свои дворы и местное управление, признав первенство Берлина. Единообразие уступит место личным обязательствам."
 NW14_GER_imperial_inspection:0 "Имперская инспекция"
 NW14_GER_imperial_inspection_desc:0 "Военные заказы слишком долго распределялись по знакомству. Инспекторы двора проверят сроки поставок и качество стали."
 NW14_GER_heir_council:0 "Совет престолонаследия"
 NW14_GER_heir_council_desc:0 "Возраст Вильгельма делает вопрос преемства практическим. Совет закрепит порядок передачи власти, не позволяя наследникам собирать собственные кабинеты."
 NW14_GER_controlled_reichstag:0 "Укрощённый Красный рейхстаг"
 NW14_GER_controlled_reichstag_desc:0 "Палата сохранит название и процедуру, но утратит право менять правительство. Династия победила в кризисе; доверие рабочих придётся восстанавливать годами."
 NW14_GER_italian_solidarity:0 "Коммунисты у власти"
 NW14_GER_italian_solidarity_desc:0 "КПГ требует признать итальянскую революцию образцом для Германии. Для социал-демократических министров это означает разрыв с монархическим компромиссом."
 NW14_GER_coalition_break:0 "Раскол красной коалиции"
 NW14_GER_coalition_break_desc:0 "Общий бюджет больше не скрепляет партии. КПГ покинет правительственный блок; следующий законопроект встретит зал без устойчивого большинства."
 NW14_GER_independent_socialists:0 "Независимые социал-демократы"
 NW14_GER_independent_socialists_desc:0 "Левое крыло СДПГ отвергает дисциплину кабинета. Шестьдесят депутатов образуют НСДПГ, сохраняя свои избирательные мандаты."
 NW14_GER_workers_pact:0 "Союз НСДПГ и КПГ"
 NW14_GER_workers_pact_desc:0 "Независимые социалисты и коммунисты создадут единый комитет действий. Их парламентское меньшинство станет организационным ядром революции."
 NW14_GER_factory_cells:0 "Комитеты на предприятиях"
 NW14_GER_factory_cells_desc:0 "Стачка без снабжения быстро превращается в голод. Заводские комитеты займутся связью, продовольствием и учётом добровольцев."
 NW14_GER_railway_cells:0 "Связь железнодорожников"
 NW14_GER_railway_cells_desc:0 "Железная дорога решит, какие города смогут помочь друг другу. Подготовим связных и договоримся о перевозках до начала выступления."
 NW14_GER_soldier_delegates:0 "Делегаты гарнизонов"
 NW14_GER_soldier_delegates_desc:0 "Без солдатского участия восстание останется городской демонстрацией. Контакты в гарнизонах увеличат долю армии на стороне революции."
 NW14_GER_general_strike:0 "Всеобщая стачка"
 NW14_GER_general_strike_desc:0 "Рабочие остановят производство, требуя ухода коронного кабинета. Это последняя ступень перед вооружённым столкновением."
 NW14_GER_revolution_hour:0 "Час революции"
 NW14_GER_revolution_hour_desc:0 "Начнётся многосторонняя война: монархисты, революционеры, баварские сепаратисты и польское движение будут бороться друг с другом. Франция воспользуется кризисом в Эльзасе."
 NW14_GER_red_supply:0 "Красные эшелоны"
 NW14_GER_red_supply_desc:0 "Политическая верность не заменяет патронов. Единую службу снабжения подчиним военному комитету, сохранив контроль рабочих комиссий."
 NW14_GER_reunion_congress:0 "Съезд воссоединения"
 NW14_GER_reunion_congress_desc:0 "После прекращения внутренних войн делегаты земель смогут обсуждать новую Германию. Военный мандат нельзя бессрочно выдавать за народное согласие."
 NW14_GER_revolution_bureau:0 "Бюро европейских революций"
 NW14_GER_revolution_bureau_desc:0 "Опыт борьбы можно передавать через печать, профсоюзы и инструкторов. Бюро получит ограниченный фонд операций, а зарубежные движения сохранят собственные интересы."
 NW14_GER_italian_conference:0 "Конференция с ИСР"
 NW14_GER_italian_conference_desc:0 "Италия была примером, но не станет нашим начальником. Предложим равноправный революционный союз и оставим Риму право отказаться."
 NW14_GER_underground_schools:0 "Школы подпольной работы"
 NW14_GER_underground_schools_desc:0 "Обучение связных позволит действовать за границей дольше и осторожнее. Подготовка требует средств, а не одного красивого лозунга."
 NW14_GER_european_red_pole:0 "Красный полюс Европы"
 NW14_GER_european_red_pole_desc:0 "Германия располагает промышленностью, которой не хватало прежним революционным движениям. Постоянный международный фонд сделает её организатором европейского левого движения."
 NW14_GER_stabilisation:0 "Стабилизация"
 NW14_GER_stabilisation_desc:0 "Империя может пережить кризис без нового хозяина. Начнём переговоры о кабинете, который отвечает перед парламентом и сохраняет монарха."
 NW14_GER_common_minimum:0 "Общий минимум левых"
 NW14_GER_common_minimum_desc:0 "Социальное страхование и законность важнее спора о последней странице программы. Министры согласуют перечень обязательств, от которых не смогут отказаться поодиночке."
 NW14_GER_centre_dialogue:0 "Диалог с Центром"
 NW14_GER_centre_dialogue_desc:0 "Без католических земель конституционная реформа останется прусским спором. Гарантии местного управления приведут Центр в коалицию."
 NW14_GER_progressive_dialogue:0 "Прогрессисты за реформу"
 NW14_GER_progressive_dialogue_desc:0 "Независимый суд и предсказуемый бюджет дадут либералам причину поддержать новое устройство. Они потребуют реальных ограничений кабинета."
 NW14_GER_labour_courts:0 "Трудовые суды"
 NW14_GER_labour_courts_desc:0 "Трудовой конфликт должен заканчиваться решением суда, а не вооружённым оцеплением. Учредим совместное представительство рабочих и работодателей."
 NW14_GER_party_mediation:0 "Примирительная комиссия СДПГ"
 NW14_GER_party_mediation_desc:0 "Умеренные и радикальные социалисты должны договориться о правилах внутреннего спора. Иначе объединение лишь перенесёт раскол в одну большую партию."
 NW14_GER_kpd_legalism:0 "КПГ принимает парламентский путь"
 NW14_GER_kpd_legalism_desc:0 "Коммунисты откажутся от подготовки вооружённого захвата власти в обмен на сохранение законной политической деятельности. Это условие будущего слияния."
 NW14_GER_unity_congress:0 "Объединительный съезд"
 NW14_GER_unity_congress_desc:0 "После программного соглашения депутаты КПГ войдут в объединённую социал-демократическую фракцию. Их места сохранятся; парламентская арифметика останется честной."
 NW14_GER_responsible_ministry:0 "Ответственное министерство"
 NW14_GER_responsible_ministry_desc:0 "Конституционное большинство закрепит зависимость кабинета от доверия рейхстага. Монарх сохранит престол, утратив право править вопреки палате."
 NW14_GER_crown_under_law:0 "Корона под законом"
 NW14_GER_crown_under_law_desc:0 "Двор, армия и канцелярия получат ясные пределы полномочий. Присяга государю больше не освобождает чиновника от ответственности перед судом."
 NW14_GER_pan_europe:0 "Панъевропейский союз"
 NW14_GER_pan_europe_desc:0 "Европейским демократиям нужна общая площадка безопасности. Учредим союз добровольного членства, а не очередную германскую систему подчинения."
 NW14_GER_small_state_guarantees:0 "Гарантии малым государствам"
 NW14_GER_small_state_guarantees_desc:0 "Союз будет убедителен лишь тогда, когда малые участники смогут говорить на равных. Предложим гарантии парламентским государствам Европы."
 NW14_GER_common_tariffs:0 "Переговоры о тарифах"
 NW14_GER_common_tariffs_desc:0 "Общее экономическое пространство не создаётся приказом Берлина. Подготовим взаимное снижение барьеров без отмены национальных бюджетов."
 NW14_GER_joint_defence:0 "Совместный оборонный штаб"
 NW14_GER_joint_defence_desc:0 "Участники союза согласуют железнодорожные перевозки и штабную связь. Каждая армия сохранит национальное командование."
 NW14_GER_peaceful_reich:0 "Империя парламентского мира"
 NW14_GER_peaceful_reich_desc:0 "Старый титул пережил новую конституцию. Теперь сила Германии измеряется не числом зависимых дворов, а устойчивостью собственных институтов."
 NW14_GER_ruhr_audit:0 "Аудит Рура"
 NW14_GER_ruhr_audit_desc:0 "Статистика концернов скрывает слабые места производства. Проверим загрузку заводов прежде, чем выдавать новые субсидии."
 NW14_GER_machine_tools:0 "Станки для среднего предприятия"
 NW14_GER_machine_tools_desc:0 "Средние фирмы способны выполнять сложные заказы, если имеют доступ к оборудованию. Кредитная программа расширит промышленную базу."
 NW14_GER_electrical_grid:0 "Единая электрическая сеть"
 NW14_GER_electrical_grid_desc:0 "Несогласованные сети делают дешёвую энергию дорогой на границе земли. Государство оплатит узлы, которыми смогут пользоваться разные поставщики."
 NW14_GER_chemical_labs:0 "Химические лаборатории"
 NW14_GER_chemical_labs_desc:0 "Красители, удобрения и синтетическое сырьё нужны мирной экономике не меньше армии. Свяжем университеты с промышленными испытаниями."
 NW14_GER_colonial_accounts:0 "Колониальные счета"
 NW14_GER_colonial_accounts_desc:0 "Администрации должны показывать, куда уходят доходы портов и железных дорог. Прозрачность сократит потери, хотя вызовет сопротивление концессионеров."
 NW14_GER_training_contracts:0 "Контракты подготовки кадров"
 NW14_GER_training_contracts_desc:0 "Новый завод бесполезен без квалифицированных рабочих. Предприятия получат поддержку при условии открытия оплачиваемых ученических мест."
 NW14_GER_arsenal_network:0 "Сеть арсеналов"
 NW14_GER_arsenal_network_desc:0 "Армия не должна зависеть от одного промышленного района. Распределим часть заказов между несколькими землями."
 NW14_GER_rail_mobilisation:0 "Железнодорожная мобилизация"
 NW14_GER_rail_mobilisation_desc:0 "Учения выявят узкие места перевозок до войны. Штабы получат расписания, согласованные с гражданскими операторами."
 NW14_GER_artillery_standards:0 "Стандартизация артиллерии"
 NW14_GER_artillery_standards_desc:0 "Разные боеприпасы превращают снабжение в лотерею. Новые контракты будут требовать совместимости с принятыми армией стандартами."
 NW14_GER_motor_trials:0 "Испытания моторизованных колонн"
 NW14_GER_motor_trials_desc:0 "Грузовик хорош на заводском дворе и гораздо хуже на просёлке. Испытаем реальные маршруты и построим систему ремонта."
 NW14_GER_naval_estimates:0 "Морская смета"
 NW14_GER_naval_estimates_desc:0 "Флот открытого моря требует средств даже в мирное время. Сравним стоимость кораблей с задачами охраны торговли и колониальных сообщений."
 NW14_GER_kiel_yards:0 "Верфи Киля"
 NW14_GER_kiel_yards_desc:0 "Постоянная очередь заказов позволит верфям удержать специалистов. Новые мощности предназначены и для ремонта, который обычно откладывают."
 NW14_GER_air_observation:0 "Воздушное наблюдение"
 NW14_GER_air_observation_desc:0 "Самолёт должен передавать сведения быстрее конного связного. Отработаем совместные учения авиации и сухопутных штабов."
 NW14_GER_university_contracts:0 "Университетские контракты"
 NW14_GER_university_contracts_desc:0 "Исследователям нужны долгие программы, а не ежегодная борьба за ассигнования. Откроем дополнительную государственную исследовательскую линию."
 NW14_GER_continental_workshop:0 "Мастерская континента"
 NW14_GER_continental_workshop_desc:0 "Сила промышленной Германии — в сочетании лабораторий, квалификации и инфраструктуры. Закрепим систему, переживающую смену кабинетов."
 NW14_SOV_winter_palace:0 "Зима в Петрограде"
 NW14_SOV_winter_palace_desc:0 "Империя вступает в новый год с огромными возможностями и тревожными дворцовыми слухами. Состояние Алексея II стало вопросом государственного управления."
 NW14_SOV_medical_council:0 "Врачебный консилиум"
 NW14_SOV_medical_council_desc:0 "Слухи нельзя лечить указом. Соберём врачей и наладим регулярные бюллетени, не обещая подданным чудесного исцеления."
 NW14_SOV_ministers_report:0 "Доклады министров"
 NW14_SOV_ministers_report_desc:0 "Пока государь болен, ведомства откладывают спорные решения. Единый график докладов позволит отличить действительную осторожность от саботажа."
 NW14_SOV_zemstvo_register:0 "Реестр земских нужд"
 NW14_SOV_zemstvo_register_desc:0 "Губернии просят школы, дороги и врачей, а столица получает лишь итоговые суммы. Открытый реестр покажет, какие расходы действительно доходят до мест."
 NW14_SOV_railway_review:0 "Ревизия магистралей"
 NW14_SOV_railway_review_desc:0 "Территория империи велика, но расстояние само по себе не является преимуществом. Проверим пропускную способность узлов и ремонтные запасы."
 NW14_SOV_army_delegation:0 "Делегация армии"
 NW14_SOV_army_delegation_desc:0 "Командиры должны знать, кому подчиняться при ухудшении здоровья царя. Подтверждение единой цепи командования снизит опасность самовольных решений."
 NW14_SOV_duma_audience:0 "Выслушать Думу"
 NW14_SOV_duma_audience_desc:0 "Дума не получила верховной власти, но представляет организованные интересы страны. Её предложения помогут понять цену дальнейшего молчания."
 NW14_SOV_provincial_press:0 "Губернская печать"
 NW14_SOV_provincial_press_desc:0 "Когда официальная газета ничего не сообщает, место новости занимает слух. Разрешим обсуждение хозяйственных проблем без обещания смены государственного строя."
 NW14_SOV_succession_memorandum:0 "Записка о престолонаследии"
 NW14_SOV_succession_memorandum_desc:0 "Кирилл Владимирович — двоюродный брат Николая II и один из династических претендентов. В этом сценарии его возвышение потребует отдельного решения двора."
 NW14_SOV_russian_crossroads:0 "Развилка империи"
 NW14_SOV_russian_crossroads_desc:0 "Болезнь монарха обнажила спор о власти. Сохранить самодержавие, передать корону, поднять республиканское движение или опереться на крайних правых — совместить эти ответы нельзя."
 NW14_SOV_save_alexei:0 "Царь должен выздороветь"
 NW14_SOV_save_alexei_desc:0 "Сделаем лечение и преемственность управления главным делом кабинета. Успех потребует устойчивой врачебной помощи, а не только придворного оптимизма."
 NW14_SOV_quiet_residence:0 "Тихая резиденция"
 NW14_SOV_quiet_residence_desc:0 "Ограничим церемонии и бесконечные приёмы. Решения будут поступать через узкий круг министров, чтобы лечение не останавливалось ради очередного доклада."
 NW14_SOV_clinical_service:0 "Императорская медицинская служба"
 NW14_SOV_clinical_service_desc:0 "Постоянная служба снабжения и наблюдения даст врачам возможность работать последовательно. Этот опыт затем пригодится губернским больницам."
 NW14_SOV_delegated_signature:0 "Делегированная подпись"
 NW14_SOV_delegated_signature_desc:0 "Часть текущих полномочий перейдёт министрам под установленную ответственность. Самодержавие сохранится, но перестанет зависеть от физического присутствия царя в каждом деле."
 NW14_SOV_recovery_bulletin:0 "Бюллетень о выздоровлении"
 NW14_SOV_recovery_bulletin_desc:0 "Врачи подтверждают устойчивое улучшение. Государь вернётся к работе постепенно; болезнь больше не будет служить основанием для борьбы за престол."
 NW14_SOV_ministerial_charter:0 "Положение о министерствах"
 NW14_SOV_ministerial_charter_desc:0 "Министры получат чёткие обязанности и возможность возражать друг другу по установленной процедуре. Последнее решение останется за императором."
 NW14_SOV_zemstvo_supervision:0 "Земский надзор"
 NW14_SOV_zemstvo_supervision_desc:0 "Местные представители смогут проверять расходование назначенных средств. Это контроль управления, а не отмена верховной власти."
 NW14_SOV_agrarian_mediation:0 "Посредники в земельных спорах"
 NW14_SOV_agrarian_mediation_desc:0 "Крестьянский иск не должен годами лежать между двумя канцеляриями. Посредники получат полномочия ускорять соглашения без всеобщего передела."
 NW14_SOV_dominion_charters:0 "Подтвердить грамоты доминионов"
 NW14_SOV_dominion_charters_desc:0 "Польский сейм и финляндский сенат получат подтверждение своих прав. Стабильная договорённость полезнее периодического устрашения."
 NW14_SOV_measured_autocracy:0 "Самодержавие установленных правил"
 NW14_SOV_measured_autocracy_desc:0 "Монарх остаётся верховным арбитром, но ведомственный произвол становится труднее оправдать его именем. Империя выбрала внутреннее укрепление."
 NW14_SOV_regency_council:0 "Регентский совет"
 NW14_SOV_regency_council_desc:0 "Двор готовит управление на случай смерти Алексея. Сторонники Кирилла видят в регентстве путь к более решительной внешней политике."
 NW14_SOV_dynastic_compact:0 "Династическое соглашение"
 NW14_SOV_dynastic_compact_desc:0 "Претенденту недостаточно родства: нужны признание двора и поддержка командования. Зафиксируем порядок передачи престола до открытия наследства."
 NW14_SOV_last_bulletin:0 "Последний бюллетень"
 NW14_SOV_last_bulletin_desc:0 "Болезнь берёт верх. Смерть Алексея и вступление Кирилла завершат спор внутри двора, но не устранят недовольство за его стенами."
 NW14_SOV_imperial_colours:0 "Вернуть имперские цвета"
 NW14_SOV_imperial_colours_desc:0 "Чёрно-жёлто-белое полотнище станет знаком нового царствования. Возвращение старого символа будет открыто объявленным политическим выбором Кирилла."
 NW14_SOV_frontier_staff:0 "Штаб пограничной политики"
 NW14_SOV_frontier_staff_desc:0 "Экспансия требует карт, снабжения и расчёта сопротивления. Создадим штаб, который будет готовить ограниченные операции, а не обещать лёгкое господство."
 NW14_SOV_persian_concessions:0 "Персидские концессии"
 NW14_SOV_persian_concessions_desc:0 "Расширение северных концессий усилит российское влияние. Если Тегеран отвергнет давление, спор может стать поводом для войны."
 NW14_SOV_straits_claim:0 "Право голоса в Проливах"
 NW14_SOV_straits_claim_desc:0 "Петроград вновь заявит, что режим Проливов затрагивает жизненные интересы империи. Претензия откроет возможность силовой политики, но не подарит чужую землю."
 NW14_SOV_eastern_audit:0 "Ревизия восточных опор"
 NW14_SOV_eastern_audit_desc:0 "Монголия и Восточный Туркестан обеспечивают глубину влияния. Усилим связь и снабжение, не превращая союзных правителей в пустые вывески."
 NW14_SOV_mobilisation_depots:0 "Склады имперской армии"
 NW14_SOV_mobilisation_depots_desc:0 "Новая внешняя политика должна опираться на реальные запасы. Дополнительный арсенал снизит зависимость от петроградских заводов."
 NW14_SOV_kirills_empire:0 "Империя Кирилла"
 NW14_SOV_kirills_empire_desc:0 "Новый государь связывает престиж короны с активной внешней политикой. Армия получает приоритет, а гражданское хозяйство платит за него частью ресурсов."
 NW14_SOV_for_republic:0 "За республику!"
 NW14_SOV_for_republic_desc:0 "Эсеры и социал-демократы начнут готовить совместное выступление. Болезнь царя делает двор уязвимым, но не превращает всю страну в сторонника революции."
 NW14_SOV_sr_network:0 "Сети эсеров"
 NW14_SOV_sr_network_desc:0 "Земские деятели и крестьянские организаторы свяжут столицу с уездами. Их поддержка увеличит готовность будущего восстания."
 NW14_SOV_rsdlp_network:0 "Комитеты РСДРП"
 NW14_SOV_rsdlp_network_desc:0 "Меньшевики и большевики пока готовы работать вместе против самодержавия. Общая сеть не отменяет будущего спора о власти."
 NW14_SOV_railway_contacts:0 "Связные на железных дорогах"
 NW14_SOV_railway_contacts_desc:0 "Если гарнизоны останутся изолированы, двор сможет подавлять выступления по очереди. Связные подготовят координацию столицы и крупных узлов."
 NW14_SOV_soldiers_councils:0 "Солдатские советы"
 NW14_SOV_soldiers_councils_desc:0 "Агитаторы добьются поддержки части гарнизонов. Военная подготовка определит, сколько сил останется с революцией в день раскола."
 NW14_SOV_funeral_uprising:0 "Восстание в день похорон"
 NW14_SOV_funeral_uprising_desc:0 "Смерть Алексея станет сигналом выступления. Монархический центр, донское командование, украинское движение и сибирские областники создадут собственные власти; начнётся многосторонняя война."
 NW14_SOV_provisional_food:0 "Продовольствие Временного правительства"
 NW14_SOV_provisional_food_desc:0 "Голод способен уничтожить революционную власть быстрее фронта. Организуем учёт и подвоз хлеба, сохранив оплату поставщикам."
 NW14_SOV_front_delegates:0 "Фронтовые делегаты"
 NW14_SOV_front_delegates_desc:0 "Военное командование должно слышать части, но не превращать каждый приказ в митинг. Делегатам отведут канал жалоб и снабженческих запросов."
 NW14_SOV_constituent_rolls:0 "Списки Учредительного собрания"
 NW14_SOV_constituent_rolls_desc:0 "Война не должна сделать временную власть вечной. Начнём регистрацию избирателей там, где прекращены боевые действия."
 NW14_SOV_republican_congress:0 "Кому доверить республику?"
 NW14_SOV_republican_congress_desc:0 "После завершения внутренних войн временный союз распадётся на программы. Эсеры, меньшевики и большевики предложат разные ответы на вопрос о земле и власти."
 NW14_SOV_sr_majority:0 "Большинство эсеров"
 NW14_SOV_sr_majority_desc:0 "Крестьянская партия получит мандат на демократическую республику. Её власть будет зависеть от выборов, а не от бессрочного революционного исключения."
 NW14_SOV_land_committees:0 "Выборные земельные комитеты"
 NW14_SOV_land_committees_desc:0 "Земельный вопрос перейдёт от вооружённых отрядов к местным выборным органам. Потребуются оценка хозяйств и возможность обжалования."
 NW14_SOV_cooperative_credit:0 "Кооперативный кредит"
 NW14_SOV_cooperative_credit_desc:0 "Без оборотных средств новый собственник останется должником перекупщика. Кооперативные кассы обеспечат закупку инвентаря и посевного материала."
 NW14_SOV_rural_school:0 "Школа в уезде"
 NW14_SOV_rural_school_desc:0 "Республике нужны грамотные избиратели и специалисты. Расширение сельской школы станет долгосрочной инвестицией, а не военной кампанией."
 NW14_SOV_peasant_republic:0 "Крестьянская республика"
 NW14_SOV_peasant_republic_desc:0 "Учредительный порядок соединит местное самоуправление с общенациональным парламентом. Земельная реформа получит правовое завершение."
 NW14_SOV_menshevik_centre:0 "Меньшевистский центр"
 NW14_SOV_menshevik_centre_desc:0 "Меньшевики предложат парламентскую рабочую республику и коалицию с умеренными силами. Между красной диктатурой и реставрацией останется пространство для компромисса."
 NW14_SOV_labour_compromise:0 "Трудовой компромисс"
 NW14_SOV_labour_compromise_desc:0 "Рабочее представительство получит гарантии, предприятия — правила разрешения споров. Стороны заплатят частью свободы действий за предсказуемость."
 NW14_SOV_municipal_federation:0 "Союз городского самоуправления"
 NW14_SOV_municipal_federation_desc:0 "Городские думы возьмут на себя жильё, транспорт и коммунальное хозяйство. Центральное правительство установит общие финансовые правила."
 NW14_SOV_mixed_economy:0 "Смешанное хозяйство"
 NW14_SOV_mixed_economy_desc:0 "Ключевые предприятия останутся под общественным контролем, мелкое производство сохранит частную инициативу. Эта система потребует честного арбитража."
 NW14_SOV_constitutional_socialism:0 "Социализм конституционного пути"
 NW14_SOV_constitutional_socialism_desc:0 "Правительство признает право избирателя сменить социалистов у власти. Защита труда будет закреплена законом, а не принадлежностью к партии."
 NW14_SOV_bolshevik_majority:0 "Большевистский перевес"
 NW14_SOV_bolshevik_majority_desc:0 "Большевики добьются передачи власти советскому центру. Оппозиция увидит в этом подмену Учредительного собрания новой монополией."
 NW14_SOV_central_plan:0 "Первый хозяйственный план"
 NW14_SOV_central_plan_desc:0 "Плановый орган сосредоточит ресурсы на избранных отраслях. Ускорение тяжёлой промышленности ограничит возможности потребительского сектора."
 NW14_SOV_red_command:0 "Единое красное командование"
 NW14_SOV_red_command_desc:0 "Военный совет ликвидирует самостоятельность партийных отрядов. Революционная армия получит общее снабжение и дисциплину."
 NW14_SOV_revolutionary_links:0 "Связь европейских революций"
 NW14_SOV_revolutionary_links_desc:0 "Новая Россия предложит германским и итальянским коммунистам сотрудничество. Союз станет результатом переговоров, а не автоматическим подчинением."
 NW14_SOV_soviet_federation:0 "Советская федерация"
 NW14_SOV_soviet_federation_desc:0 "Центр оформит общие хозяйственные и военные органы. Местные советы сохранят административную роль в рамках единой партийной власти."
 NW14_SOV_black_hundreds:0 "Чёрная сотня"
 NW14_SOV_black_hundreds_desc:0 "Ультраправые организации обещают восстановить порядок и защитить трон от врагов. Их приход к власти усилит принуждение и сузит пространство законной политики."
 NW14_SOV_union_of_people:0 "Союз русского народа"
 NW14_SOV_union_of_people_desc:0 "Местные союзы получат общий штаб и казённую поддержку. Личная преданность станет важнее прежней независимости организаций."
 NW14_SOV_loyal_press:0 "Верноподданная печать"
 NW14_SOV_loyal_press_desc:0 "Поддерживаемые государством издания будут объяснять кризис деятельностью внутренних противников. Это укрепит мобилизацию сторонников и усилит раскол общества."
 NW14_SOV_court_guardians:0 "Опекуны престола"
 NW14_SOV_court_guardians_desc:0 "Крайне правый кабинет возьмёт на себя управление при больном царе. Формальное почитание монарха будет соседствовать с фактической властью его защитников."
 NW14_SOV_exceptional_statute:0 "Чрезвычайное положение"
 NW14_SOV_exceptional_statute_desc:0 "Аресты и запреты ускорят подавление оппозиции. Государственный аппарат получит полномочия, которые будет трудно отменить после кризиса."
 NW14_SOV_national_corporations:0 "Национальные корпорации"
 NW14_SOV_national_corporations_desc:0 "Работодателей и лояльные союзы сведут в подконтрольные государству объединения. Независимое представительство труда будет вытеснено."
 NW14_SOV_officer_leagues:0 "Офицерские союзы"
 NW14_SOV_officer_leagues_desc:0 "Правые организации в армии станут кадровой опорой режима. Политический отбор укрепит лояльность, но уменьшит свободу профессионального спора."
 NW14_SOV_forced_centralisation:0 "Принудительная централизация"
 NW14_SOV_forced_centralisation_desc:0 "Губернии лишатся части свободы распределения средств. Центр сможет действовать быстрее, принимая на себя недовольство местных обществ."
 NW14_SOV_arsenals_of_order:0 "Арсеналы порядка"
 NW14_SOV_arsenals_of_order_desc:0 "Внутренняя безопасность и армия получат приоритет в закупках. Военный заказ обеспечит загрузку нового предприятия."
 NW14_SOV_guardians_regime:0 "Режим защитников трона"
 NW14_SOV_guardians_regime_desc:0 "Двор сохранит символическое первенство, но решения будут проходить через правый кабинет. Новое государство открыто ставит порядок выше политических свобод."
 NW14_SOV_ural_workshops:0 "Уральские мастерские"
 NW14_SOV_ural_workshops_desc:0 "Развитие внутренних промышленных районов уменьшит зависимость от столичных узлов. Начнём с оборудования, которое можно обслуживать на месте."
 NW14_SOV_siberian_nodes:0 "Сибирские узлы"
 NW14_SOV_siberian_nodes_desc:0 "Магистраль соединяет огромную территорию, но каждый перегруженный узел задерживает всю линию. Сосредоточим инвестиции на самых тесных участках."
 NW14_SOV_army_standard:0 "Единый армейский стандарт"
 NW14_SOV_army_standard_desc:0 "Склады хранят слишком много несовместимого имущества. Новые закупки подчинят единому стандарту обслуживания и боеприпасов."
 NW14_SOV_aviation_schools:0 "Авиационные школы"
 NW14_SOV_aviation_schools_desc:0 "Лётчик и механик должны учиться вместе. Школы подготовят кадры для разведки, связи и будущих боевых частей."
 NW14_SOV_polytechnic_network:0 "Сеть политехникумов"
 NW14_SOV_polytechnic_network_desc:0 "Империи или республике одинаково нужны инженеры. Откроем дополнительную исследовательскую линию на базе региональных институтов."
 NW14_AUS_four_crowns:0 "Четыре короны одного государства"
 NW14_AUS_four_crowns_desc:0 "Вена представляет федерацию, но не вправе забывать Венгрию, Славонию и Богемо-Галицкое королевство. Начнём новую сессию общего совета."
 NW14_AUS_federal_accounts:0 "Федеральные счета"
 NW14_AUS_federal_accounts_desc:0 "Королевства спорят о взносах, не доверяя общей смете. Опубликуем доходы и расходы прежде, чем просить новые полномочия."
 NW14_AUS_crown_conference:0 "Конференция корон"
 NW14_AUS_crown_conference_desc:0 "У каждой делегации свои опасения. Регулярные заседания позволят согласовывать решения до того, как спор попадёт на первые полосы газет."
 NW14_AUS_language_registry:0 "Реестр языковых прав"
 NW14_AUS_language_registry_desc:0 "Общие учреждения должны уметь отвечать подданным на понятном языке. Ведомства составят перечни услуг и подготовят переводчиков."
 NW14_AUS_federal_choice:0 "Договор или вертикаль?"
 NW14_AUS_federal_choice_desc:0 "Федерацию можно укрепить согласием королевств или расширением венских полномочий. Оба пути имеют цену, которую нельзя скрыть за династической формулой."
 NW14_AUS_renewed_compact:0 "Обновлённый федеральный договор"
 NW14_AUS_renewed_compact_desc:0 "Предложим королевствам новый договор с правом обсуждения бюджета. Их согласие придётся заслужить уступками."
 NW14_AUS_budapest_terms:0 "Условия Будапешта"
 NW14_AUS_budapest_terms_desc:0 "Венгрия получит проект финансовых гарантий и возможность ответить. Отказ не завершит переговоры, но заставит Вену изменить предложение."
 NW14_AUS_prague_terms:0 "Пражское согласование"
 NW14_AUS_prague_terms_desc:0 "Богемо-Галицкое королевство требует равного доступа к общему рынку и защиты языков. Направим проект его правительству."
 NW14_AUS_slavonian_terms:0 "Славонские гарантии"
 NW14_AUS_slavonian_terms_desc:0 "Загреб опасается, что федерация сведётся к венско-будапештской сделке. Славония получит отдельное место за столом и свой ответ на проект."
 NW14_AUS_federal_ratification:0 "Ратификация четырёх корон"
 NW14_AUS_federal_ratification_desc:0 "Новый порядок вступит в силу после согласия всех трёх внутренних королевств. Без их подписей церемония останется пустым жестом."
 NW14_AUS_vienna_directive:0 "Венская директива"
 NW14_AUS_vienna_directive_desc:0 "Общее правительство потребует большей свободы распределения средств. Королевства увидят в этом пересмотр недавних гарантий."
 NW14_AUS_common_inspectorate:0 "Общая инспекция"
 NW14_AUS_common_inspectorate_desc:0 "Инспекторы проверят исполнение федеральных решений. Каждый успешный аудит усилит центр и увеличит трения с местными министерствами."
 NW14_AUS_uniform_tariffs:0 "Единый тарифный приказ"
 NW14_AUS_uniform_tariffs_desc:0 "Различия пошлин будут устранены распоряжением Вены. Экономический выигрыш не отменяет политической цены такого способа управления."
 NW14_AUS_army_statute:0 "Общеимперский армейский устав"
 NW14_AUS_army_statute_desc:0 "Войска королевств сохранят названия частей, но получат единые правила подготовки. Это расширит власть штаба, не уничтожая армии субъектов."
 NW14_AUS_limited_centralism:0 "Пределы централизации"
 NW14_AUS_limited_centralism_desc:0 "Закрепим достигнутые полномочия и прекратим их чрезвычайное расширение. Центр станет сильнее, но федерация сохранит отдельные королевства."
 NW14_AUS_danube_commission:0 "Дунайская комиссия"
 NW14_AUS_danube_commission_desc:0 "Речной путь связывает земли лучше многих деклараций. Комиссия согласует правила перевозок и портовые сборы."
 NW14_AUS_vienna_works:0 "Венские заводы"
 NW14_AUS_vienna_works_desc:0 "Общие заказы должны поддерживать современные мощности, а не только старые связи. Дополнительный завод станет первым результатом новой сметы."
 NW14_AUS_bohemian_tools:0 "Богемские станки"
 NW14_AUS_bohemian_tools_desc:0 "Пражским предприятиям предложат совместные исследования станкостроения. Федерация получит технологический выигрыш, не забирая заводы у королевства."
 NW14_AUS_adriatic_yards:0 "Адриатические верфи"
 NW14_AUS_adriatic_yards_desc:0 "Флот охраняет длинное побережье и торговые пути. Расширение ремонтной базы принесёт больше пользы, чем показательный закладочный праздник."
 NW14_AUS_albanian_credit:0 "Албанский кредит"
 NW14_AUS_albanian_credit_desc:0 "Тирана независима и может отвергнуть наши условия. Предложим хозяйственный кредит с взаимной торговой выгодой вместо политического подчинения."
 NW14_AUS_rail_clearing:0 "Железнодорожный клиринг"
 NW14_AUS_rail_clearing_desc:0 "Общий расчётный центр устранит задержки между перевозчиками королевств. Доступ к линии не должен каждый раз становиться дипломатическим вопросом."
 NW14_AUS_social_insurance:0 "Переносимое страхование"
 NW14_AUS_social_insurance_desc:0 "Рабочий, переехавший из одного королевства в другое, не должен терять накопленные права. Согласуем взаимный учёт взносов."
 NW14_AUS_federal_patents:0 "Федеральные патенты"
 NW14_AUS_federal_patents_desc:0 "Изобретателю достаточно одной заявки для защиты в общем рынке. Сократим расходы на повторную регистрацию и поддержим исследовательские проекты."
 NW14_AUS_public_procurement:0 "Открытые федеральные закупки"
 NW14_AUS_public_procurement_desc:0 "Контракт будет зависеть от цены и качества, а не языка директора. Открытые конкурсы снизят недоверие королевств к общему бюджету."
 NW14_AUS_danube_workshop:0 "Дунайская мастерская"
 NW14_AUS_danube_workshop_desc:0 "Общий рынок начинает работать как связанное хозяйство. Укрепим производственные цепочки, сохраняя самостоятельность местных предприятий."
 NW14_AUS_federal_staff:0 "Федеральный штаб"
 NW14_AUS_federal_staff_desc:0 "Штаб должен знать силы всех королевств и пределы своих полномочий. Совместные учения станут проверкой договорённостей."
 NW14_AUS_mountain_schools:0 "Горные школы"
 NW14_AUS_mountain_schools_desc:0 "Альпийская местность требует специальной подготовки. Опыт инструкторов будет доступен частям всех королевств."
 NW14_AUS_common_artillery:0 "Общая артиллерийская программа"
 NW14_AUS_common_artillery_desc:0 "Единые боеприпасы сократят расходы общего снабжения. Производители сохранят конкуренцию в пределах согласованного стандарта."
 NW14_AUS_adriatic_patrol:0 "Адриатический дозор"
 NW14_AUS_adriatic_patrol_desc:0 "Ремонт, связь и разведка определяют готовность флота не меньше числа кораблей. Проведём совместные учения портовых служб."
 NW14_AUS_air_liaison:0 "Воздушная связь королевств"
 NW14_AUS_air_liaison_desc:0 "Разведывательные самолёты должны передавать сведения любому союзному штабу. Общая подготовка связистов устранит языковые и технические барьеры."
 NW14_AUS_reserve_muster:0 "Сбор резервистов"
 NW14_AUS_reserve_muster_desc:0 "Проверим, сколько людей действительно прибывает по мобилизационным спискам. Исправленные реестры полезнее завышенных докладов."
 NW14_AUS_federal_academy:0 "Федеральная академия"
 NW14_AUS_federal_academy_desc:0 "Инженеры и штабные специалисты королевств получат общую площадку обучения. Новая исследовательская линия будет финансироваться из согласованной сметы."
 NW14_AUS_ferdinands_audience:0 "Последняя большая аудиенция"
 NW14_AUS_ferdinands_audience_desc:0 "Франц Фердинанд выслушает отчёт о будущем федерации. Право корон на участие в управлении должно пережить самого монарха."
 NW14_AUS_otto_preparation:0 "Подготовка Отто"
 NW14_AUS_otto_preparation_desc:0 "Наследник познакомится с правительствами всех королевств. Преемственность требует доверия, которого нельзя получить одним титулом."
 NW14_AUS_federation_endures:0 "Федерация переживёт своих создателей"
 NW14_AUS_federation_endures_desc:0 "Династия дала государству начало, но его устойчивость обеспечат работающие договоры. Закрепим порядок передачи полномочий и разрешения споров."
 NW14_HUN_budapest_session:0 "Будапештская сессия"
 NW14_HUN_budapest_session_desc:0 "Венгерская корона входит в федерацию со своей памятью о кризисе 1918–1922 годов. Сейм начнёт работу с вопроса, какие гарантии действительно действуют."
 NW14_HUN_county_reports:0 "Доклады комитатов"
 NW14_HUN_county_reports_desc:0 "Столица не может говорить от имени всей страны, не слыша местные органы. Сведём налоговые и хозяйственные отчёты в общую картину."
 NW14_HUN_minority_petitions:0 "Петиции меньшинств"
 NW14_HUN_minority_petitions_desc:0 "Словаки, румыны и другие подданные требуют понятного доступа к учреждениям. Рассмотрение петиций позволит снять часть напряжения без пересмотра границ."
 NW14_HUN_budget_scrutiny:0 "Проверка венгерского бюджета"
 NW14_HUN_budget_scrutiny_desc:0 "Отдельная смета имеет смысл лишь при контроле расходов. Сейм проверит военные, школьные и дорожные статьи."
 NW14_HUN_hungarian_choice:0 "Венгрия в общем доме"
 NW14_HUN_hungarian_choice_desc:0 "Будущее королевства зависит от того, станет ли федерация договором равных или ареной постоянного сопротивления. Определим позицию Будапешта."
 NW14_HUN_federal_partner:0 "Равноправный партнёр"
 NW14_HUN_federal_partner_desc:0 "Поддержим реформу федерации при сохранении венгерского бюджета и местного управления. Вена получит переговорщика, а не безусловное согласие."
 NW14_HUN_tax_compromise:0 "Налоговый компромисс"
 NW14_HUN_tax_compromise_desc:0 "Общие расходы будут оплачены по заранее известной формуле. Королевство откажется от части свободы манёвра в обмен на предсказуемость взносов."
 NW14_HUN_language_settlement:0 "Языковое соглашение"
 NW14_HUN_language_settlement_desc:0 "Государственная лояльность не требует одинакового языка дома. Установим понятные правила делопроизводства и школьного обучения."
 NW14_HUN_joint_committees:0 "Совместные комиссии"
 NW14_HUN_joint_committees_desc:0 "Венгерские представители получат постоянное участие в федеральных решениях. Порядок обсуждения важнее редких торжественных встреч."
 NW14_HUN_loyal_crown:0 "Корона договорной верности"
 NW14_HUN_loyal_crown_desc:0 "Лояльность федерации будет опираться на исполненный договор. Венгрия сохранит самостоятельное правительство и вклад в общее государство."
 NW14_HUN_historic_rights:0 "Исторические права короны"
 NW14_HUN_historic_rights_desc:0 "Сейм потребует более строгих пределов полномочий Вены. Это спор о действующем договоре, а не автоматическое объявление независимости."
 NW14_HUN_withhold_transfer:0 "Приостановить спорный взнос"
 NW14_HUN_withhold_transfer_desc:0 "Удержание части средств заставит федеральный центр вернуться к переговорам. Финансовый выигрыш сопровождается падением общего доверия."
 NW14_HUN_constitutional_protest:0 "Конституционный протест"
 NW14_HUN_constitutional_protest_desc:0 "Оформим возражения через сейм и суды. Законная процедура сохранит пространство для соглашения, когда политическая риторика иссякнет."
 NW14_HUN_renegotiate_dualism:0 "Пересмотреть распределение полномочий"
 NW14_HUN_renegotiate_dualism_desc:0 "Вена получит конкретный проект дополнительных венгерских гарантий. Обе стороны смогут выбрать уступку вместо нового внутреннего конфликта."
 NW14_HUN_guaranteed_autonomy:0 "Гарантированная автономия"
 NW14_HUN_guaranteed_autonomy_desc:0 "Согласованные полномочия будут закреплены без разрушения федерации. Королевство получит защиту от произвольного вмешательства, но останется частью общего государства."
 NW14_HUN_land_bank:0 "Земельный банк"
 NW14_HUN_land_bank_desc:0 "Крестьянам нужны доступные займы, а бюджету — платёжеспособное хозяйство. Банк начнёт с долгосрочного кредита на инвентарь и улучшение земли."
 NW14_HUN_budapest_industry:0 "Промышленный Будапешт"
 NW14_HUN_budapest_industry_desc:0 "Столичная промышленность должна расти за пределами привычного круга подрядчиков. Откроем новый комплекс с конкурсным размещением заказов."
 NW14_HUN_tisa_bridges:0 "Мосты через Тису"
 NW14_HUN_tisa_bridges_desc:0 "Надёжные переправы облегчат торговлю и передвижение войск. Начнём с участков, где сезонная вода регулярно разрывает сообщение."
 NW14_HUN_food_contracts:0 "Продовольственные контракты"
 NW14_HUN_food_contracts_desc:0 "Федеральные поставки могут приносить доход, если цены и сроки известны заранее. Долгосрочные договоры снизят потери сельского хозяйства."
 NW14_HUN_technical_colleges:0 "Технические колледжи"
 NW14_HUN_technical_colleges_desc:0 "Промышленности нужны мастера, способные обслуживать сложное оборудование. Поддержим учебные заведения за пределами столицы."
 NW14_HUN_honved_reform:0 "Реформа гонведа"
 NW14_HUN_honved_reform_desc:0 "Венгерские части сохранят традиции и получат современную организацию. Совместимость с федеральной армией не требует исчезновения национальных полков."
 NW14_HUN_artillery_works:0 "Артиллерийские мастерские"
 NW14_HUN_artillery_works_desc:0 "Ремонт собственными силами уменьшит зависимость от дальних арсеналов. Предприятия начнут с освоения общего стандарта боеприпасов."
 NW14_HUN_border_exercises:0 "Пограничные учения"
 NW14_HUN_border_exercises_desc:0 "Штабы отработают оборону и связь с соседними королевствами. Учения покажут, какие обещания общего командования работают на практике."
 NW14_HUN_aviation_workshop:0 "Авиационная мастерская"
 NW14_HUN_aviation_workshop_desc:0 "Королевству нужна ремонтная база для подготовки лётчиков и эксплуатации самолётов. Начнём с технологии обслуживания и сборки."
 NW14_HUN_danubian_kingdom:0 "Дунайское королевство"
 NW14_HUN_danubian_kingdom_desc:0 "Венгрия соединит собственные учреждения с преимуществами общего рынка. Устойчивость королевства будет измеряться работой хозяйства, а не громкостью споров с Веной."
 nw14.1.t:0 "Письмо из Неаполя"
 nw14.1.d:0 "ИСР просит солидарности германских рабочих. КПГ требует политического признания её революционного опыта; руководство СДПГ предлагает помощь без обязательства повторить итальянский путь."
 nw14.1.a:0 "Помощь рабочим, но собственный политический путь."
 nw14.1.b:0 "Пусть партии открыто обсудят итальянский опыт."
