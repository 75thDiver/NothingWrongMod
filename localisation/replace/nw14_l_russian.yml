 nw14.10.t:0 "Перед последним шагом"
 nw14.10.d:0 "Революционный комитет готов объявить восстание. Это необратимый переход: армия расколется, Бавария и польское движение создадут собственные власти, а все четыре лагеря окажутся в войне друг с другом. Франция займёт находящийся под германским контролем Эльзас. Подготовка гарнизонов позволит сохранить больше регулярных войск."
 nw14.10.a:0 "Начать революцию."
 nw14.10.b:0 "Отложить выступление; вернуться к нему через решения."
 nw14.20.t:0 "День смерти Алексея"
 nw14.20.d:0 "Последний бюллетень ожидается со дня на день. Эсеры и РСДРП договорились поднять восстание после смерти царя. Выбор начала закрепит этот исход: кроме монархического центра возникнут донское, украинское и сибирское правительства. Все пять лагерей будут воевать друг с другом. Пока приказ не отдан, сценарий смерти и восстания можно отложить."
 nw14.20.a:0 "Смерть царя станет сигналом восстания."
 nw14.20.b:0 "Отложить решение и продолжить подготовку."
 nw14.30.t:0 "Приглашение в Панъевропейский союз"
 nw14.30.d:0 "Германия предлагает союз парламентских государств. Участие означает общую безопасность, но не передачу суверенитета Берлину."
 nw14.30.a:0 "Принять приглашение."
 nw14.30.b:0 "Сохранить самостоятельную внешнюю политику."
 nw14.31.t:0 "Германское предложение ИСР"
 nw14.31.d:0 "Берлин предлагает равноправный союз революционных государств. Германская промышленность может стать опорой общего движения, но решение об участии остаётся за нами."
 nw14.31.a:0 "Учредить совместный революционный союз."
 nw14.31.b:0 "Сотрудничать без военного союза."
 nw14.32.t:0 "Предложение советской России"
 nw14.32.d:0 "Российское правительство предлагает связать революционные государства общим договором. Это приглашение к союзу, а не требование признать единственный центр мирового движения."
 nw14.32.a:0 "Заключить союз."
 nw14.32.b:0 "Ограничиться обменом опытом."
 nw14.40.t:0 "Проект федерального договора"
 nw14.40.d:0 "Вена предлагает закрепить участие королевства в общем бюджете и управлении. Подписание укрепит федерацию; отказ потребует новых уступок. Ни один ответ не отменяет существующий статус королевства."
 nw14.40.a:0 "Подписать проект."
 nw14.40.b:0 "Потребовать новых гарантий."
 nw14.41.t:0 "Проект федерального договора"
 nw14.41.d:0 "Вена предлагает закрепить участие королевства в общем бюджете и управлении. Подписание укрепит федерацию; отказ потребует новых уступок. Ни один ответ не отменяет существующий статус королевства."
 nw14.41.a:0 "Подписать проект."
 nw14.41.b:0 "Потребовать новых гарантий."
 nw14.42.t:0 "Проект федерального договора"
 nw14.42.d:0 "Вена предлагает закрепить участие королевства в общем бюджете и управлении. Подписание укрепит федерацию; отказ потребует новых уступок. Ни один ответ не отменяет существующий статус королевства."
 nw14.42.a:0 "Подписать проект."
 nw14.42.b:0 "Потребовать новых гарантий."
 nw14.43.t:0 "Венгерские гарантии"
 nw14.43.d:0 "Будапешт требует закрепить пределы федерального вмешательства. Согласие укрепит доверие, но потребует политической уступки; отказ оставит спор открытым."
 nw14.43.a:0 "Закрепить дополнительные гарантии."
 nw14.43.b:0 "Вернуться к действующему договору."
 nw14.45.t:0 "Предложение австрийского кредита"
 nw14.45.d:0 "Вена предлагает льготные хозяйственные контракты. Соглашение не меняет независимого статуса Албании и не передаёт Австрии управление армией или дипломатией."
 nw14.45.a:0 "Заключить хозяйственное соглашение."
 nw14.45.b:0 "Отказаться от новых обязательств."
 nw14_reichstag:0 "Германский рейхстаг"
 nw14_reichstag_desc:0 "397 мандатов; обычное большинство — 199, конституционное — 265. Переговоры меняют поддержку кабинета, а не число мест. Диаграмма показывает каждый мандат отдельно. Напряжение растёт на 2 в месяц до завершения кризиса; при 70 и выше начинается парламентский тупик."
 nw14_mediation:0 "Посредничество председателя"
 nw14_mediation_desc:0 "Переговоры с фракциями снизят напряжение на 15. Мандаты не перераспределяются."
 nw14_coal_centre:0 "Соглашение с Центром"
 nw14_coal_centre_desc:0 "Партия поддержит кабинет. Цена отражает политические уступки; её места останутся собственными."
 nw14_leave_centre:0 "Прекратить соглашение с Центром"
 nw14_leave_centre_desc:0 "Поддержка партии будет вычтена из правительственного большинства. Состав рейхстага останется прежним."
 nw14_coal_fvp:0 "Соглашение с Прогрессивной народной партией"
 nw14_coal_fvp_desc:0 "Партия поддержит кабинет. Цена отражает политические уступки; её места останутся собственными."
 nw14_leave_fvp:0 "Прекратить соглашение с Прогрессивной народной партией"
 nw14_leave_fvp_desc:0 "Поддержка партии будет вычтена из правительственного большинства. Состав рейхстага останется прежним."
 nw14_by_elections:0 "Дополнительные выборы по вакантным округам"
 nw14_by_elections_desc:0 "В условиях запрещённой левой оппозиции свободные мандаты получат НННП, Центр и прогрессисты. Один раунд распределяет 20 мест: 10, 6 и 4. Такие выборы не восстанавливают прежнюю представительность."
 nw14_election:0 "Очередные парламентские выборы"
 nw14_election_desc:0 "После объединения левых проводятся свободные выборы. При напряжении ниже 50 объединённые социал-демократы получат 225 мест; иначе — 185. Остальные мандаты разделят Центр, прогрессисты и НННП. Это сценарная модель выборов, а не исторический результат."
 nw14_revolution:0 "Революционная организация"
 nw14_revolution_desc:0 "Фонд операций: [?nw_network|0]/100. Накопление требует политической работы. После создания постоянного международного фонда добавляется 4 пункта в месяц. Зарубежное восстание требует подготовки 80, коммунистической поддержки более 30% и стабильности ниже 45%."
 nw14_organise:0 "Взносы и подготовка связных"
 nw14_organise_desc:0 "Фонд операций увеличится на 15, максимум до 100."
 nw14_resume_ger:0 "Вернуться к плану восстания"
 nw14_resume_ger_desc:0 "Повторно открыть предупреждение о начале многосторонней гражданской войны."
 nw14_cells_FRA:0 "Поддержать рабочие связи в Франции"
 nw14_cells_FRA_desc:0 "Расход: 15 фонда. Подготовка в стране вырастет на 20, коммунистическая популярность — на 5 пунктов. Местное правительство сможет организовать противодействие; подготовка там сейчас: [?FRA.nw_foreign_preparation|0]/100."
 nw14_rising_FRA:0 "Поддержать восстание в Франции"
 nw14_rising_FRA_desc:0 "Расход: 40 фонда. В стране начнётся коммунистическая гражданская война. Если у Германии есть революционный союз, восставшая сторона получит приглашение в него. Война не гарантирует её победы."
