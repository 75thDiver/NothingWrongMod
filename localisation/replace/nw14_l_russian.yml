 nw14_russia:0 "Российский политический кризис"
 nw14_russia_desc:0 "Здоровье Алексея: [?nw_health|0]/100. Доверие губерний: [?nw_trust|0]/100. Поддержка командования: [?nw_army_loyalty|0]/100. Подготовка оппозиции: [?nw_opposition|0]/100. Болезнь снижает здоровье на 1 в месяц до выздоровления или смерти; сама по себе нулевая шкала не запускает войну. Необратимый исход выбирается в фокусах."
 nw14_treatment:0 "Продолжить врачебную программу"
 nw14_treatment_desc:0 "Здоровье царя увеличится на 12; политическая цена отражает затраты кабинета и двора."
 nw14_zemstvo_meeting:0 "Совещание земских представителей"
 nw14_zemstvo_meeting_desc:0 "Доверие губерний увеличится на 12. При доверии ниже 25 страна получает штраф отчуждения губерний."
 nw14_officers:0 "Совещание командующих"
 nw14_officers_desc:0 "Поддержка командования увеличится на 10. Это необходимо для согласованной передачи престола Кириллу."
 nw14_opposition_meeting:0 "Согласовать подпольные комитеты"
 nw14_opposition_meeting_desc:0 "Подготовка оппозиции увеличится на 15; доверие к действующему государственному аппарату снизится на 5."
 nw14_resume_rus:0 "Вернуться к плану республиканского выступления"
 nw14_resume_rus_desc:0 "Повторно открыть предупреждение о смерти царя и начале многосторонней войны."
 nw14_federal:0 "Федеральные переговоры"
 nw14_federal_desc:0 "Доверие корон: [?AUS.nw_federal_trust|0]/100. При уровне ниже 30 общий аппарат работает с перебоями. Ратификация договора требует согласия Венгрии, Славонии и Богемо-Галицкого королевства. Королевства сохраняют территории и статус."
 nw14_federal_consult:0 "Созвать согласительную комиссию"
 nw14_federal_consult_desc:0 "Доверие корон увеличится на 15. Это позволяет выйти из тупика, сохранив действующий состав федерации."
 nw14_renew_HUN:0 "Новые гарантии для Венгрии"
 nw14_renew_HUN_desc:0 "Вена внесёт более дорогой компромиссный проект. Королевство вновь сможет ответить; территориальные полномочия не будут отменены."
 nw14_renew_CZE:0 "Новые гарантии для Богемо-Галицкого королевства"
 nw14_renew_CZE_desc:0 "Вена внесёт более дорогой компромиссный проект. Королевство вновь сможет ответить; территориальные полномочия не будут отменены."
 nw14_renew_CRO:0 "Новые гарантии для Славонии"
 nw14_renew_CRO_desc:0 "Вена внесёт более дорогой компромиссный проект. Королевство вновь сможет ответить; территориальные полномочия не будут отменены."
 nw14_sign_compact:0 "Одобрить федеральный договор"
 nw14_sign_compact_desc:0 "Королевство даст согласие на проект Вены. Это не означает прекращения собственной государственности."
 nw14_hun_renew:0 "Возобновить спор о венгерских гарантиях"
 nw14_hun_renew_desc:0 "После отказа Вены переговоры можно начать снова. Королевство не получает одностороннего права решить вопрос за федеральный центр."
 nw14_county_council:0 "Созвать представителей комитатов"
 nw14_county_council_desc:0 "Внутреннее доверие увеличится на 15. При доверии ниже 25 венгерская администрация работает с перебоями."
 nw14_deadlock:0 "Парламентский тупик"
 nw14_deadlock_desc:0 "Высокое напряжение тормозит принятие решений. Посредничество председателя помогает снять конфликт."
 nw14_provincial_distrust:0 "Отчуждение губерний"
 nw14_provincial_distrust_desc:0 "Местные общества не доверяют центральным распоряжениям. Земские совещания могут восстановить доверие."
 nw14_federal_deadlock:0 "Федеральный тупик"
 nw14_federal_deadlock_desc:0 "Недоверие корон затрудняет согласование общего бюджета."
 nw14_hungarian_deadlock:0 "Недоверие комитатов"
 nw14_hungarian_deadlock_desc:0 "Местные органы затягивают исполнение решений Будапешта."
